<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#4f46e5">
<title>HRD Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #334155; -webkit-font-smoothing: antialiased; }
  .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
  
  .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { background: rgba(255,255,255,0.98); padding: 32px 28px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 380px; }
  .login-card h1 { color: #4f46e5; text-align: center; margin-bottom: 8px; font-size: 24px; }
  .login-card p.subtitle { text-align: center; color: #64748b; margin-bottom: 28px; font-size: 13px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; transition: border-color 0.2s; background: #f8fafc; -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }
  .form-group select { cursor: pointer; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  
  .btn {
    padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s; font-family: inherit; 
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    touch-action: manipulation;
  }
  .btn-primary { background: #4f46e5; color: white; width: 100%; }
  .btn-primary:hover { background: #4338ca; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-success { background: #10b981; color: white; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warning { background: #f59e0b; color: white; }
  .btn-warning:hover { background: #d97706; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-info { background: #0ea5e9; color: white; }
  .btn-info:hover { background: #0284c7; }
  .btn-purple { background: #8b5cf6; color: white; }
  .btn-purple:hover { background: #7c3aed; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .app-wrapper { display: none; }
  .app-wrapper.active { display: block; }

  .topbar {
    background: rgba(255,255,255,0.98); padding: 14px 18px;
    border-radius: 14px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.6);
  }
  .topbar h2 { color: #4f46e5; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  
  /* ✅ FOTO PROFIL */
  .user-avatar-wrapper { position: relative; cursor: pointer; }
  .user-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
    overflow: hidden; border: 2px solid #e2e8f0;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-edit-badge {
    position: absolute; bottom: -2px; right: -2px;
    background: #4f46e5; color: white; border-radius: 50%;
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; border: 2px solid white;
  }
  
  .user-detail { text-align: right; }
  .user-detail .name { font-weight: 600; font-size: 13px; color: #1e293b; }
  .user-detail .role { font-size: 11px; color: #64748b; }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .nav-tab {
    padding: 9px 14px; background: rgba(255,255,255,0.9); border: 1px solid #e2e8f0;
    border-radius: 8px; cursor: pointer; font-weight: 500; transition: background 0.15s;
    font-family: inherit; color: #64748b; font-size: 12px; white-space: nowrap;
    touch-action: manipulation;
  }
  .nav-tab:active { background: #f1f5f9; }
  .nav-tab.active { background: #4f46e5; color: white; border-color: #4f46e5; }

  .card {
    background: rgba(255,255,255,0.98); border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.6);
  }
  .card h3 { color: #334155; margin-bottom: 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; }
  .stat-card .label { font-size: 11px; color: #64748b; font-weight: 500; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #1e293b; margin-top: 4px; }
  .stat-card.indigo { border-left: 4px solid #4f46e5; }
  .stat-card.emerald { border-left: 4px solid #10b981; }
  .stat-card.amber { border-left: 4px solid #f59e0b; }
  .stat-card.rose { border-left: 4px solid #f43f5e; }
  .stat-card.debt { border-left: 4px solid #dc2626; background: #fef2f2; }
  .stat-card.sky { border-left: 4px solid #0ea5e9; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:hover { background: #f8fafc; }
  tr.debt-row { background: #fef2f2; }

  .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #d1fae5; color: #065f46; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-minus { background: #fee2e2; color: #991b1b; }
  .badge-plus { background: #d1fae5; color: #065f46; }
  .badge-debt { background: #dc2626; color: white; font-weight: 700; }
  .badge-self { background: #f3e8ff; color: #6b21a8; }
  .badge-role { background: #e0e7ff; color: #4338ca; font-weight: 600; }

  .notification {
    background: #fffbeb; border-left: 4px solid #f59e0b; padding: 14px; border-radius: 10px;
    margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(245,158,11,0.1);
  }
  .notification .notif-text { font-size: 12px; color: #78350f; line-height: 1.5; }
  .notification .notif-text strong { color: #451a03; }
  .notification.self-leave { background: #f5f3ff; border-left-color: #8b5cf6; }
  
  .balance-info { background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-top: 6px; border: 1px solid #e2e8f0; }
  .balance-safe { color: #059669; font-weight: 600; }
  .balance-debt { color: #dc2626; font-weight: 700; }

  .debt-warning, .lock-warning, .flow-info { border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .debt-warning { background: #fef2f2; border: 2px solid #dc2626; }
  .debt-warning .icon { font-size: 32px; }
  .debt-warning .text { flex: 1; }
  .debt-warning .text strong { color: #dc2626; font-size: 16px; }
  .debt-warning .text p { color: #991b1b; font-size: 13px; margin-top: 4px; }
  .lock-warning { background: #fff7ed; border: 2px solid #f97316; }
  .lock-warning .icon { font-size: 32px; }
  .lock-warning .text strong { color: #c2410c; font-size: 15px; }
  .flow-info { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border: 2px solid #0ea5e9; }
  .flow-info .icon { font-size: 28px; }
  .flow-info .text strong { color: #0369a1; font-size: 14px; }
  .flow-info .text p { color: #075985; font-size: 12px; margin-top: 4px; }

  .leave-calculator { background: #f0fdf4; border: 2px solid #10b981; border-radius: 12px; padding: 14px; margin-top: 12px; display: none; }
  .leave-calculator.debt { background: #fef2f2; border-color: #dc2626; }
  .leave-calculator .calc-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #e2e8f0; }
  .leave-calculator .calc-row:last-child { border-bottom: none; font-weight: 700; font-size: 14px; }
  .leave-calculator .calc-label { color: #475569; }
  .leave-calculator .calc-value { color: #1e293b; font-weight: 600; }
  .leave-calculator.debt .calc-value { color: #dc2626; }
  .leave-calculator .debt-alert { background: #dc2626; color: white; padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center; }

  .reviewer-badge { display: inline-flex; align-items: center; gap: 4px; background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-top: 4px; }
  .reviewer-badge.rejected { background: #fee2e2; color: #991b1b; }
  .reviewer-badge.director { background: #f3e8ff; color: #6b21a8; }

  .filter-bar, .search-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; }
  .filter-bar label, .search-bar label { font-size: 13px; font-weight: 500; color: #475569; display: flex; align-items: center; gap: 6px; }
  .filter-bar select, .filter-bar input, .search-bar input { flex: 1; min-width: 180px; }
  .search-bar input { padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: white; }
  .search-bar input:focus { outline: none; border-color: #4f46e5; }
  .search-bar .result-count { font-size: 12px; color: #64748b; background: #e2e8f0; padding: 4px 10px; border-radius: 12px; font-weight: 500; }

  .chart-container { position: relative; height: 280px; margin: 16px 0; }
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .chart-card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; }
  .chart-card h4 { font-size: 13px; color: #475569; margin-bottom: 12px; font-weight: 600; }

  .empty-state { text-align: center; padding: 30px 15px; color: #94a3b8; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
  .modal-overlay.active { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); -webkit-overflow-scrolling: touch; }
  .modal h3 { color: #4f46e5; margin-bottom: 18px; font-size: 17px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }

  .hint-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #1e40af; margin-bottom: 14px; }
  .hint-box.warning { background: #fef3c7; border-left-color: #f59e0b; color: #92400e; }
  .hint-box.danger { background: #fee2e2; border-left-color: #ef4444; color: #991b1b; }
  .hint-box.success { background: #d1fae5; border-left-color: #10b981; color: #065f46; }
  .hint-box.orange { background: #fff7ed; border-left-color: #f97316; color: #9a3412; }
  .hint-box.purple { background: #f5f3ff; border-left-color: #8b5cf6; color: #6b21a8; }
  .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  
  .loading-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: #64748b; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; font-weight: 500; }
  .loading-subtext { font-size: 12px; color: #94a3b8; margin-top: 4px; }

  .error-box { background: #fee2e2; border: 2px solid #ef4444; border-radius: 12px; padding: 20px; text-align: center; color: #991b1b; }
  .error-box .icon { font-size: 48px; margin-bottom: 12px; }

  .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
  
  /* ✅ ACTION BAR untuk Export/Print */
  .action-bar {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    padding: 12px; border-radius: 10px; border: 1px solid #bae6fd;
  }
  .action-bar .action-label { font-size: 13px; font-weight: 600; color: #0369a1; margin-right: auto; }
  
  /* ✅ FOTO PROFIL DI TABEL */
  .profile-photo-cell { display: flex; align-items: center; gap: 8px; }
  .profile-photo {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; overflow: hidden; border: 2px solid #e2e8f0;
    flex-shrink: 0;
  }
  .profile-photo img { width: 100%; height: 100%; object-fit: cover; }

  /* ✅ UPLOAD FOTO MODAL */
  .photo-upload-preview {
    width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 16px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 48px; overflow: hidden; border: 3px solid #e2e8f0;
  }
  .photo-upload-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-upload-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  
  /* ✅ CSS PRINT - Hanya tampilkan konten penting */
  @media print {
    body { background: white !important; }
    .topbar, .nav-tabs, .btn, .action-bar, .modal-overlay, .search-bar, .filter-bar, .hint-box, .debt-warning, .lock-warning, .flow-info { display: none !important; }
    .container { padding: 0; max-width: 100%; }
    .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
    .app-wrapper { display: block !important; }
    #mainContent { display: block !important; }
    table { font-size: 11px; }
    th, td { padding: 6px 4px; }
    .print-header { display: block !important; text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #4f46e5; }
    .print-header h1 { color: #4f46e5; font-size: 20px; margin-bottom: 4px; }
    .print-header p { color: #64748b; font-size: 12px; }
  }
  .print-header { display: none; }

  @media (max-width: 640px) {
    .container { padding: 10px; }
    .login-card { padding: 24px 20px; }
    .topbar { flex-direction: column; gap: 12px; text-align: center; padding: 12px 14px; }
    .user-detail { text-align: center; }
    .user-info { flex-direction: row-reverse; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .card { padding: 14px; }
    .nav-tabs { gap: 4px; }
    .nav-tab { padding: 8px 12px; font-size: 11px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .notification { flex-direction: column; align-items: stretch; }
    .modal { padding: 20px; border-radius: 12px; }
    .chart-grid { grid-template-columns: 1fr; }
    .filter-bar, .search-bar, .action-bar { flex-direction: column; align-items: stretch; }
    .filter-bar select, .filter-bar input, .search-bar input { width: 100%; min-width: unset; }
    .stat-card .value { font-size: 20px; }
    .btn-sm { padding: 5px 8px; font-size: 11px; }
    .action-bar .btn { width: 100%; }
  }
  
  @media (max-width: 360px) {
    .stats-grid { grid-template-columns: 1fr; }
    .btn-group { flex-direction: column; }
    .btn-group .btn { width: 100%; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <h1>🌿 HRD Portal</h1>
    <p class="subtitle">Sistem Manajemen Karyawan & Cuti</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Masukkan username" autocomplete="username" inputmode="text">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password" inputmode="text">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
    <div class="hint-box" style="margin-top: 16px; text-align: center;">💡 Huruf besar/kecil tidak masalah</div>
  </div>
</div>

<!-- APP SCREEN -->
<div class="app-wrapper" id="appScreen">
  <div class="container">
    <div class="topbar">
      <h2> HRD Portal</h2>
      <div class="user-info">
        <div class="user-detail">
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
        <!-- ✅ FOTO PROFIL KLIKABLE -->
        <div class="user-avatar-wrapper" onclick="openPhotoUpload()" title="Klik untuk ganti foto">
          <div class="user-avatar" id="userAvatar">-</div>
          <div class="avatar-edit-badge">📷</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="doLogout()">Keluar</button>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs"></div>
    <div id="mainContent">
      <div class="loading-wrapper">
        <div class="spinner"></div>
        <div class="loading-text">Memuat aplikasi...</div>
        <div class="loading-subtext">Mohon tunggu</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- INPUT FILE TERSEMBUNYI untuk upload foto -->
<input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">

<!-- PRINT HEADER (hanya muncul saat print) -->
<div class="print-header" id="printHeader">
  <h1>🌿 HRD Portal - Laporan Cuti Karyawan</h1>
  <p id="printSubtitle"></p>
  <p id="printDate"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { 
    getFirestore, collection, getDocs, getDoc, addDoc, setDoc, updateDoc, deleteDoc, doc, 
    query, where, writeBatch 
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhGxzuzU-pQo6p8xJwdmC6bQIZV-po-A4",
    authDomain: "hrd-portal-9a5fd.firebaseapp.com",
    projectId: "hrd-portal-9a5fd",
    storageBucket: "hrd-portal-9a5fd.firebasestorage.app",
    messagingSenderId: "938883233737",
    appId: "1:938883233737:web:9368aac16b5b6a12685a18"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;

  const dataCache = { employees: null, users: null, leaveRequests: null, adjustmentRequests: null, lastFetch: 0, CACHE_TTL: 30000 };
  let currentUser = null;
  let currentUserDocId = null;
  let chartLoaded = false;
  let sheetJSLoaded = false;

  const ROLE_LABEL = { superuser: 'Superuser', direktur: 'Direktur', komisaris: 'Komisaris', kepala_hrd: 'Kepala HRD', staff_hrd: 'Staff HRD', staff: 'Staff Biasa' };

  const LEAVE_REASONS = [
    { value: '', label: '-- Pilih Alasan Cuti --' },
    { value: 'Cuti Tahunan', label: '️ Cuti Tahunan' },
    { value: 'Cuti Sakit', label: ' Cuti Sakit' },
    { value: 'Cuti Besar', label: '🏝️ Cuti Besar (6 tahun)' },

  function getLeaveLockStatus() {
    const now = new Date();
    if (now.getDate() <= 10) return { locked: false, message: '' };
    const lastMonth = now.getMonth() === 0 ? 11 : now.getMonth() - 1;
    const lastMonthYear = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
    const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return { locked: true, lockedMonth: lastMonth, lockedYear: lastMonthYear, message: `🔒 Cuti bulan ${monthNames[lastMonth]} ${lastMonthYear} dikunci (lock tgl 10 ${monthNames[now.getMonth()]})` };
  }
  function isDateLocked(dateStr) { const lock = getLeaveLockStatus(); if (!lock.locked) return false; const d = new Date(dateStr); return d.getMonth() === lock.lockedMonth && d.getFullYear() === lock.lockedYear; }
  function getStatusLabel(status) { return { 'pending_staff': 'Menunggu Staff HRD', 'pending_staff_hrd_peer': 'Menunggu Review Staff HRD', 'pending_head': 'Menunggu Kepala HRD', 'pending_director': 'Menunggu Direktur', 'approved': 'Disetujui', 'rejected': 'Ditolak' }[status] || status; }
  function getLeaveDateForReport(l) { if (l.status === 'approved') return l.directorApprovedAt || l.headApprovedAt || l.createdAt; if (l.status === 'rejected') return l.directorRejectedAt || l.rejectedAt || l.createdAt; return l.createdAt; }

  async function fetchCollection(name) {
    const now = Date.now();
    if (dataCache[name] && (now - dataCache.lastFetch) < dataCache.CACHE_TTL) return dataCache[name];
    try {
      const snap = await getDocs(collection(db, name));
      dataCache[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      dataCache.lastFetch = now;
      return dataCache[name];
    } catch (e) { console.error(`Error fetching ${name}:`, e); return dataCache[name] || []; }
  }
  function invalidateCache() { dataCache.lastFetch = 0; }

  async function ensureMonthlyReport() {
    const now = new Date();
    if (now.getDate() < 11) return null;
    const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const reportId = `report_${monthKey}`;
    const existingRef = doc(db, 'monthlyReports', reportId);
    const existingSnap = await getDoc(existingRef);
    if (existingSnap.exists()) return existingSnap.data();
    
    const [employees, allLeaves, allAdjusts] = await Promise.all([fetchCollection('employees'), fetchCollection('leaveRequests'), fetchCollection('adjustmentRequests')]);
    const monthLeaves = allLeaves.filter(l => { const d = new Date(getLeaveDateForReport(l) || 0); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
    const monthAdjusts = allAdjusts.filter(a => { const d = new Date(a.requestedAt || a.approvedAt || a.rejectedAt || 0); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
    const approved = monthLeaves.filter(l => l.status === 'approved');
    const rejected = monthLeaves.filter(l => l.status === 'rejected');
    const pending = monthLeaves.filter(l => l.status.startsWith('pending'));
    const totalLeaveDays = approved.reduce((sum, l) => sum + daysBetween(l.startDate, l.endDate), 0);
    const leaveByEmployee = {};
    approved.forEach(l => { const days = daysBetween(l.startDate, l.endDate); leaveByEmployee[l.employeeName] = (leaveByEmployee[l.employeeName] || 0) + days; });
    const reasonCount = {};
    approved.forEach(l => { const reason = (l.reasonType || l.reason || 'Lainnya').toUpperCase().trim(); reasonCount[reason] = (reasonCount[reason] || 0) + 1; });
    
    const report = {
      monthKey, generatedAt: now.toISOString(), totalEmployees: employees.length, totalLeaveRequests: monthLeaves.length,
      approved: approved.length, rejected: rejected.length, pending: pending.length, totalLeaveDaysUsed: totalLeaveDays,
      averageLeavePerEmployee: employees.length > 0 ? (totalLeaveDays / employees.length).toFixed(1) : 0,
      employeesWithDebt: employees.filter(e => e.leaveBalance < 0).map(e => ({ name: e.name, debt: Math.abs(e.leaveBalance), id: e.id })),
      topLeaveUsers: Object.entries(leaveByEmployee).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([name, days]) => ({ name, days })),
      leaveByReason: reasonCount,
      balanceDistribution: { positive: employees.filter(e => e.leaveBalance > 0).length, zero: employees.filter(e => e.leaveBalance === 0).length, negative: employees.filter(e => e.leaveBalance < 0).length },
      totalBalanceCompany: employees.reduce((sum, e) => sum + e.leaveBalance, 0),
      averageBalance: employees.length > 0 ? (employees.reduce((sum, e) => sum + e.leaveBalance, 0) / employees.length).toFixed(1) : 0,
      totalAdjustments: monthAdjusts.length, approvedAdjustments: monthAdjusts.filter(a => a.status === 'approved').length
    };
    await setDoc(existingRef, report);
    return report;
  }

  // ✅ Helper: Resize image ke ukuran tertentu dan return base64
  function resizeImage(file, maxWidth, maxHeight) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          
          // Hitung aspect ratio
          if (width > height) {
            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
          } else {
            if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // Convert ke base64 dengan kualitas 0.8
          const base64 = canvas.toDataURL('image/jpeg', 0.8);
          resolve(base64);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderMyNotifications(notifications) {
    if (notifications.length === 0) return `<div class="empty-state" style="padding:20px"><div class="icon">🔔</div><p>Belum ada notifikasi.</p></div>`;
    return notifications.map(n => {
      const isLeave = n.startDate !== undefined;
      const type = isLeave ? 'Pengajuan Cuti' : 'Request Adjust';
      const days = isLeave ? daysBetween(n.startDate, n.endDate) : n.adjustmentDays;
      const isApproved = n.status === 'approved';
      const date = isLeave ? `${fmtDate(n.startDate)} - ${fmtDate(n.endDate)}` : `${days} hari`;
      const decisionBy = n.approvedBy || n.rejectedBy || n.directorApprovedBy || n.directorRejectedBy || 'Sistem';
      const decisionDate = n.headApprovedAt || n.rejectedAt || n.approvedAt || n.directorApprovedAt || n.directorRejectedAt || 0;
      return `<div class="notification" style="border-left-color:${isApproved?'#10b981':'#ef4444'};background:${isApproved?'#f0fdf4':'#fef2f2'};margin-bottom:8px"><div class="notif-text" style="color:${isApproved?'#065f46':'#991b1b'}"><strong>${type}</strong> Anda <span class="badge ${isApproved?'badge-approved':'badge-rejected'}">${isApproved?'Disetujui':'Ditolak'}</span><br><strong>${date}</strong><br><em>${n.reason || n.note}</em><br><small style="opacity:0.8">Oleh: ${decisionBy} • ${fmtDate(decisionDate)}</small></div></div>`;
    }).join('');
  }

  async function renderDirectorApproval() {
    try {
      const emps = await fetchCollection('employees');
      const empMap = {}; emps.forEach(e => { empMap[e.id] = e; });
      const leaveReqs = await fetchCollection('leaveRequests');
      const pendingDirector = leaveReqs.filter(r => r.status === 'pending_director').sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      const processed = leaveReqs.filter(r => (r.status === 'approved' || r.status === 'rejected') && (r.directorApprovedBy || r.directorRejectedBy)).sort((a, b) => new Date(b.directorApprovedAt || b.directorRejectedAt || b.createdAt || 0).getTime() - new Date(a.directorApprovedAt || a.directorRejectedAt || a.createdAt || 0).getTime());
      
      let pendingHTML = '';
      if (pendingDirector.length === 0) {
        pendingHTML = `<div class="empty-state" style="padding:20px"><div class="icon">✨</div><p>Tidak ada pengajuan Kepala HRD menunggu.</p></div>`;
      } else {
        pendingDirector.forEach(req => {
          const days = daysBetween(req.startDate, req.endDate);
          const emp = empMap[req.employeeId];
          const currentBalance = emp ? emp.leaveBalance : 0;
          const projectedBalance = currentBalance - days;
          const isDebt = projectedBalance < 0;
          pendingHTML += `<div class="notification" style="${isDebt?'background:#fef2f2;border-left-color:#dc2626':'background:#f5f3ff;border-left-color:#8b5cf6'}"><div style="flex:1"><div class="notif-text" style="${isDebt?'color:#991b1b':'color:#5b21b6'}"><strong>${req.employeeName}</strong> <span class="badge badge-self">Kepala HRD</span> cuti <strong>${days} hari</strong><br>${fmtDate(req.startDate)} - ${fmtDate(req.endDate)}<br><em>${req.reason}</em></div><div class="balance-info">Saldo: <strong>${currentBalance} hr</strong> | Cuti: <strong>${days} hr</strong><br>${isDebt?`<span class="balance-debt">⚠️ Hutang ${Math.abs(projectedBalance)} hari</span>`:`<span class="balance-safe">✅ Sisa: ${projectedBalance} hari</span>`}</div></div><div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap"><button class="btn btn-success btn-sm" onclick="directorApprove('${req.id}')">Setujui</button><button class="btn btn-danger btn-sm" onclick="directorReject('${req.id}')">Tolak</button></div></div>`;
        });
      }

      const historyHTML = processed.length > 0 ? processed.map(r => {
        const days = daysBetween(r.startDate, r.endDate);
        const isApproved = r.status === 'approved';
        return `<tr><td><strong>${r.employeeName}</strong></td><td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td><td>${days} hr</td><td>${r.reason}</td><td><span class="badge ${isApproved?'badge-approved':'badge-rejected'}">${isApproved?'Disetujui':'Ditolak'}</span></td><td><small>${r.directorApprovedBy || r.directorRejectedBy} • ${fmtDate(r.directorApprovedAt || r.directorRejectedAt)}</small></td></tr>`;
      }).join('') : '<tr><td colspan="6" style="text-align:center;padding:20px;color:#94a3b8">Belum ada riwayat</td></tr>';
      
      return `<div class="card"><h3>✅ Approval Cuti Kepala HRD (${pendingDirector.length})</h3><div class="flow-info"><div class="icon">📋</div><div class="text"><strong>Alur: Kepala HRD → Direktur (1 langkah)</strong></div></div>${pendingHTML}</div><div class="card"><h3>📜 Riwayat Approval</h3><div class="table-wrapper"><table><thead><tr><th>Nama</th><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th><th>Keputusan</th></tr></thead><tbody>${historyHTML}</tbody></table></div></div>`;
    } catch (e) { return `<div class="card"><div class="hint-box danger">❌ Error: ${e.message}</div></div>`; }
  }

  window.onLeaveReasonChange = function() {

  window.calculateLeaveProjection = function() {
    const start = document.getElementById('leaveStart').value;
    const end = document.getElementById('leaveEnd').value;
    const calcDiv = document.getElementById('leaveCalculator');
    if (!start || !end || new Date(end) < new Date(start)) { calcDiv.style.display = 'none'; return; }
    const days = daysBetween(start, end);
    const currentBalance = parseInt(calcDiv.dataset.balance || 0);
    const projectedBalance = currentBalance - days;
    const isDebt = projectedBalance < 0;
    calcDiv.className = 'leave-calculator' + (isDebt ? ' debt' : '');
    calcDiv.style.display = 'block';
    calcDiv.innerHTML = `<div class="calc-row"><span class="calc-label">📅 Periode</span><span class="calc-value">${fmtDate(start)} - ${fmtDate(end)}</span></div><div class="calc-row"><span class="calc-label">⏱️ Durasi</span><span class="calc-value">${days} hari</span></div><div class="calc-row"><span class="calc-label">💰 Saldo</span><span class="calc-value">${currentBalance} hr</span></div><div class="calc-row"><span class="calc-label">📊 Proyeksi</span><span class="calc-value">${projectedBalance} hr</span></div>${isDebt ? `<div class="debt-alert">⚠️ HUTANG CUTI ${Math.abs(projectedBalance)} hari</div>` : `<div style="background:#10b981;color:white;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px;font-weight:600;text-align:center">✅ Saldo mencukupi</div>`}`;
  };

  window.submitLeave = async (empId, empName, currentBalance) => {
    const s = document.getElementById('leaveStart').value;
    const e = document.getElementById('leaveEnd').value;
    const reasonType = document.getElementById('leaveReasonType').value;
    const otherReasonText = document.getElementById('otherReasonText').value.trim();
    if (!s || !e) { alert('️ Pilih tanggal!'); return; }
    if (new Date(e) < new Date(s)) { alert('⚠️ Tanggal tidak valid!'); return; }
    if (!reasonType) { alert('⚠️ Pilih alasan!'); return; }
    let finalReason = reasonType;
    if (reasonType === 'Lainnya') {
      if (!otherReasonText || otherReasonText.length < 5) { alert('⚠️ Isi keterangan minimal 5 karakter!'); document.getElementById('otherReasonText').classList.add('required-field'); document.getElementById('otherReasonText').focus(); return; }
      finalReason = `Lainnya: ${otherReasonText}`;
    }
    if (isDateLocked(s) || isDateLocked(e)) { alert(`🔒 ${getLeaveLockStatus().message}`); return; }
    const days = daysBetween(s, e);
    const projectedBalance = currentBalance - days;
    if (projectedBalance < 0 && !confirm(`️ HUTANG CUTI!\n\nSaldo: ${currentBalance} hr\nCuti: ${days} hr\nProyeksi: ${projectedBalance} hr (HUTANG ${Math.abs(projectedBalance)} hr)\n\nLanjutkan?`)) return;
    let initialStatus = 'pending_staff';
    if (currentUser.role === 'staff_hrd') initialStatus = 'pending_staff_hrd_peer';
    else if (currentUser.role === 'kepala_hrd') initialStatus = 'pending_director';
    await addDoc(collection(db, 'leaveRequests'), { employeeId: empId, employeeName: empName, employeeRole: currentUser.role, startDate: s, endDate: e, reason: finalReason, reasonType: reasonType, reasonDetail: reasonType === 'Lainnya' ? otherReasonText : '', status: initialStatus, createdAt: new Date().toISOString() });
    invalidateCache(); alert('✅ Pengajuan dikirim!'); showTab('apply_leave');
  };

  async function renderLeaveRequests() {
    try {
      const emps = await fetchCollection('employees');
      const empMap = {}; emps.forEach(e => { empMap[e.id] = e; });
      const all = await fetchCollection('leaveRequests');
      const pending = all.filter(r => (r.status === 'pending_staff' || r.status === 'pending_staff_hrd_peer') && r.employeeId !== currentUser.employeeId).sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      const processed = all.filter(r => r.status !== 'pending_staff' && r.status !== 'pending_staff_hrd_peer').sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      const renderRows = (list, showAction) => list.map(r => {
        const days = daysBetween(r.startDate, r.endDate);
        const badge = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
        const emp = empMap[r.employeeId];
        const currentBalance = emp ? emp.leaveBalance : 0;
        const projectedBalance = currentBalance - days;
        const isDebt = projectedBalance < 0;
        let reviewerInfo = '';
        if (r.status === 'pending_head' && r.staffHrdName) reviewerInfo = `<br><span class="reviewer-badge">✅ ${r.staffHrdName}</span>`;
        else if (r.status === 'rejected' && r.rejectedBy) reviewerInfo = `<br><span class="reviewer-badge rejected">❌ ${r.rejectedBy}</span>`;
        else if (r.status === 'approved' && r.approvedBy) reviewerInfo = `<br><span class="reviewer-badge">✅ ${r.approvedBy}</span>`;
        else if (r.status === 'approved' && r.directorApprovedBy) reviewerInfo = `<br><span class="reviewer-badge director">✅ ${r.directorApprovedBy} (Direktur)</span>`;
        const isPeerLeave = r.employeeRole === 'staff_hrd';
        const requesterBadge = isPeerLeave ? '<span class="badge badge-self">Staff HRD</span>' : '';
        return `<tr><td><strong>${r.employeeName}</strong> ${requesterBadge}</td><td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td><td><strong>${days} hr</strong><br><span style="font-size:11px;color:#64748b">Saldo: ${currentBalance}</span><br><span class="${isDebt?'balance-debt':'balance-safe'}" style="font-size:11px;font-weight:600">→ ${isDebt?`Hutang ${Math.abs(projectedBalance)}`:`Sisa ${projectedBalance}`}</span></td><td>${r.reason}${reviewerInfo}</td><td><span class="badge ${badge}">${getStatusLabel(r.status)}</span></td>${showAction?`<td><button class="btn btn-success btn-sm" onclick="staffApprove('${r.id}')">Terima</button><button class="btn btn-danger btn-sm" onclick="staffReject('${r.id}')">Tolak</button></td>`:''}</tr>`;
      }).join('');
      return `<div class="card"><h3>📬 Menunggu Review (${pending.length})</h3><div class="hint-box orange">👥 Yang pertama klik akan tercatat. Tidak bisa review sendiri.</div><div class="table-wrapper"><table><thead><tr><th>Nama</th><th>Periode</th><th>Durasi & Saldo</th><th>Alasan</th><th>Status</th>${pending.length?'<th>Aksi</th>':''}</tr></thead><tbody>${renderRows(pending, pending.length>0)||'<tr><td colspan="6" style="text-align:center;padding:20px;color:#94a3b8">Tidak ada</td></tr>'}</tbody></table></div></div><div class="card"><h3>📜 Riwayat</h3><div class="table-wrapper"><table><thead><tr><th>Nama</th><th>Periode</th><th>Durasi</th><th>Alasan & Reviewer</th><th>Status</th></tr></thead><tbody>${renderRows(processed, false)||'<tr><td colspan="5" style="text-align:center;padding:20px;color:#94a3b8">Belum ada</td></tr>'}</tbody></table></div></div>`;
    } catch (e) { return `<div class="card"><div class="hint-box danger">❌ Error: ${e.message}</div></div>`; }
  }

  async function renderLeaveView() {
    const emps = await fetchCollection('employees');
    const empHistoryMap = {};
    emps.forEach(e => { empHistoryMap[e.id] = { emp: e, history: (e.leaveHistory || []).map(h => ({ ...h, empId: e.id, empName: e.name, isDebt: e.leaveBalance < 0 })) }; });
    Object.keys(empHistoryMap).forEach(empId => { const { emp, history } = empHistoryMap[empId]; const sorted = [...history].sort((a, b) => new Date(a.timestamp || a.date || 0).getTime() - new Date(b.timestamp || b.date || 0).getTime()); const totalAmount = sorted.reduce((sum, h) => sum + (h.amount || 0), 0); const initialBalance = emp.leaveBalance - totalAmount; let runningBalance = initialBalance; sorted.forEach(h => { runningBalance += (h.amount || 0); h.runningBalance = runningBalance; }); empHistoryMap[empId].sortedHistory = sorted; });
    const allHistory = []; Object.values(empHistoryMap).forEach(({ sortedHistory }) => { if (sortedHistory) allHistory.push(...sortedHistory); });
    allHistory.sort((a, b) => new Date(b.timestamp || b.date || 0).getTime() - new Date(a.timestamp || a.date || 0).getTime());
    const empNames = emps.map(e => e.name).sort();
    return `<div class="card"><h3>📅 Mutasi Cuti</h3><div class="hint-box">💡 Diurutkan terbaru. Saldo berjalan (running balance).</div><div class="filter-bar"><label>🔍 Filter:</label><select id="filterEmployee" onchange="applyLeaveViewFilter()"><option value="">-- Semua --</option>${empNames.map(n => `<option value="${n}">${n}</option>`).join('')}</select><button class="btn btn-secondary btn-sm" onclick="resetLeaveViewFilter()">Reset</button></div><div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Sisa</th><th>Catatan</th></tr></thead><tbody id="leaveViewBody">${renderLeaveViewRows(allHistory)}</tbody></table></div></div>`;
  }

  function renderLeaveViewRows(historyList) {
    if (historyList.length === 0) return '<tr><td colspan="7" style="text-align:center;padding:20px;color:#94a3b8">Tidak ada data</td></tr>';
    return historyList.map(h => { const displayDate = h.timestamp ? fmtDateTime(h.timestamp) : fmtDate(h.date); const isDebt = h.runningBalance < 0; return `<tr class="${isDebt?'debt-row':''}" data-empname="${h.empName}"><td><strong>${displayDate}</strong></td><td><strong>${h.empName}</strong> ${isDebt?'<span class="badge badge-debt">HUTANG</span>':''}</td><td>${h.type}</td><td>${h.days} hr</td><td><span class="badge ${h.amount>0?'badge-plus':'badge-minus'}">${h.amount>0?'+':''}${h.amount} hr</span></td><td><strong style="color:${isDebt?'#dc2626':'#4f46e5'}">${h.runningBalance}</strong> hr</td><td style="color:#64748b;font-size:11px">${h.note||'-'}</td></tr>`; }).join('');
  }

  window.applyLeaveViewFilter = function() { const filterName = document.getElementById('filterEmployee').value; document.querySelectorAll('#leaveViewBody tr').forEach(row => { if (row.dataset.empname) row.style.display = (filterName === '' || row.dataset.empname === filterName) ? '' : 'none'; }); };
  window.resetLeaveViewFilter = function() { document.getElementById('filterEmployee').value = ''; applyLeaveViewFilter(); };

{e.name}</strong></td><td><span class="badge badge-debt">${e.debt} hr</span></td><td>${e.id}</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="card"><h3>📋 Analisis</h3><div style="line-height:1.8;color:#475569"><p>📌 <strong>Tingkat Persetujuan:</strong> ${report.totalLeaveRequests>0?Math.round((report.approved/report.totalLeaveRequests)*100):0}%</p><p>📌 <strong>Rata-rata cuti:</strong> ${report.averageLeavePerEmployee} hr/karyawan</p><p>📌 <strong>Rata-rata saldo:</strong> ${report.averageBalance} hr/karyawan</p><p> <strong>Karyawan hutang:</strong> ${report.employeesWithDebt.length} dari ${report.totalEmployees} (${report.totalEmployees>0?Math.round((report.employeesWithDebt.length/report.totalEmployees)*100):0}%)</p><p>📌 <strong>Adjust bulan ini:</strong> ${report.totalAdjustments} (${report.approvedAdjustments} disetujui)</p></div></div>`;

  async function loadChartJS() {
    if (chartLoaded) return window.Chart;
    try { await new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js'; script.onload = resolve; script.onerror = reject; document.head.appendChild(script); }); chartLoaded = true; return window.Chart; } catch (e) { console.error('Gagal load Chart.js:', e); return null; }
  }

  async function loadAndRenderCharts() {
    const Chart = await loadChartJS();
    if (!Chart) return;
    const reportId = `report_${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
    const snap = await getDoc(doc(db, 'monthlyReports', reportId));
    if (!snap.exists()) return;
    const report = snap.data();
    ['chartStatus','chartTopUsers','chartReason','chartBalance'].forEach(id => { const canvas = document.getElementById(id); if (canvas) { const existing = Chart.getChart(canvas); if (existing) existing.destroy(); } });
    new Chart(document.getElementById('chartStatus'), { type: 'doughnut', data: { labels: ['Disetujui','Ditolak','Menunggu'], datasets: [{ data: [report.approved, report.rejected, report.pending], backgroundColor: ['#10b981','#ef4444','#f59e0b'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
    new Chart(document.getElementById('chartTopUsers'), { type: 'bar', data: { labels: (report.topLeaveUsers||[]).map(u=>u.name), datasets: [{ label: 'Hari', data: (report.topLeaveUsers||[]).map(u=>u.days), backgroundColor: '#4f46e5', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
    const reasonEntries = Object.entries(report.leaveByReason || {});
    const colors = ['#4f46e5','#10b981','#f59e0b','#ef4444','#0ea5e9','#8b5cf6','#ec4899','#14b8a6','#f97316'];
    new Chart(document.getElementById('chartReason'), { type: 'pie', data: { labels: reasonEntries.map(e=>e[0]), datasets: [{ data: reasonEntries.map(e=>e[1]), backgroundColor: colors.slice(0, reasonEntries.length) }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } } });
    new Chart(document.getElementById('chartBalance'), { type: 'doughnut', data: { labels: ['Positif','Nol','Hutang'], datasets: [{ data: [report.balanceDistribution.positive, report.balanceDistribution.zero, report.balanceDistribution.negative], backgroundColor: ['#10b981','#94a3b8','#ef4444'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
  }

  window.handleChangePassword = async () => {
    const oldPass = document.getElementById('oldPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    if (!oldPass || !newPass || !confirmPass) { alert('Lengkapi semua!'); return; }
    if (oldPass !== currentUser.password) { alert('Password lama salah!'); return; }
    if (newPass !== confirmPass) { alert('Password baru tidak cocok!'); return; }
    if (newPass.length < 4) { alert('Minimal 4 karakter!'); return; }
    try {
      await updateDoc(doc(db, 'users', currentUserDocId), { password: newPass });
      currentUser.password = newPass;
      sessionStorage.setItem('hrd_user', JSON.stringify(currentUser));
      alert('✅ Password diubah! Login ulang.');
      doLogout();
    } catch (e) { alert('Gagal: ' + e.message); }
  };

  window.openModal = (html) => { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); };
  window.closeModal = () => { document.getElementById('modalOverlay').classList.remove('active'); };
  document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') window.closeModal(); });

  function renderLeaveHistory(history) {
    if (!history || history.length === 0) return `<div class="empty-state" style="padding:20px"><div class="icon">📋</div><p>Belum ada mutasi</p></div>`;
    const sorted = [...history].sort((a, b) => new Date(a.timestamp || a.date || 0).getTime() - new Date(b.timestamp || b.date || 0).getTime());
    const totalAmount = sorted.reduce((sum, h) => sum + (h.amount || 0), 0);
    const currentBalance = history[history.length - 1]?.runningBalance || 0;
    const initialBalance = currentBalance - totalAmount;
    let runningBalance = initialBalance;
    sorted.forEach(h => { runningBalance += (h.amount || 0); h.runningBalance = runningBalance; });
    const rows = sorted.slice().reverse().map(h => { const displayDate = h.timestamp ? fmtDateTime(h.timestamp) : fmtDate(h.date); return `<tr><td>${displayDate}</td><td>${h.type}</td><td>${h.days} hr</td><td><span class="badge ${h.amount>0?'badge-plus':'badge-minus'}">${h.amount>0?'+':''}${h.amount} hr</span></td><td><strong style="color:${h.runningBalance<0?'#dc2626':'#4f46e5'}">${h.runningBalance}</strong> hr</td><td style="color:#64748b;font-size:11px">${h.note||'-'}</td></tr>`; }).join('');
    return `<div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Sisa</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const _origShowTab = showTab;
  showTab = async (id) => {
    await _origShowTab(id);
    if (id === 'monthly_report') setTimeout(() => loadAndRenderCharts(), 100);
    if (id === 'apply_leave') setTimeout(() => { const calcDiv = document.getElementById('leaveCalculator'); if (calcDiv && currentUser.employeeId) { getDocs(query(collection(db, 'employees'), where('id', '==', currentUser.employeeId))).then(snap => { if (!snap.empty) calcDiv.dataset.balance = snap.docs[0].data().leaveBalance; }); } }, 100);
  };

  seedData().then(() => {
    const timeout = setTimeout(() => { if (!currentUser) console.warn('Login timeout - cek koneksi'); }, 15000);
    checkSession();
    clearTimeout(timeout);
  }).catch(e => { console.error('Init error:', e); document.getElementById('mainContent').innerHTML = `<div class="error-box"><div class="icon">⚠️</div><div><strong>Gagal Memuat Aplikasi</strong></div><div style="font-size:13px;margin-top:8px">${e.message}</div><button class="btn btn-primary" style="width:auto;margin-top:12px" onclick="location.reload()">Reload</button></div>`; });
</script>
</body>
</html>
