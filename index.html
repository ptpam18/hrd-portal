<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HRD Portal - Manajemen Karyawan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #334155;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 15px; }
  
  /* LOGIN */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(12px);
    padding: 32px 28px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 380px;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .login-card h1 { color: #4f46e5; text-align: center; margin-bottom: 8px; font-size: 24px; }
  .login-card p.subtitle { text-align: center; color: #64748b; margin-bottom: 28px; font-size: 13px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; transition: all 0.2s; background: #f8fafc;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }
  
  .btn {
    padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: #4f46e5; color: white; width: 100%; }
  .btn-primary:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
  .btn-success { background: #10b981; color: white; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warning { background: #f59e0b; color: white; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

  /* APP LAYOUT */
  .app-wrapper { display: none; }
  .app-wrapper.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .topbar {
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(12px);
    padding: 14px 18px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .topbar h2 { color: #4f46e5; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .user-detail { text-align: right; }
  .user-detail .name { font-weight: 600; font-size: 13px; color: #1e293b; }
  .user-detail .role { font-size: 11px; color: #64748b; }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; overflow-x: auto; padding-bottom: 4px; }
  .nav-tab {
    padding: 9px 14px; background: rgba(255,255,255,0.9); border: 1px solid #e2e8f0;
    border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s;
    font-family: inherit; color: #64748b; font-size: 12px; white-space: nowrap;
  }
  .nav-tab:hover { background: white; color: #4f46e5; }
  .nav-tab.active {
    background: #4f46e5; color: white; border-color: #4f46e5;
    box-shadow: 0 4px 12px rgba(79,70,229,0.25);
  }

  .card {
    background: rgba(255,255,255,0.98);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .card h3 { color: #334155; margin-bottom: 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: white; padding: 16px; border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #f1f5f9;
  }
  .stat-card .label { font-size: 11px; color: #64748b; font-weight: 500; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #1e293b; margin-top: 4px; }
  .stat-card.indigo { border-left: 4px solid #4f46e5; }
  .stat-card.emerald { border-left: 4px solid #10b981; }
  .stat-card.amber { border-left: 4px solid #f59e0b; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:hover { background: #f8fafc; }

  .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #d1fae5; color: #065f46; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-minus { background: #fee2e2; color: #991b1b; }
  .badge-plus { background: #d1fae5; color: #065f46; }

  .notification {
    background: #fffbeb;
    border-left: 4px solid #f59e0b;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(245,158,11,0.1);
  }
  .notification .notif-text { font-size: 12px; color: #78350f; line-height: 1.4; }
  .notification .notif-text strong { color: #451a03; }

  .empty-state { text-align: center; padding: 30px 15px; color: #94a3b8; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center; padding: 15px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 24px; max-width: 450px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  }
  .modal h3 { color: #4f46e5; margin-bottom: 18px; font-size: 17px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }

  .hint-box {
    background: #eff6ff; border-left: 4px solid #3b82f6;
    padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #1e40af; margin-bottom: 14px;
  }
  .table-wrapper { overflow-x: auto; }
  
  .loading { text-align: center; padding: 30px; color: #64748b; }
  
  /* Responsive */
  @media (max-width: 640px) {
    .container { padding: 10px; }
    .login-card { padding: 24px 20px; }
    .topbar { flex-direction: column; gap: 12px; text-align: center; padding: 12px 14px; }
    .user-detail { text-align: center; }
    .user-info { flex-direction: row-reverse; }
    .stats-grid { grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .nav-tabs { gap: 4px; }
    .nav-tab { padding: 8px 12px; font-size: 11px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .notification { flex-direction: column; align-items: stretch; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <h1>🌿 HRD Portal</h1>
    <p class="subtitle">Sistem Manajemen Karyawan & Cuti</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- APP SCREEN -->
<div class="app-wrapper" id="appScreen">
  <div class="container">
    <div class="topbar">
      <h2>🌿 HRD Portal</h2>
      <div class="user-info">
        <div class="user-detail">
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
        <div class="user-avatar" id="userAvatar">-</div>
        <button class="btn btn-secondary btn-sm" onclick="doLogout()">Keluar</button>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs"></div>
    <div id="mainContent"><div class="loading">Memuat data...</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- FIREBASE WEB SDK (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, query, where, orderBy, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // ==========================================
  // ⚠️ GANTI DENGAN CONFIG WEB APP ANDA
  // ==========================================
  const firebaseConfig = {
    apiKey: "GANTI_DENGAN_API_KEY_ANDA",
    authDomain: "hrd-portal-9a5fd.firebaseapp.com",
    projectId: "hrd-portal-9a5fd",
    storageBucket: "hrd-portal-9a5fd.appspot.com",
    messagingSenderId: "GANTI_DENGAN_SENDER_ID",
    appId: "GANTI_DENGAN_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;

  // ==========================================
  // STATE & HELPERS
  // ==========================================
  let currentUser = null;
  let currentUserDocId = null; // Store user document ID
  let unsubscribeLeave = null;

  const ROLE_LABEL = {
    direktur: 'Direktur',
    komisaris: 'Komisaris',
    kepala_hrd: 'Kepala HRD',
    staff_hrd: 'Staff HRD',
    staff: 'Staff Biasa'
  };

  const fmtDate = (d) => {
    if (!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const daysBetween = (a, b) => {
    const d1 = new Date(a), d2 = new Date(b);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
  };

  const getEligibleLeave = (joinDateStr) => {
    const join = new Date(joinDateStr);
    const now = new Date();
    const diffYears = (now - join) / (1000 * 60 * 60 * 24 * 365.25);
    return diffYears >= 1;
  };

  // ==========================================
  // SEED DATA
  // ==========================================
  async function seedData() {
    const usersSnap = await getDocs(collection(db, 'users'));
    if (usersSnap.empty) {
      const batch = writeBatch(db);
      const users = [
        { username: 'abdul', password: '1234', name: 'Abdul Halek', role: 'direktur' },
        { username: 'andre', password: '1234', name: 'Andre', role: 'komisaris' },
        { username: 'rosihan', password: '1234', name: 'Rosihan', role: 'kepala_hrd' },
        { username: 'lily', password: '1234', name: 'Lily', role: 'staff_hrd' },
        { username: 'wilson', password: '1234', name: 'Wilson', role: 'staff' },
      ];
      users.forEach(u => {
        const ref = doc(collection(db, 'users'));
        batch.set(ref, u);
      });
      
      const emps = [
        { id: 'E001', name: 'Wilson', joinDate: '2024-03-15', leaveBalance: 8, leaveHistory: [] },
        { id: 'E002', name: 'Budi Santoso', joinDate: '2023-06-01', leaveBalance: 12, leaveHistory: [] },
        { id: 'E003', name: 'Siti Aminah', joinDate: '2025-01-10', leaveBalance: 0, leaveHistory: [] },
      ];
      emps.forEach(e => {
        const ref = doc(collection(db, 'employees'));
        batch.set(ref, e);
      });
      
      await batch.commit();
      console.log("Data awal berhasil dibuat!");
    }
  }

  // ==========================================
  // AUTH
  // ==========================================
  window.doLogin = async () => {
    const u = document.getElementById('loginUsername').value.trim().toLowerCase();
    const p = document.getElementById('loginPassword').value;
    const btn = document.getElementById('btnLogin');
    btn.textContent = 'Memuat...'; btn.disabled = true;

    try {
      const q = query(collection(db, 'users'), where('username', '==', u), where('password', '==', p));
      const snap = await getDocs(q);
      if (snap.empty) {
        alert('Username atau password salah!');
      } else {
        currentUser = snap.docs[0].data();
        currentUserDocId = snap.docs[0].id;
        sessionStorage.setItem('hrd_user', JSON.stringify(currentUser));
        sessionStorage.setItem('hrd_user_doc_id', currentUserDocId);
        renderApp();
      }
    } catch (e) {
      console.error(e);
      alert('Gagal terhubung ke database. Periksa konfigurasi Firebase.');
    }
    btn.textContent = 'Masuk'; btn.disabled = false;
  };

  window.doLogout = () => {
    currentUser = null;
    currentUserDocId = null;
    sessionStorage.removeItem('hrd_user');
    sessionStorage.removeItem('hrd_user_doc_id');
    if (unsubscribeLeave) unsubscribeLeave();
    document.getElementById('appScreen').classList.remove('active');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
  };

  function checkSession() {
    const s = sessionStorage.getItem('hrd_user');
    const docId = sessionStorage.getItem('hrd_user_doc_id');
    if (s && docId) {
      currentUser = JSON.parse(s);
      currentUserDocId = docId;
      renderApp();
    }
  }

  // ==========================================
  // RENDER APP
  // ==========================================
  function renderApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('active');
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = ROLE_LABEL[currentUser.role];
    document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
    buildNav();
  }

  function buildNav() {
    const tabs = [];
    const r = currentUser.role;
    
    // Semua role bisa lihat dashboard
    if (r === 'staff' || r === 'staff_hrd' || r === 'kepala_hrd') {
      tabs.push({ id: 'dashboard', label: '📊 Dashboard' });
    }
    
    // Staff dan HRD bisa ajukan cuti
    if (r === 'staff' || r === 'staff_hrd' || r === 'kepala_hrd') {
      tabs.push({ id: 'apply_leave', label: '📝 Ajukan Cuti' });
    }
    
    // Staff HRD
    if (r === 'staff_hrd') {
      tabs.push({ id: 'employees', label: '👥 Karyawan' });
      tabs.push({ id: 'leave_mgmt', label: '️ Kelola Cuti' });
      tabs.push({ id: 'leave_requests', label: ' Review Cuti' });
    }
    
    // Kepala HRD
    if (r === 'kepala_hrd') {
      tabs.push({ id: 'employees', label: '👥 Karyawan' });
      tabs.push({ id: 'leave_approval', label: '✅ Approval Cuti' });
    }
    
    // Direktur & Komisaris
    if (r === 'direktur' || r === 'komisaris') {
      tabs.push({ id: 'employees', label: '👥 Data Karyawan' });
      tabs.push({ id: 'leave_view', label: '📅 Mutasi Cuti' });
    }
    
    // Semua user bisa ganti password
    tabs.push({ id: 'change_password', label: ' Ganti Password' });

    const nav = document.getElementById('navTabs');
    nav.innerHTML = '';
    tabs.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'nav-tab' + (i === 0 ? ' active' : '');
      btn.textContent = t.label;
      btn.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        showTab(t.id);
      };
      nav.appendChild(btn);
    });
    showTab(tabs[0].id);
  }

  async function showTab(id) {
    const c = document.getElementById('mainContent');
    c.innerHTML = '<div class="loading">Memuat...</div>';
    
    if (unsubscribeLeave) { unsubscribeLeave(); unsubscribeLeave = null; }

    if (id === 'dashboard') c.innerHTML = await renderDashboard();
    else if (id === 'apply_leave') c.innerHTML = await renderApplyLeave();
    else if (id === 'employees') c.innerHTML = await renderEmployees();
    else if (id === 'leave_mgmt') c.innerHTML = await renderLeaveMgmt();
    else if (id === 'leave_requests') c.innerHTML = await renderLeaveRequests();
    else if (id === 'leave_approval') c.innerHTML = await renderLeaveApproval();
    else if (id === 'leave_view') c.innerHTML = await renderLeaveView();
    else if (id === 'change_password') c.innerHTML = renderChangePassword();
  }

  // ==========================================
  // TAB: DASHBOARD
  // ==========================================
  async function renderDashboard() {
    const r = currentUser.role;
    if (r === 'staff' || r === 'staff_hrd' || r === 'kepala_hrd') {
      return await renderStaffDashboard();
    }
    return '<div class="card"><div class="empty-state"><div class="icon">📊</div><p>Silakan pilih menu di atas.</p></div></div>';
  }

  async function renderStaffDashboard() {
    const q = query(collection(db, 'employees'), where('name', '==', currentUser.name));
    const snap = await getDocs(q);
    if (snap.empty) return `<div class="card"><div class="empty-state"><div class="icon">👤</div><p>Data karyawan Anda belum terdaftar. Hubungi HRD.</p></div></div>`;
    
    const emp = snap.docs[0].data();
    const eligible = getEligibleLeave(emp.joinDate);
    
    return `
      <div class="stats-grid">
        <div class="stat-card indigo"><div class="label">Sisa Cuti</div><div class="value">${emp.leaveBalance} <span style="font-size:14px;color:#64748b">hari</span></div></div>
        <div class="stat-card emerald"><div class="label">Status Kelayakan</div><div class="value" style="font-size:16px">${eligible ? '✅ Layak Cuti' : '⏳ Belum 1 Thn'}</div></div>
        <div class="stat-card amber"><div class="label">Tanggal Bergabung</div><div class="value" style="font-size:16px">${fmtDate(emp.joinDate)}</div></div>
      </div>
      <div class="card">
        <h3>📜 Mutasi Cuti Saya</h3>
        ${renderLeaveHistory(emp.leaveHistory || [])}
      </div>
    `;
  }

  async function renderHRDDashboard() {
    const r = currentUser.role;
    const targetStatus = r === 'staff_hrd' ? 'pending_staff' : 'pending_head';
    const label = r === 'staff_hrd' ? 'Menunggu Review Staff HRD' : 'Menunggu Approval Kepala HRD';
    
    const q = query(collection(db, 'leaveRequests'), where('status', '==', targetStatus), orderBy('createdAt', 'desc'));
    
    return new Promise(resolve => {
      unsubscribeLeave = onSnapshot(q, (snap) => {
        const pending = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        let notifHTML = '';
        if (pending.length === 0) {
          notifHTML = `<div class="empty-state"><div class="icon">✨</div><p>Tidak ada pengajuan cuti yang menunggu tindakan.</p></div>`;
        } else {
          pending.forEach(req => {
            const days = daysBetween(req.startDate, req.endDate);
            notifHTML += `
              <div class="notification">
                <div class="notif-text">
                  <strong>${req.employeeName}</strong> mengajukan cuti <strong>${days} hari</strong><br>
                  Periode: ${fmtDate(req.startDate)} - ${fmtDate(req.endDate)}<br>
                  <em>Alasan: ${req.reason}</em>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap">
                  ${r === 'staff_hrd' ? `
                    <button class="btn btn-success btn-sm" onclick="staffApprove('${req.id}')">Terima</button>
                    <button class="btn btn-danger btn-sm" onclick="staffReject('${req.id}')">Tolak</button>
                  ` : `
                    <button class="btn btn-success btn-sm" onclick="headApprove('${req.id}')">Setujui</button>
                    <button class="btn btn-danger btn-sm" onclick="headReject('${req.id}')">Tolak</button>
                  `}
                </div>
              </div>
            `;
          });
        }
        
        const html = `
          <div class="stats-grid">
            <div class="stat-card amber"><div class="label">${label}</div><div class="value">${pending.length}</div></div>
          </div>
          <div class="card">
            <h3> Pengajuan Cuti Terbaru</h3>
            ${notifHTML}
          </div>
        `;
        document.getElementById('mainContent').innerHTML = html;
        resolve();
      });
    });
  }

  // ==========================================
  // TAB: EMPLOYEES
  // ==========================================
  async function renderEmployees() {
    const canAdd = currentUser.role === 'staff_hrd';
    const snap = await getDocs(query(collection(db, 'employees'), orderBy('joinDate', 'desc')));
    const emps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    const rows = emps.map(e => {
      const eligible = getEligibleLeave(e.joinDate);
      return `
        <tr>
          <td>${e.id}</td>
          <td><strong>${e.name}</strong></td>
          <td>${fmtDate(e.joinDate)}</td>
          <td>${eligible ? '✅' : '⏳'} <strong>${e.leaveBalance}</strong> hari</td>
          <td><button class="btn btn-secondary btn-sm" onclick="viewEmpDetail('${e.id}')">Detail</button></td>
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0">Data Karyawan</h3>
          ${canAdd ? `<button class="btn btn-primary" style="width:auto" onclick="openAddEmployee()">+ Tambah Karyawan</button>` : ''}
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>ID</th><th>Nama</th><th>Tanggal Join</th><th>Sisa Cuti</th><th>Aksi</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada data</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.openAddEmployee = () => {
    window.openModal(`
      <h3>Tambah Karyawan Baru</h3>
      <div class="form-group"><label>Nama Lengkap</label><input type="text" id="newEmpName"></div>
      <div class="form-group"><label>Username (untuk login)</label><input type="text" id="newEmpUsername" placeholder="huruf kecil semua"></div>
      <div class="form-group"><label>Tanggal Bergabung</label><input type="date" id="newEmpJoin"></div>
      <div class="hint-box">💡 Password default: <strong>1234</strong> (dapat diganti setelah login pertama kali)</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.closeModal()">Batal</button>
        <button class="btn btn-primary" style="width:auto" onclick="saveNewEmployee()">Simpan</button>
      </div>
    `);
  };

  window.saveNewEmployee = async () => {
    const name = document.getElementById('newEmpName').value.trim();
    const username = document.getElementById('newEmpUsername').value.trim().toLowerCase();
    const join = document.getElementById('newEmpJoin').value;
    
    if (!name || !username || !join) { alert('Lengkapi semua field!'); return; }
    
    // Cek username sudah ada atau belum
    const userCheck = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
    if (!userCheck.empty) { alert('Username sudah digunakan!'); return; }
    
    // Cek nama karyawan sudah ada atau belum
    const empCheck = await getDocs(query(collection(db, 'employees'), where('name', '==', name)));
    if (!empCheck.empty) { alert('Nama karyawan sudah terdaftar!'); return; }
    
    const snap = await getDocs(query(collection(db, 'employees'), orderBy('id', 'desc')));
    const lastId = snap.docs.length > 0 ? snap.docs[0].data().id : 'E000';
    const num = parseInt(lastId.substring(1)) + 1;
    const newId = 'E' + String(num).padStart(3, '0');
    
    const batch = writeBatch(db);
    
    // Tambah user
    const userRef = doc(collection(db, 'users'));
    batch.set(userRef, {
      username: username,
      password: '1234',
      name: name,
      role: 'staff'
    });
    
    // Tambah employee
    const empRef = doc(collection(db, 'employees'));
    batch.set(empRef, {
      id: newId, name, joinDate: join, leaveBalance: 0, leaveHistory: []
    });
    
    await batch.commit();
    window.closeModal();
    showTab('employees');
    alert('✅ Karyawan berhasil ditambahkan!\nUsername: ' + username + '\nPassword: 1234');
  };

  window.viewEmpDetail = async (empId) => {
    const d = await getDocs(query(collection(db, 'employees'), where('id', '==', empId)));
    if (d.empty) return;
    const e = d.docs[0].data();
    const eligible = getEligibleLeave(e.joinDate);
    
    window.openModal(`
      <h3>Detail Karyawan</h3>
      <p><strong>ID:</strong> ${e.id}</p>
      <p><strong>Nama:</strong> ${e.name}</p>
      <p><strong>Tanggal Join:</strong> ${fmtDate(e.joinDate)}</p>
      <p><strong>Sisa Cuti:</strong> ${e.leaveBalance} hari</p>
      <p><strong>Layak Cuti (≥1 Thn):</strong> ${eligible ? '✅ Ya (Jatah 12 hari)' : '⏳ Belum'}</p>
      <hr style="margin:16px 0;border:0;border-top:1px solid #e2e8f0">
      <h3 style="font-size:15px">Mutasi Cuti</h3>
      ${renderLeaveHistory(e.leaveHistory || [])}
      <div class="modal-actions"><button class="btn btn-secondary" onclick="window.closeModal()">Tutup</button></div>
    `);
  };

  // ==========================================
  // TAB: APPLY LEAVE (Staff & HRD)
  // ==========================================
  async function renderApplyLeave() {
    const q = query(collection(db, 'employees'), where('name', '==', currentUser.name));
    const snap = await getDocs(q);
    if (snap.empty) return `<div class="card"><div class="empty-state"><div class="icon">👤</div><p>Data karyawan tidak ditemukan.</p></div></div>`;
    
    const emp = snap.docs[0].data();
    const reqSnap = await getDocs(query(collection(db, 'leaveRequests'), where('employeeId', '==', emp.id), orderBy('createdAt', 'desc')));
    const myReqs = reqSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    const rows = myReqs.map(r => {
      const days = daysBetween(r.startDate, r.endDate);
      const badge = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
      const label = r.status === 'approved' ? 'Disetujui' : r.status === 'rejected' ? 'Ditolak' :
                    r.status === 'pending_head' ? 'Menunggu Kepala HRD' : 'Menunggu Staff HRD';
      return `<tr><td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td><td>${days} hari</td><td>${r.reason}</td><td><span class="badge ${badge}">${label}</span></td></tr>`;
    }).join('');

    return `
      <div class="card">
        <h3>Form Pengajuan Cuti</h3>
        <div class="hint-box">💡 Sisa cuti Anda saat ini: <strong>${emp.leaveBalance} hari</strong></div>
        <div class="form-group"><label>Tanggal Mulai</label><input type="date" id="leaveStart"></div>
        <div class="form-group"><label>Tanggal Selesai</label><input type="date" id="leaveEnd"></div>
        <div class="form-group"><label>Alasan Cuti</label><textarea id="leaveReason" rows="3" placeholder="Tuliskan alasan cuti Anda..."></textarea></div>
        <button class="btn btn-primary" style="width:auto" onclick="submitLeave('${emp.id}', '${emp.name}')">Kirim Pengajuan</button>
      </div>
      <div class="card">
        <h3>Riwayat Pengajuan Saya</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px">Belum ada pengajuan</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.submitLeave = async (empId, empName) => {
    const s = document.getElementById('leaveStart').value;
    const e = document.getElementById('leaveEnd').value;
    const r = document.getElementById('leaveReason').value.trim();
    if (!s || !e || !r) { alert('Lengkapi semua field!'); return; }
    if (new Date(e) < new Date(s)) { alert('Tanggal selesai harus setelah tanggal mulai'); return; }
    
    await addDoc(collection(db, 'leaveRequests'), {
      employeeId: empId, employeeName: empName,
      startDate: s, endDate: e, reason: r,
      status: 'pending_staff',
      createdAt: new Date().toISOString()
    });
    alert('✅ Pengajuan cuti berhasil dikirim!');
    showTab('apply_leave');
  };

  // ==========================================
  // TAB: LEAVE MGMT (Staff HRD Adjust)
  // ==========================================
  async function renderLeaveMgmt() {
    const snap = await getDocs(query(collection(db, 'employees'), orderBy('name')));
    const emps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const rows = emps.map(e => `
      <tr>
        <td>${e.id}</td><td><strong>${e.name}</strong></td><td>${e.leaveBalance} hari</td>
        <td><button class="btn btn-warning btn-sm" onclick="openAdjustLeave('${e.id}', '${e.name}', ${e.leaveBalance})">Adjust Cuti</button></td>
      </tr>
    `).join('');
    
    return `
      <div class="card">
        <h3>Manajemen Cuti Karyawan</h3>
        <div class="hint-box">💡 Gunakan fitur ini untuk menginput pengurangan/penambahan cuti (misal: karena tidak mengikuti tanggal merah, atau hutang cuti). Nilai bisa minus.</div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>ID</th><th>Nama</th><th>Sisa Cuti</th><th>Aksi</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.openAdjustLeave = (empId, name, currentBalance) => {
    window.openModal(`
      <h3>Adjust Cuti - ${name}</h3>
      <p>Sisa cuti saat ini: <strong>${currentBalance} hari</strong></p>
      <div class="form-group"><label>Jumlah Hari (gunakan minus untuk pengurangan)</label><input type="number" id="adjDays" placeholder="Contoh: -2 atau 12"></div>
      <div class="form-group"><label>Catatan</label><textarea id="adjNote" rows="2" placeholder="Misal: Pengurangan karena tidak mengikuti tanggal merah"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.closeModal()">Batal</button>
        <button class="btn btn-primary" style="width:auto" onclick="saveAdjustLeave('${empId}')">Simpan</button>
      </div>
    `);
  };

  window.saveAdjustLeave = async (empId) => {
    const days = parseInt(document.getElementById('adjDays').value);
    const note = document.getElementById('adjNote').value.trim() || 'Adjustment manual';
    if (isNaN(days)) { alert('Masukkan jumlah hari yang valid'); return; }
    
    const q = query(collection(db, 'employees'), where('id', '==', empId));
    const snap = await getDocs(q);
    if (snap.empty) return;
    
    const empRef = snap.docs[0].ref;
    const currentData = snap.docs[0].data();
    const newBalance = currentData.leaveBalance + days;
    const newHistory = [...(currentData.leaveHistory || []), {
      date: new Date().toISOString().split('T')[0],
      type: 'Adjustment',
      days: Math.abs(days),
      amount: days,
      note: note
    }];
    
    await updateDoc(empRef, { leaveBalance: newBalance, leaveHistory: newHistory });
    window.closeModal();
    showTab('leave_mgmt');
  };

  // ==========================================
  // TAB: LEAVE REQUESTS (Staff HRD Review)
  // ==========================================
  async function renderLeaveRequests() {
    const qPending = query(collection(db, 'leaveRequests'), where('status', '==', 'pending_staff'), orderBy('createdAt', 'desc'));
    const qProcessed = query(collection(db, 'leaveRequests'), where('status', '!=', 'pending_staff'), orderBy('createdAt', 'desc'));
    
    const [snapPending, snapProcessed] = await Promise.all([getDocs(qPending), getDocs(qProcessed)]);
    const pending = snapPending.docs.map(d => ({ id: d.id, ...d.data() }));
    const processed = snapProcessed.docs.map(d => ({ id: d.id, ...d.data() }));
    
    const renderRows = (list, showAction) => list.map(r => {
      const days = daysBetween(r.startDate, r.endDate);
      const badge = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
      return `
        <tr>
          <td><strong>${r.employeeName}</strong></td>
          <td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td>
          <td>${days} hari</td>
          <td>${r.reason}</td>
          <td><span class="badge ${badge}">${r.status}</span></td>
          ${showAction ? `<td>
            <button class="btn btn-success btn-sm" onclick="staffApprove('${r.id}')">Terima</button>
            <button class="btn btn-danger btn-sm" onclick="staffReject('${r.id}')">Tolak</button>
          </td>` : ''}
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <h3>Pengajuan Menunggu Review (${pending.length})</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th>${pending.length?'<th>Aksi</th>':''}</tr></thead>
            <tbody>${renderRows(pending, pending.length>0) || '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">Tidak ada pengajuan</td></tr>'}</tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h3>Riwayat Pengajuan</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th></tr></thead>
            <tbody>${renderRows(processed, false) || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada riwayat</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.staffApprove = async (reqId) => {
    await updateDoc(doc(db, 'leaveRequests', reqId), { 
      status: 'pending_head', 
      staffHrdApprovedAt: new Date().toISOString(),
      staffHrdName: currentUser.name
    });
    showTab('leave_requests');
  };

  window.staffReject = async (reqId) => {
    await updateDoc(doc(db, 'leaveRequests', reqId), { 
      status: 'rejected', 
      rejectedBy: currentUser.name 
    });
    showTab('leave_requests');
  };

  // ==========================================
  // TAB: LEAVE APPROVAL (Kepala HRD)
  // ==========================================
  async function renderLeaveApproval() {
    const qPending = query(collection(db, 'leaveRequests'), where('status', '==', 'pending_head'), orderBy('createdAt', 'desc'));
    const qProcessed = query(collection(db, 'leaveRequests'), where('status', 'in', ['approved', 'rejected']), orderBy('createdAt', 'desc'));
    
    const [snapPending, snapProcessed] = await Promise.all([getDocs(qPending), getDocs(qProcessed)]);
    const pending = snapPending.docs.map(d => ({ id: d.id, ...d.data() }));
    const processed = snapProcessed.docs.map(d => ({ id: d.id, ...d.data() }));
    
    const renderRows = (list, showAction) => list.map(r => {
      const days = daysBetween(r.startDate, r.endDate);
      const badge = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
      return `
        <tr>
          <td><strong>${r.employeeName}</strong></td>
          <td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td>
          <td>${days} hari</td>
          <td>${r.reason}</td>
          <td><span class="badge ${badge}">${r.status}</span></td>
          ${showAction ? `<td>
            <button class="btn btn-success btn-sm" onclick="headApprove('${r.id}')">Setujui</button>
            <button class="btn btn-danger btn-sm" onclick="headReject('${r.id}')">Tolak</button>
          </td>` : ''}
        </tr>
      `;
    }).join('');

    return `
      <div class="card">
        <h3>Menunggu Approval Kepala HRD (${pending.length})</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th>${pending.length?'<th>Aksi</th>':''}</tr></thead>
            <tbody>${renderRows(pending, pending.length>0) || '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">Tidak ada pengajuan</td></tr>'}</tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h3>Riwayat Approval</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th></tr></thead>
            <tbody>${renderRows(processed, false) || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada riwayat</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.headApprove = async (reqId) => {
    await updateDoc(doc(db, 'leaveRequests', reqId), { 
      status: 'approved', 
      headApprovedAt: new Date().toISOString(),
      approvedBy: currentUser.name
    });
    alert('✅ Cuti disetujui. Silakan minta Staff HRD melakukan pengurangan cuti di menu "Kelola Cuti".');
    showTab('leave_approval');
  };

  window.headReject = async (reqId) => {
    await updateDoc(doc(db, 'leaveRequests', reqId), { 
      status: 'rejected', 
      rejectedBy: currentUser.name 
    });
    showTab('leave_approval');
  };

  // ==========================================
  // TAB: LEAVE VIEW (Direktur/Komisaris)
  // ==========================================
  async function renderLeaveView() {
    const snap = await getDocs(query(collection(db, 'employees'), orderBy('name')));
    const emps = snap.docs.map(d => d.data());
    
    const rows = emps.map(e => {
      const history = (e.leaveHistory || []).slice().reverse().slice(0, 3);
      const histStr = history.length ? history.map(h =>
        `<div style="font-size:11px;color:#64748b;margin-top:4px">• ${fmtDate(h.date)}: <span class="${h.amount>0?'badge-plus':'badge-minus'}" style="padding:2px 6px;border-radius:4px;font-size:10px">${h.amount>0?'+':''}${h.amount} hari</span> (${h.type}) <em style="color:#94a3b8">- ${h.note}</em></div>`
      ).join('') : '<div style="font-size:11px;color:#94a3b8">Belum ada mutasi</div>';
      return `
        <tr>
          <td>${e.id}</td>
          <td><strong>${e.name}</strong></td>
          <td><span style="font-size:16px;font-weight:700;color:#4f46e5">${e.leaveBalance}</span> hari</td>
          <td>${histStr}</td>
        </tr>
      `;
    }).join('');
    
    return `
      <div class="card">
        <h3>Sisa Cuti & Mutasi Karyawan</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>ID</th><th>Nama</th><th>Sisa Cuti</th><th>Mutasi Terakhir (3 Terbaru)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  // ==========================================
  // TAB: CHANGE PASSWORD
  // ==========================================
  function renderChangePassword() {
    return `
      <div class="card">
        <h3>🔒 Ganti Password</h3>
        <div class="hint-box"> Password akan disimpan di Firestore dan tersinkronisasi ke semua device.</div>
        <div class="form-group"><label>Password Lama</label><input type="password" id="oldPassword" placeholder="Masukkan password lama"></div>
        <div class="form-group"><label>Password Baru</label><input type="password" id="newPassword" placeholder="Masukkan password baru"></div>
        <div class="form-group"><label>Konfirmasi Password Baru</label><input type="password" id="confirmPassword" placeholder="Ketik ulang password baru"></div>
        <button class="btn btn-primary" style="width:auto" onclick="handleChangePassword()">Update Password</button>
      </div>
    `;
  }

  window.handleChangePassword = async () => {
    const oldPass = document.getElementById('oldPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    
    if (!oldPass || !newPass || !confirmPass) { alert('Lengkapi semua field!'); return; }
    if (oldPass !== currentUser.password) { alert('Password lama salah!'); return; }
    if (newPass !== confirmPass) { alert('Password baru tidak cocok!'); return; }
    if (newPass.length < 4) { alert('Password minimal 4 karakter!'); return; }
    
    try {
      await updateDoc(doc(db, 'users', currentUserDocId), { password: newPass });
      // Update session storage
      currentUser.password = newPass;
      sessionStorage.setItem('hrd_user', JSON.stringify(currentUser));
      alert('✅ Password berhasil diubah! Silakan login ulang dengan password baru.');
      doLogout();
    } catch (e) {
      console.error(e);
      alert('Gagal mengubah password. Periksa koneksi internet.');
    }
  };

  // ==========================================
  // UTILS: MODAL & HISTORY RENDER
  // ==========================================
  window.openModal = (html) => {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
  };
  window.closeModal = () => {
    document.getElementById('modalOverlay').classList.remove('active');
  };
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') window.closeModal();
  });

  function renderLeaveHistory(history) {
    if (!history || history.length === 0) {
      return `<div class="empty-state" style="padding:20px"><div class="icon">📋</div><p>Belum ada mutasi cuti</p></div>`;
    }
    const rows = history.slice().reverse().map(h => `
      <tr>
        <td>${fmtDate(h.date)}</td>
        <td>${h.type}</td>
        <td>${h.days} hari</td>
        <td><span class="badge ${h.amount > 0 ? 'badge-plus' : 'badge-minus'}">${h.amount > 0 ? '+' : ''}${h.amount} hari</span></td>
        <td style="color:#64748b;font-size:11px">${h.note || '-'}</td>
      </tr>
    `).join('');
    return `<div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ==========================================
  // INIT
  // ==========================================
  seedData().then(() => {
    checkSession();
  });
</script>
</body>
</html>
