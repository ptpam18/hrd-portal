<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HRD Portal - Manajemen Karyawan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #334155; }
  .container { max-width: 1100px; margin: 0 auto; padding: 15px; }
  
  .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: rgba(255,255,255,0.98); backdrop-filter: blur(12px); padding: 32px 28px;
    border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.3);
  }
  .login-card h1 { color: #4f46e5; text-align: center; margin-bottom: 8px; font-size: 24px; }
  .login-card p.subtitle { text-align: center; color: #64748b; margin-bottom: 28px; font-size: 13px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; transition: all 0.2s; background: #f8fafc;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }
  
  .btn {
    padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: #4f46e5; color: white; width: 100%; }
  .btn-primary:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
  .btn-success { background: #10b981; color: white; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warning { background: #f59e0b; color: white; }
  .btn-warning:hover { background: #d97706; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

  .app-wrapper { display: none; }
  .app-wrapper.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .topbar {
    background: rgba(255,255,255,0.98); backdrop-filter: blur(12px); padding: 14px 18px;
    border-radius: 14px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.6);
  }
  .topbar h2 { color: #4f46e5; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .user-detail { text-align: right; }
  .user-detail .name { font-weight: 600; font-size: 13px; color: #1e293b; }
  .user-detail .role { font-size: 11px; color: #64748b; }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; overflow-x: auto; padding-bottom: 4px; }
  .nav-tab {
    padding: 9px 14px; background: rgba(255,255,255,0.9); border: 1px solid #e2e8f0;
    border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s;
    font-family: inherit; color: #64748b; font-size: 12px; white-space: nowrap;
  }
  .nav-tab:hover { background: white; color: #4f46e5; }
  .nav-tab.active { background: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79,70,229,0.25); }

  .card {
    background: rgba(255,255,255,0.98); border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.6);
  }
  .card h3 { color: #334155; margin-bottom: 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; }
  .stat-card .label { font-size: 11px; color: #64748b; font-weight: 500; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #1e293b; margin-top: 4px; }
  .stat-card.indigo { border-left: 4px solid #4f46e5; }
  .stat-card.emerald { border-left: 4px solid #10b981; }
  .stat-card.amber { border-left: 4px solid #f59e0b; }
  .stat-card.rose { border-left: 4px solid #f43f5e; }
  .stat-card.debt { border-left: 4px solid #dc2626; background: #fef2f2; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:hover { background: #f8fafc; }
  tr.debt-row { background: #fef2f2; }
  tr.debt-row:hover { background: #fee2e2; }

  .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #d1fae5; color: #065f46; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-minus { background: #fee2e2; color: #991b1b; }
  .badge-plus { background: #d1fae5; color: #065f46; }
  .badge-debt { background: #dc2626; color: white; font-weight: 700; }

  .notification {
    background: #fffbeb; border-left: 4px solid #f59e0b; padding: 14px; border-radius: 10px;
    margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(245,158,11,0.1);
  }
  .notification .notif-text { font-size: 12px; color: #78350f; line-height: 1.5; }
  .notification .notif-text strong { color: #451a03; }
  
  .balance-info { 
    background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 8px; 
    font-size: 12px; margin-top: 6px; border: 1px solid #e2e8f0;
  }
  .balance-safe { color: #059669; font-weight: 600; }
  .balance-debt { color: #dc2626; font-weight: 700; }

  .debt-warning {
    background: #fef2f2; border: 2px solid #dc2626; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .debt-warning .icon { font-size: 32px; }
  .debt-warning .text { flex: 1; }
  .debt-warning .text strong { color: #dc2626; font-size: 16px; }
  .debt-warning .text p { color: #991b1b; font-size: 13px; margin-top: 4px; }

  .empty-state { text-align: center; padding: 30px 15px; color: #94a3b8; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center; padding: 15px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  }
  .modal h3 { color: #4f46e5; margin-bottom: 18px; font-size: 17px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }

  .hint-box {
    background: #eff6ff; border-left: 4px solid #3b82f6;
    padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #1e40af; margin-bottom: 14px;
  }
  .hint-box.warning { background: #fef3c7; border-left-color: #f59e0b; color: #92400e; }
  .hint-box.danger { background: #fee2e2; border-left-color: #ef4444; color: #991b1b; }
  .table-wrapper { overflow-x: auto; }
  .loading { text-align: center; padding: 30px; color: #64748b; }
  
  @media (max-width: 640px) {
    .container { padding: 10px; }
    .login-card { padding: 24px 20px; }
    .topbar { flex-direction: column; gap: 12px; text-align: center; padding: 12px 14px; }
    .user-detail { text-align: center; }
    .user-info { flex-direction: row-reverse; }
    .stats-grid { grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .nav-tabs { gap: 4px; }
    .nav-tab { padding: 8px 12px; font-size: 11px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .notification { flex-direction: column; align-items: stretch; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <h1> HRD Portal</h1>
    <p class="subtitle">Sistem Manajemen Karyawan & Cuti</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
    <div class="hint-box" style="margin-top: 16px; text-align: center;">
      💡 Huruf besar atau kecil tidak masalah (Case-insensitive)
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div class="app-wrapper" id="appScreen">
  <div class="container">
    <div class="topbar">
      <h2> HRD Portal</h2>
      <div class="user-info">
        <div class="user-detail">
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
        <div class="user-avatar" id="userAvatar">-</div>
        <button class="btn btn-secondary btn-sm" onclick="doLogout()">Keluar</button>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs"></div>
    <div id="mainContent"><div class="loading">Memuat data...</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- FIREBASE WEB SDK (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { 
    getFirestore, collection, getDocs, getDoc, addDoc, setDoc, updateDoc, deleteDoc, doc, 
    query, where, writeBatch 
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhGxzuzU-pQo6p8xJwdmC6bQIZV-po-A4",
    authDomain: "hrd-portal-9a5fd.firebaseapp.com",
    projectId: "hrd-portal-9a5fd",
    storageBucket: "hrd-portal-9a5fd.firebasestorage.app",
    messagingSenderId: "938883233737",
    appId: "1:938883233737:web:9368aac16b5b6a12685a18"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;

  let currentUser = null;
  let currentUserDocId = null;

  const ROLE_LABEL = {
    superuser: 'Superuser',
    direktur: 'Direktur',
    komisaris: 'Komisaris',
    kepala_hrd: 'Kepala HRD',
    staff_hrd: 'Staff HRD',
    staff: 'Staff Biasa'
  };

  const fmtDate = (d) => {
    if (!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const daysBetween = (a, b) => {
    const d1 = new Date(a), d2 = new Date(b);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
  };

  const getEligibleLeave = (joinDateStr) => {
    const join = new Date(joinDateStr);
    const now = new Date();
    const diffYears = (now - join) / (1000 * 60 * 60 * 24 * 365.25);
    return diffYears >= 1;
  };

  // ==========================================
  // SEED DATA
  // ==========================================
  async function seedData() {
    try {
      const superCheck = await getDocs(query(collection(db, 'users'), where('username', '==', 'ptpam')));
      if (superCheck.empty) {
        const superUserRef = doc(collection(db, 'users'));
        await setDoc(superUserRef, {
          username: 'ptpam', password: '945766',
          name: 'Superuser PTPAM', role: 'superuser', isSuperuser: true
        });
      }
    } catch (e) { console.error("Error seedData:", e); }
  }

  // ==========================================
  // AUTH
  // ==========================================
  window.doLogin = async () => {
    const u = document.getElementById('loginUsername').value.trim().toLowerCase();
    const p = document.getElementById('loginPassword').value;
    const btn = document.getElementById('btnLogin');
    btn.textContent = 'Memuat...'; btn.disabled = true;

    try {
      const q = query(collection(db, 'users'), where('username', '==', u), where('password', '==', p));
      const snap = await getDocs(q);
      if (snap.empty) {
        const q2 = query(collection(db, 'users'), where('username', '==', u));
        const snap2 = await getDocs(q2);
        if (!snap2.empty) alert('❌ Password salah untuk username "' + u + '"!');
        else alert('❌ Username "' + u + '" tidak ditemukan!');
      } else {
        currentUser = snap.docs[0].data();
        currentUserDocId = snap.docs[0].id;
        sessionStorage.setItem('hrd_user', JSON.stringify(currentUser));
        sessionStorage.setItem('hrd_user_doc_id', currentUserDocId);
        renderApp();
      }
    } catch (e) {
      console.error(e);
      alert('❌ Gagal terhubung ke database.\n\nError: ' + e.message);
    }
    btn.textContent = 'Masuk'; btn.disabled = false;
  };

  window.doLogout = () => {
    currentUser = null;
    currentUserDocId = null;
    sessionStorage.removeItem('hrd_user');
    sessionStorage.removeItem('hrd_user_doc_id');
    document.getElementById('appScreen').classList.remove('active');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
  };

  function checkSession() {
    const s = sessionStorage.getItem('hrd_user');
    const docId = sessionStorage.getItem('hrd_user_doc_id');
    if (s && docId) {
      currentUser = JSON.parse(s);
      currentUserDocId = docId;
      renderApp();
    }
  }

  function renderApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('active');
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = ROLE_LABEL[currentUser.role];
    document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
    buildNav();
  }

  function buildNav() {
    const tabs = [];
    const r = currentUser.role;
    
    if (r === 'superuser') {
      tabs.push({ id: 'manage_accounts', label: '👑 Manajemen Akun' });
      tabs.push({ id: 'employees', label: '👥 Data Karyawan' });
      tabs.push({ id: 'leave_view', label: ' Mutasi Cuti' });
      tabs.push({ id: 'reset_db', label: '🔄 Reset Database' });
    } else if (r === 'staff' || r === 'staff_hrd' || r === 'kepala_hrd') {
      tabs.push({ id: 'dashboard', label: ' Dashboard' });
      tabs.push({ id: 'apply_leave', label: '📝 Ajukan Cuti' });
    }
    
    if (r === 'staff_hrd') {
      tabs.push({ id: 'employees', label: '👥 Karyawan' });
      tabs.push({ id: 'leave_mgmt', label: '⚙️ Request Adjust' });
      tabs.push({ id: 'leave_requests', label: '📬 Review Cuti' });
    }
    if (r === 'kepala_hrd') {
      tabs.push({ id: 'employees', label: '👥 Karyawan' });
    }
    if (r === 'direktur' || r === 'komisaris') {
      tabs.push({ id: 'employees', label: ' Data Karyawan' });
      tabs.push({ id: 'leave_view', label: '📅 Mutasi Cuti' });
    }
    
    tabs.push({ id: 'change_password', label: '🔒 Ganti Password' });

    const nav = document.getElementById('navTabs');
    nav.innerHTML = '';
    tabs.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'nav-tab' + (i === 0 ? ' active' : '');
      btn.textContent = t.label;
      btn.onclick = () => {
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        showTab(t.id);
      };
      nav.appendChild(btn);
    });
    showTab(tabs[0].id);
  }

  async function showTab(id) {
    const c = document.getElementById('mainContent');
    c.innerHTML = '<div class="loading">Memuat...</div>';

    if (id === 'manage_accounts') c.innerHTML = await renderManageAccounts();
    else if (id === 'reset_db') c.innerHTML = renderResetDatabase();
    else if (id === 'dashboard') c.innerHTML = await renderDashboard();
    else if (id === 'apply_leave') c.innerHTML = await renderApplyLeave();
    else if (id === 'employees') c.innerHTML = await renderEmployees();
    else if (id === 'leave_mgmt') c.innerHTML = await renderLeaveMgmt();
    else if (id === 'leave_requests') c.innerHTML = await renderLeaveRequests();
    else if (id === 'leave_view') c.innerHTML = await renderLeaveView();
    else if (id === 'change_password') c.innerHTML = renderChangePassword();
  }

  // ==========================================
  // TAB: MANAGE ACCOUNTS (SUPERUSER)
  // ==========================================
  async function renderManageAccounts() {
    const snap = await getDocs(collection(db, 'users'));
    const users = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.role.localeCompare(b.role));
    
    const rows = users.map(u => `
      <tr>
        <td><strong>${u.name}</strong></td>
        <td>${u.username}</td>
        <td>${ROLE_LABEL[u.role] || u.role}</td>
        <td><span style="font-family:monospace; background:#f1f5f9; padding:4px 8px; border-radius:6px; font-size:12px; color:#475569;">${u.password}</span></td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="openEditPassword('${u.id}', '${u.name}', '${u.username}')">Edit Pass</button>
          ${u.role !== 'superuser' ? `<button class="btn btn-danger btn-sm" onclick="deleteAccount('${u.id}', '${u.name}', '${u.employeeId || ''}')">Hapus</button>` : ''}
        </td>
      </tr>
    `).join('');

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0">👑 Manajemen Akun</h3>
          <button class="btn btn-primary" style="width:auto" onclick="openAddAccount()">+ Tambah Akun</button>
        </div>
        <div class="hint-box">💡 Superuser dapat menambah, melihat, mengedit password, dan menghapus akun.</div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Password</th><th>Aksi</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada akun</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.openAddAccount = () => {
    window.openModal(`
      <h3>Tambah Akun Baru</h3>
      <div class="form-group"><label>Nama Lengkap</label><input type="text" id="newAccName" placeholder="Nama lengkap"></div>
      <div class="form-group"><label>Username (huruf kecil)</label><input type="text" id="newAccUsername" placeholder="username"></div>
      <div class="form-group">
        <label>Role / Jabatan</label>
        <select id="newAccRole">
          <option value="direktur">Direktur</option>
          <option value="komisaris">Komisaris</option>
          <option value="kepala_hrd">Kepala HRD</option>
          <option value="staff_hrd">Staff HRD</option>
        </select>
      </div>
      <div class="form-group"><label>Tanggal Bergabung</label><input type="date" id="newAccJoin"></div>
      <div class="form-group"><label>Password (default: 1234)</label><input type="text" id="newAccPassword" value="1234" placeholder="Minimal 4 karakter"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.closeModal()">Batal</button>
        <button class="btn btn-primary" style="width:auto" onclick="saveNewAccount()">Simpan</button>
      </div>
    `);
  };

  window.saveNewAccount = async () => {
    const name = document.getElementById('newAccName').value.trim();
    const username = document.getElementById('newAccUsername').value.trim().toLowerCase();
    const role = document.getElementById('newAccRole').value;
    const join = document.getElementById('newAccJoin').value;
    const password = document.getElementById('newAccPassword').value.trim();
    
    if (!name || !username || !join || !password) { alert('Lengkapi semua field!'); return; }
    if (password.length < 4) { alert('Password minimal 4 karakter!'); return; }
    
    try {
      const userCheck = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
      if (!userCheck.empty) { alert('⚠️ Username sudah digunakan!'); return; }
      
      const empCheck = await getDocs(query(collection(db, 'employees'), where('name', '==', name)));
      if (!empCheck.empty) { alert('⚠️ Nama karyawan sudah terdaftar!'); return; }
      
      const snap = await getDocs(collection(db, 'employees'));
      const emps = snap.docs.map(d => d.data());
      
      let num = 1;
      if (emps.length > 0) {
        const validEmps = emps.filter(e => /^E\d{3,}$/.test(e.id));
        if (validEmps.length > 0) {
          validEmps.sort((a, b) => b.id.localeCompare(a.id));
          num = parseInt(validEmps[0].id.substring(1)) + 1;
        } else {
          num = emps.length + 1;
        }
      }
      const newEmpId = 'E' + String(num).padStart(3, '0');
      
      const batch = writeBatch(db);
      batch.set(doc(collection(db, 'users')), { username, password, name, role, employeeId: newEmpId });
      batch.set(doc(collection(db, 'employees')), { id: newEmpId, name, joinDate: join, leaveBalance: 0, leaveHistory: [] });
      
      await batch.commit();
      window.closeModal();
      alert(`✅ Akun ${ROLE_LABEL[role]} berhasil dibuat!\n\nNama: ${name}\nUsername: ${username}\nPassword: ${password}`);
      showTab('manage_accounts');

  function renderMyNotifications(notifications) {
    if (notifications.length === 0) {
      return `<div class="empty-state" style="padding: 20px;"><div class="icon">🔔</div><p>Belum ada notifikasi pengajuan.</p></div>`;
    }
    return notifications.map(n => {
      const isLeave = n.startDate !== undefined;
      const type = isLeave ? 'Pengajuan Cuti' : 'Request Adjust Cuti';
      const days = isLeave ? daysBetween(n.startDate, n.endDate) : n.adjustmentDays;
      const isApproved = n.status === 'approved';
      const badgeClass = isApproved ? 'badge-approved' : 'badge-rejected';
      const statusText = isApproved ? 'Disetujui' : 'Ditolak';
      const date = isLeave ? `${fmtDate(n.startDate)} - ${fmtDate(n.endDate)}` : `${days} hari`;
      const reason = n.reason || n.note;
      const decisionBy = n.approvedBy || n.rejectedBy || 'Sistem';
      const decisionDate = n.headApprovedAt || n.rejectedAt || n.approvedAt || 0;

      return `
        <div class="notification" style="border-left-color: ${isApproved ? '#10b981' : '#ef4444'}; background: ${isApproved ? '#f0fdf4' : '#fef2f2'}; margin-bottom: 8px;">
          <div class="notif-text" style="color: ${isApproved ? '#065f46' : '#991b1b'};">
            <strong>${type}</strong> Anda <span class="badge ${badgeClass}">${statusText}</span><br>
            Periode/Jumlah: <strong>${date}</strong><br>
            <em>${reason}</em><br>
            <small style="opacity: 0.8;">Oleh: ${decisionBy} pada ${fmtDate(decisionDate)}</small>
          </div>
        </div>
      `;
    }).join('');
  }

          .filter(r => r.status === 'approved' || r.status === 'rejected')

          .slice(0, 3);

          .sort((a, b) => new Date(b.headApprovedAt || b.rejectedAt || b.approvedAt || b.createdAt || 0).getTime() - new Date(a.headApprovedAt || a.rejectedAt || a.approvedAt || a.createdAt || 0).getTime())
          .slice(0, 5);
        
        myNotifHTML = renderMyNotifications(allNotifications);
      }

      const empSnap = await getDocs(collection(db, 'employees'));
      const empMap = {};
      empSnap.docs.forEach(d => { empMap[d.data().id] = d.data(); });

      const allReqs = await getDocs(collection(db, 'leaveRequests'));
      const pending = allReqs.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(r => r.status === 'pending_staff')
        .sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      
      let pendingHTML = '';
      if (pending.length === 0) {
        pendingHTML = `<div class="empty-state"><div class="icon">✨</div><p>Tidak ada pengajuan cuti yang menunggu review Anda.</p></div>`;
      } else {
        pending.forEach(req => {
          const days = daysBetween(req.startDate, req.endDate);
          const emp = empMap[req.employeeId];
          const currentBalance = emp ? emp.leaveBalance : 0;
          const projectedBalance = currentBalance - days;
          const isDebt = projectedBalance < 0;
          const balanceClass = isDebt ? 'balance-debt' : 'balance-safe';
          const balanceText = isDebt 
            ? `⚠️ Proyeksi: <strong class="${balanceClass}">Hutang ${Math.abs(projectedBalance)} hari</strong>` 
            : `✅ Proyeksi Sisa: <strong class="${balanceClass}">${projectedBalance} hari</strong>`;

          pendingHTML += `
            <div class="notification">
              <div style="flex: 1;">

                  <strong>${req.employeeName}</strong> mengajukan cuti <strong>${days} hari</strong><br>
                  Periode: ${fmtDate(req.startDate)} - ${fmtDate(req.endDate)}<br>
                  <em>Alasan: ${req.reason}</em>
                </div>
                <div class="balance-info">
                  Sisa cuti saat ini: <strong>${currentBalance} hari</strong> &nbsp;|&nbsp; Pengajuan: <strong>${days} hari</strong><br>
                  ${balanceText}
                </div>
              </div>
              <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-items:flex-start">
                <button class="btn btn-success btn-sm" onclick="staffApprove('${req.id}')">Terima</button>
                <button class="btn btn-danger btn-sm" onclick="staffReject('${req.id}')">Tolak</button>
              </div>
            </div>
          `;
        });
      }
      
      return `
        ${currentUser.employeeId ? `<div class="card"><h3>🔔 Notifikasi Pengajuan Saya</h3>${myNotifHTML}</div>` : ''}
        <div class="stats-grid">
          <div class="stat-card amber"><div class="label">Menunggu Review Anda</div><div class="value">${pending.length}</div></div>
        </div>
        <div class="card">
          <h3>📬 Pengajuan Cuti Perlu Review</h3>
          ${pendingHTML}
        </div>
      `;
    } catch (e) {
      console.error("Error:", e);
      return `<div class="card"><div class="hint-box danger">❌ Error: ${e.message}</div></div>`;
    }
  }

    if (!name || !username || !join) { alert('Lengkapi semua field!'); return; }
    
    const userCheck = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
    if (!userCheck.empty) { alert('⚠️ Username sudah digunakan!'); return; }
    
    const snap = await getDocs(collection(db, 'employees'));
    const emps = snap.docs.map(d => d.data());
    
    let num = 1;
    if (emps.length > 0) {
      const validEmps = emps.filter(e => /^E\d{3,}$/.test(e.id));
      if (validEmps.length > 0) {
        validEmps.sort((a, b) => b.id.localeCompare(a.id));
        num = parseInt(validEmps[0].id.substring(1)) + 1;
      } else {
        num = emps.length + 1;
      }
    }
    const newEmpId = 'E' + String(num).padStart(3, '0');
    
    const batch = writeBatch(db);
    batch.set(doc(collection(db, 'users')), { username, password: '1234', name, role: 'staff', employeeId: newEmpId });
    batch.set(doc(collection(db, 'employees')), { id: newEmpId, name, joinDate: join, leaveBalance: 0, leaveHistory: [] });
    
    await batch.commit();
    window.closeModal();
    alert('✅ Staff berhasil ditambahkan!\nUsername: ' + username + '\nPassword: 1234');
    showTab('employees');

      <div class="card">
        <h3>Riwayat Pengajuan Saya</h3>

  // ==========================================
  // TAB: LEAVE REQUESTS (Staff HRD Review)
  // ==========================================
  async function renderLeaveRequests() {
    try {
      const empSnap = await getDocs(collection(db, 'employees'));
      const empMap = {};
      empSnap.docs.forEach(d => { empMap[d.data().id] = d.data(); });

      const allReqs = await getDocs(collection(db, 'leaveRequests'));
      const all = allReqs.docs.map(d => ({ id: d.id, ...d.data() }));
      
      const pending = all.filter(r => r.status === 'pending_staff').sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      const processed = all.filter(r => r.status !== 'pending_staff').sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      
      const renderRows = (list, showAction) => list.map(r => {
        const days = daysBetween(r.startDate, r.endDate);
        const badge = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
        
        const emp = empMap[r.employeeId];
        const currentBalance = emp ? emp.leaveBalance : 0;
        const projectedBalance = currentBalance - days;
        const isDebt = projectedBalance < 0;
        const balanceClass = isDebt ? 'balance-debt' : 'balance-safe';
        const balanceText = isDebt ? `Hutang ${Math.abs(projectedBalance)} hr` : `Sisa ${projectedBalance} hr`;

        return `
          <tr>
            <td><strong>${r.employeeName}</strong></td>
            <td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td>
            <td>
              <strong>${days} hari</strong><br>
              <span style="font-size:11px; color:#64748b">Saldo: ${currentBalance} hr</span><br>
              <span class="${balanceClass}" style="font-size:11px; font-weight:600">→ ${balanceText}</span>
            </td>
            <td>${r.reason}</td>
            <td><span class="badge ${badge}">${r.status}</span></td>
            ${showAction ? `<td>
              <button class="btn btn-success btn-sm" onclick="staffApprove('${r.id}')">Terima</button>
              <button class="btn btn-danger btn-sm" onclick="staffReject('${r.id}')">Tolak</button>
            </td>` : ''}
          </tr>
        `;
      }).join('');

      return `
        <div class="card">
          <h3>Pengajuan Menunggu Review (${pending.length})</h3>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi & Proyeksi Saldo</th><th>Alasan</th><th>Status</th>${pending.length?'<th>Aksi</th>':''}</tr></thead>
              <tbody>${renderRows(pending, pending.length>0) || '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">Tidak ada pengajuan</td></tr>'}</tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <h3>Riwayat Pengajuan</h3>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th></tr></thead>
              <tbody>${renderRows(processed, false) || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada riwayat</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;
    } catch (e) {
      console.error(e);
      return `<div class="card"><div class="hint-box danger"> Error: ${e.message}</div></div>`;
    }
  }

  // ==========================================
  // APPROVAL FUNCTIONS (Kepala HRD) - DIPERBAIKI
  // ==========================================
  window.headApprove = async (reqId) => {
    if (!confirm('Setujui pengajuan cuti ini? Saldo cuti karyawan akan otomatis dikurangi.')) return;
    try {
      const reqRef = doc(db, 'leaveRequests', reqId);
      const reqSnap = await getDoc(reqRef);
      if (!reqSnap.exists()) { alert('❌ Data tidak ditemukan!'); return; }
      const reqData = reqSnap.data();

      // ✅ KURANGI SALDO CUTI KARYAWAN
      const eq = query(collection(db, 'employees'), where('id', '==', reqData.employeeId));
      const eSnap = await getDocs(eq);
      if (!eSnap.empty) {
        const empRef = eSnap.docs[0].ref;
        const empData = eSnap.docs[0].data();
        const days = daysBetween(reqData.startDate, reqData.endDate);
        const newBalance = empData.leaveBalance - days;
        const isDebt = newBalance < 0;
        
        const newHistory = [...(empData.leaveHistory || []), {
          date: new Date().toISOString().split('T')[0],
          type: 'Cuti (Disetujui)',
          days: days,
          amount: -days,
          note: `${reqData.reason} | Disetujui: ${currentUser.name}${isDebt ? ' | HUTANG CUTI' : ''}`
        }];
        
        await updateDoc(empRef, { 
          leaveBalance: newBalance, 
          leaveHistory: newHistory 
        });
      }

      await updateDoc(reqRef, { 
        status: 'approved', 
        headApprovedAt: new Date().toISOString(), 
        approvedBy: currentUser.name
      });
      
      alert('✅ Cuti disetujui dan saldo telah dikurangi!');
      showTab('dashboard');
    } catch (e) {
      console.error(e);
      alert('❌ Gagal: ' + e.message);
    }
  };

  window.handleChangePassword = async () => {

    if (!oldPass || !newPass || !confirmPass) { alert('Lengkapi semua field!'); return; }

      alert('✅ Password berhasil diubah! Silakan login ulang.');
      doLogout();
    } catch (e) {

        <td>${fmtDate(h.date)}</td>
        <td>${h.type}</td>
        <td>${h.days} hari</td>
        <td><span class="badge ${h.amount > 0 ? 'badge-plus' : 'badge-minus'}">${h.amount > 0 ? '+' : ''}${h.amount} hari</span></td>
        <td style="color:#64748b;font-size:11px">${h.note || '-'}</td>
      </tr>
    `).join('');
    return `<div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ==========================================
  // INIT
  // ==========================================
  seedData().then(() => {
    checkSession();
  });
</script>
</body>
</html>
