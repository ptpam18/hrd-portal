<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#4f46e5">
<title>HRD Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:#334155}
.container{max-width:1200px;margin:0 auto;padding:15px}
.login-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;padding:32px 28px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:380px}
.login-card h1{color:#4f46e5;text-align:center;margin-bottom:8px;font-size:24px}
.login-card p.subtitle{text-align:center;color:#64748b;margin-bottom:28px;font-size:13px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;color:#475569;font-weight:500;font-size:13px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;background:#f8fafc;-webkit-appearance:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#4f46e5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.form-group textarea{resize:vertical;min-height:80px}
.btn{padding:11px 18px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
.btn-primary{background:#4f46e5;color:#fff;width:100%}
.btn-primary:hover{background:#4338ca}
.btn-primary:active{transform:scale(.98)}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-warning{background:#f59e0b;color:#fff}
.btn-warning:hover{background:#d97706}
.btn-secondary{background:#e2e8f0;color:#475569}
.btn-secondary:hover{background:#cbd5e1}
.btn-info{background:#0ea5e9;color:#fff}
.btn-info:hover{background:#0284c7}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-purple:hover{background:#7c3aed}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.app-wrapper{display:none}
.app-wrapper.active{display:block}
.topbar{background:#fff;padding:14px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.topbar h2{color:#4f46e5;font-size:18px;display:flex;align-items:center;gap:8px}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar-wrapper{position:relative;cursor:pointer}
.user-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;overflow:hidden;border:2px solid #e2e8f0}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.avatar-edit-badge{position:absolute;bottom:-2px;right:-2px;background:#4f46e5;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #fff}
.user-detail{text-align:right}
.user-detail .name{font-weight:600;font-size:13px;color:#1e293b}
.user-detail .role{font-size:11px;color:#64748b}
.nav-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.nav-tab{padding:9px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;font-weight:500;font-family:inherit;color:#64748b;font-size:12px;white-space:nowrap;touch-action:manipulation}
.nav-tab:active{background:#f1f5f9}
.nav-tab.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card h3{color:#334155;margin-bottom:14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);border:1px solid #f1f5f9}
.stat-card .label{font-size:11px;color:#64748b;font-weight:500}
.stat-card .value{font-size:24px;font-weight:700;color:#1e293b;margin-top:4px}
.stat-card.indigo{border-left:4px solid #4f46e5}
.stat-card.emerald{border-left:4px solid #10b981}
.stat-card.amber{border-left:4px solid #f59e0b}
.stat-card.rose{border-left:4px solid #f43f5e}
.stat-card.debt{border-left:4px solid #dc2626;background:#fef2f2}
.stat-card.sky{border-left:4px solid #0ea5e9}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #f1f5f9}
th{background:#f8fafc;color:#64748b;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:#f8fafc}
tr.debt-row{background:#fef2f2}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-approved{background:#d1fae5;color:#065f46}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-minus{background:#fee2e2;color:#991b1b}
.badge-plus{background:#d1fae5;color:#065f46}
.badge-debt{background:#dc2626;color:#fff;font-weight:700}
.badge-self{background:#f3e8ff;color:#6b21a8}
.badge-role{background:#e0e7ff;color:#4338ca;font-weight:600}
.notification{background:#fffbeb;border-left:4px solid #f59e0b;padding:14px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.notification .notif-text{font-size:12px;color:#78350f;line-height:1.5}
.notification .notif-text strong{color:#451a03}
.notification.self-leave{background:#f5f3ff;border-left-color:#8b5cf6}
.balance-info{background:rgba(255,255,255,.7);padding:8px 12px;border-radius:8px;font-size:12px;margin-top:6px;border:1px solid #e2e8f0}
.balance-safe{color:#059669;font-weight:600}
.balance-debt{color:#dc2626;font-weight:700}
.debt-warning,.lock-warning,.flow-info{border-radius:12px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.debt-warning{background:#fef2f2;border:2px solid #dc2626}
.debt-warning .icon{font-size:32px}
.debt-warning .text{flex:1}
.debt-warning .text strong{color:#dc2626;font-size:16px}
.debt-warning .text p{color:#991b1b;font-size:13px;margin-top:4px}
.lock-warning{background:#fff7ed;border:2px solid #f97316}
.lock-warning .icon{font-size:32px}
.lock-warning .text strong{color:#c2410c;font-size:15px}
.flow-info{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:2px solid #0ea5e9}
.flow-info .icon{font-size:28px}
.flow-info .text strong{color:#0369a1;font-size:14px}
.flow-info .text p{color:#075985;font-size:12px;margin-top:4px}
.leave-calculator{background:#f0fdf4;border:2px solid #10b981;border-radius:12px;padding:14px;margin-top:12px;display:none}
.leave-calculator.debt{background:#fef2f2;border-color:#dc2626}
.leave-calculator .calc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px dashed #e2e8f0}
.leave-calculator .calc-row:last-child{border-bottom:none;font-weight:700;font-size:14px}
.leave-calculator .calc-label{color:#475569}
.leave-calculator .calc-value{color:#1e293b;font-weight:600}
.leave-calculator.debt .calc-value{color:#dc2626}
.leave-calculator .debt-alert{background:#dc2626;color:#fff;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px;font-weight:600;text-align:center}
.reviewer-badge{display:inline-flex;align-items:center;gap:4px;background:#dbeafe;color:#1e40af;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-top:4px}
.reviewer-badge.rejected{background:#fee2e2;color:#991b1b}
.reviewer-badge.director{background:#f3e8ff;color:#6b21a8}
.filter-bar,.search-bar,.action-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #e2e8f0}
.filter-bar label,.search-bar label{font-size:13px;font-weight:500;color:#475569;display:flex;align-items:center;gap:6px}
.filter-bar select,.filter-bar input,.search-bar input{flex:1;min-width:180px}
.search-bar input{padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff}
.search-bar input:focus{outline:none;border-color:#4f46e5}
.search-bar .result-count{font-size:12px;color:#64748b;background:#e2e8f0;padding:4px 10px;border-radius:12px;font-weight:500}
.action-bar{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border-color:#bae6fd}
.action-bar .action-label{font-size:13px;font-weight:600;color:#0369a1;margin-right:auto}
.chart-container{position:relative;height:280px;margin:16px 0}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chart-card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);border:1px solid #f1f5f9}
.chart-card h4{font-size:13px;color:#475569;margin-bottom:12px;font-weight:600}
.empty-state{text-align:center;padding:30px 15px;color:#94a3b8}
.empty-state .icon{font-size:36px;margin-bottom:10px;opacity:.5}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.7);z-index:1000;align-items:center;justify-content:center;padding:15px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal h3{color:#4f46e5;margin-bottom:18px;font-size:17px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.hint-box{background:#eff6ff;border-left:4px solid #3b82f6;padding:10px 12px;border-radius:8px;font-size:12px;color:#1e40af;margin-bottom:14px}
.hint-box.warning{background:#fef3c7;border-left-color:#f59e0b;color:#92400e}
.hint-box.danger{background:#fee2e2;border-left-color:#ef4444;color:#991b1b}
.hint-box.success{background:#d1fae5;border-left-color:#10b981;color:#065f46}
.hint-box.orange{background:#fff7ed;border-left-color:#f97316;color:#9a3412}
.hint-box.purple{background:#f5f3ff;border-left-color:#8b5cf6;color:#6b21a8}
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
.loading-wrapper{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#64748b}
.spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;font-weight:500}
.loading-subtext{font-size:12px;color:#94a3b8;margin-top:4px}
.error-box{background:#fee2e2;border:2px solid #ef4444;border-radius:12px;padding:20px;text-align:center;color:#991b1b}
.error-box .icon{font-size:48px;margin-bottom:12px}
.btn-group{display:flex;gap:4px;flex-wrap:wrap}
.profile-photo-cell{display:flex;align-items:center;gap:8px}
.profile-photo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;border:2px solid #e2e8f0;flex-shrink:0}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.photo-upload-preview{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:48px;overflow:hidden;border:3px solid #e2e8f0}
.photo-upload-preview img{width:100%;height:100%;object-fit:cover}
.photo-upload-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.required-field{border-color:#f59e0b!important;background:#fffbeb!important}
.required-label{color:#dc2626!important;font-weight:600!important}
.required-label::after{content:' *';color:#dc2626}
.print-header{display:none}
@media print{
body{background:#fff!important}
.topbar,.nav-tabs,.btn,.action-bar,.modal-overlay,.search-bar,.filter-bar,.hint-box,.debt-warning,.lock-warning,.flow-info,#photoFileInput{display:none!important}
.container{padding:0;max-width:100%}
.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
.app-wrapper{display:block!important}
#mainContent{display:block!important}
table{font-size:11px}
th,td{padding:6px 4px}
.print-header{display:block!important;text-align:center;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #4f46e5}
.print-header h1{color:#4f46e5;font-size:20px;margin-bottom:4px}
.print-header p{color:#64748b;font-size:12px}
}
@media(max-width:640px){
.container{padding:10px}
.login-card{padding:24px 20px}
.topbar{flex-direction:column;gap:12px;text-align:center;padding:12px 14px}
.user-detail{text-align:center}
.user-info{flex-direction:row-reverse}
.stats-grid{grid-template-columns:1fr 1fr}
.card{padding:14px}
.nav-tabs{gap:4px}
.nav-tab{padding:8px 12px;font-size:11px}
table{font-size:12px}
th,td{padding:8px 6px}
.notification{flex-direction:column;align-items:stretch}
.modal{padding:20px;border-radius:12px}
.chart-grid{grid-template-columns:1fr}
.filter-bar,.search-bar,.action-bar{flex-direction:column;align-items:stretch}
.filter-bar select,.filter-bar input,.search-bar input{width:100%;min-width:unset}
.stat-card .value{font-size:20px}
.btn-sm{padding:5px 8px;font-size:11px}
.action-bar .btn{width:100%}
}
@media(max-width:360px){.stats-grid{grid-template-columns:1fr}.btn-group{flex-direction:column}.btn-group .btn{width:100%}}
</style>
</head>
<body>

<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <h1>🌿 HRD Portal</h1>
    <p class="subtitle">Sistem Manajemen Karyawan & Cuti</p>
    <div class="form-group"><label>Username</label><input type="text" id="loginUsername" placeholder="Masukkan username" autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
    <div class="hint-box" style="margin-top:16px;text-align:center">💡 Huruf besar/kecil tidak masalah</div>
  </div>
</div>

<div class="app-wrapper" id="appScreen">
  <div class="container">
    <div class="topbar">
      <h2>🌿 HRD Portal</h2>
      <div class="user-info">
        <div class="user-detail">
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
        <div class="user-avatar-wrapper" onclick="openPhotoUpload()" title="Klik untuk ganti foto">
          <div class="user-avatar" id="userAvatar">-</div>
          <div class="avatar-edit-badge">📷</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="doLogout()">Keluar</button>
      </div>
    </div>
    <div class="nav-tabs" id="navTabs"></div>
    <div id="mainContent"><div class="loading-wrapper"><div class="spinner"></div><div class="loading-text">Memuat...</div></div></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
<div class="print-header" id="printHeader"><h1>🌿 HRD Portal - Laporan Cuti Karyawan</h1><p id="printSubtitle"></p><p id="printDate"></p></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,collection,getDocs,getDoc,addDoc,setDoc,updateDoc,deleteDoc,doc,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDhGxzuzU-pQo6p8xJwdmC6bQIZV-po-A4",authDomain:"hrd-portal-9a5fd.firebaseapp.com",projectId:"hrd-portal-9a5fd",storageBucket:"hrd-portal-9a5fd.firebasestorage.app",messagingSenderId:"938883233737",appId:"1:938883233737:web:9368aac16b5b6a12685a18"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window.db=db;

const cache={employees:null,users:null,leaveRequests:null,adjustmentRequests:null,lastFetch:0,TTL:30000};
let currentUser=null,currentUserDocId=null,chartLoaded=false,sheetLoaded=false;

const RL={superuser:'Superuser',direktur:'Direktur',komisaris:'Komisaris',kepala_hrd:'Kepala HRD',staff_hrd:'Staff HRD',staff:'Staff Biasa'};

const REASONS=[
{v:'',l:'-- Pilih Alasan Cuti --'},{v:'Cuti Tahunan',l:'🏖️ Cuti Tahunan'},{v:'Cuti Sakit',l:'🤒 Cuti Sakit'},
{v:'Cuti Besar',l:'🏝️ Cuti Besar (6 tahun)'},{v:'Cuti Melahirkan',l:'🤰 Cuti Melahirkan'},{v:'Cuti Keguguran',l:' Cuti Keguguran'},
{v:'Cuti Ayah',l:'👨‍ Cuti Ayah'},{v:'Cuti Pernikahan',l:'💍 Cuti Pernikahan'},{v:'Cuti Kematian Keluarga',l:'🕯️ Kematian Keluarga'},
{v:'Cuti Haji/Umroh',l:'🕋 Haji/Umroh'},{v:'Cuti Ibadah',l:'🙏 Ibadah Agama'},{v:'Cuti Kecelakaan Kerja',l:' Kecelakaan Kerja'},
{v:'Cuti Sakit Keluarga',l:'👨‍‍👧 Sakit Keluarga'},{v:'Cuti Dokumen Negara',l:'📄 Dokumen Negara'},{v:'Cuti Pindah Rumah',l:'🏠 Pindah Rumah'},
{v:'Cuti Ujian',l:'📚 Ujian'},{v:'Cuti Serikat Pekerja',l:'✊ Serikat Pekerja'},{v:'Cuti Bencana Alam',l:'🌊 Bencana Alam'},
{v:'Cuti Tugas Negara',l:'🏛️ Tugas Negara'},{v:'Cuti Wajib',l:'📋 Cuti Wajib'},{v:'Cuti Mendesak',l:'⚡ Mendesak'},
{v:'Lainnya',l:'📝 Lainnya (wajib isi)'}
];

const HRD_ROLES=[{v:'staff',l:'Staff Biasa'},{v:'staff_hrd',l:'Staff HRD'}];

const fd=d=>{if(!d)return'-';try{return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}catch{return'-'}};
const fdt=d=>{if(!d)return'-';try{const x=new Date(d);return x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+x.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch{return'-'}};
const dbt=(a,b)=>{try{return Math.floor((new Date(b)-new Date(a))/(1e3*60*60*24))+1}catch{return 0}};
const eligible=j=>{try{return(Date.now()-new Date(j))/(1e3*60*60*24*365.25)>=1}catch{return false}};

function lockStatus(){
const n=new Date();if(n.getDate()<=10)return{locked:false,message:''};
const lm=n.getMonth()===0?11:n.getMonth()-1,ly=n.getMonth()===0?n.getFullYear()-1:n.getFullYear();
const mn=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
return{locked:true,lm,ly,message:`🔒 Cuti ${mn[lm]} ${ly} dikunci (lock tgl 10 ${mn[n.getMonth()]})`};
}
function isLocked(d){const l=lockStatus();if(!l.locked)return false;const x=new Date(d);return x.getMonth()===l.lm&&x.getFullYear()===l.ly}
function sLabel(s){return{'pending_staff':'Menunggu Staff HRD','pending_staff_hrd_peer':'Menunggu Review HRD','pending_head':'Menunggu Kepala HRD','pending_director':'Menunggu Direktur','approved':'Disetujui','rejected':'Ditolak'}[s]||s}
function rDate(l){if(l.status==='approved')return l.directorApprovedAt||l.headApprovedAt||l.createdAt;if(l.status==='rejected')return l.directorRejectedAt||l.rejectedAt||l.createdAt;return l.createdAt}

async function fetchCol(name){
const now=Date.now();
if(cache[name]&&(now-cache.lastFetch)<cache.TTL)return cache[name];
try{const s=await getDocs(collection(db,name));cache[name]=s.docs.map(d=>({id:d.id,...d.data()}));cache.lastFetch=now;return cache[name]}
catch(e){console.error(e);return cache[name]||[]}
}
function invCache(){cache.lastFetch=0}

async function monthlyReport(){
const n=new Date();if(n.getDate()<11)return null;
const mk=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`,rid=`report_${mk}`,ref=doc(db,'monthlyReports',rid);
const ex=await getDoc(ref);if(ex.exists())return ex.data();
const[emps,leaves,adjs]=await Promise.all([fetchCol('employees'),fetchCol('leaveRequests'),fetchCol('adjustmentRequests')]);
const ml=leaves.filter(l=>{const d=new Date(rDate(l)||0);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()});
const ma=adjs.filter(a=>{const d=new Date(a.requestedAt||a.approvedAt||a.rejectedAt||0);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()});
const app=ml.filter(l=>l.status==='approved'),rej=ml.filter(l=>l.status==='rejected'),pen=ml.filter(l=>l.status.startsWith('pending'));
const tld=app.reduce((s,l)=>s+dbt(l.startDate,l.endDate),0);
const lbe={};app.forEach(l=>{const d=dbt(l.startDate,l.endDate);lbe[l.employeeName]=(lbe[l.employeeName]||0)+d});
const rc={};app.forEach(l=>{const r=(l.reasonType||l.reason||'Lainnya').toUpperCase().trim();rc[r]=(rc[r]||0)+1});
const bd={positive:emps.filter(e=>e.leaveBalance>0).length,zero:emps.filter(e=>e.leaveBalance===0).length,negative:emps.filter(e=>e.leaveBalance<0).length};
const tb=emps.reduce((s,e)=>s+e.leaveBalance,0);
const rp={mk,ga:n.toISOString(),te:emps.length,tlr:ml.length,app:app.length,rej:rej.length,pen:pen.length,tld,alp:emps.length>0?(tld/emps.length).toFixed(1):0,
ewd:emps.filter(e=>e.leaveBalance<0).map(e=>({name:e.name,debt:Math.abs(e.leaveBalance),id:e.id})),
tlu:Object.entries(lbe).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,days])=>({name,days})),lbr:rc,bd,tbc:tb,ab:emps.length>0?(tb/emps.length).toFixed(1):0,
ta:ma.length,aa:ma.filter(a=>a.status==='approved').length};
await setDoc(ref,rp);return rp;
}

function resizeImg(file,mw,mh,q=.8){
return new Promise((res,rej)=>{
const r=new FileReader();
r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>mw){h=Math.round(h*mw/w);w=mw}}else{if(h>mh){w=Math.round(w*mh/h);h=mh}}c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=e.target.result};
r.onerror=rej;r.readAsDataURL(file);
});
}

if(!currentUser.employeeId)return`<div class="card"><div class="empty-state"><div class="icon">👤</div><p>Data tidak terhubung.</p></div></div>`;
const emps=await fetchCol('employees'),emp=emps.find(e=>e.id===currentUser.employeeId);if(!emp)return`<div class="card"><div class="empty-state"><div class="icon">👤</div><p>Data tidak ditemukan.</p></div></div>`;
const id=emp.leaveBalance<0,ls=lockStatus();
const mr=(await fetchCol('leaveRequests')).filter(r=>r.employeeId===emp.id).sort((a,b)=>new Date(b.createdAt||0).getTime()-new Date(a.createdAt||0).getTime());
const rows=mr.map(r=>{const d=dbt(r.startDate,r.endDate),bd=r.status==='approved'?'badge-approved':r.status==='rejected'?'badge-rejected':'badge-pending';return`<tr><td>${fd(r.startDate)} - ${fd(r.endDate)}</td><td>${d} hr</td><td>${r.reason}</td><td><span class="badge ${bd}">${sLabel(r.status)}</span></td></tr>`}).join('');
const ro=REASONS.map(r=>`<option value="${r.v}">${r.l}</option>`).join('');
let fi='';if(currentUser.role==='staff_hrd')fi=`<div class="flow-info"><div class="icon">📋</div><div class="text"><strong>Alur Staff HRD</strong><p>Anda → Review Staff HRD lain → Approval Kepala HRD</p></div></div>`;else if(currentUser.role==='kepala_hrd')fi=`<div class="flow-info" style="background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-color:#8b5cf6"><div class="icon">📋</div><div class="text"><strong>Alur Kepala HRD</strong><p>Anda → Approval Direktur (1 langkah)</p></div></div>`;
return`${id?`<div class="debt-warning"><div class="icon">⚠️</div><div class="text"><strong>HUTANG: ${Math.abs(emp.leaveBalance)} hr</strong><p>Cuti tambahan menambah hutang.</p></div></div>`:''}${ls.locked?`<div class="lock-warning"><div class="icon">🔒</div><div class="text"><strong>${ls.message}</strong></div></div>`:''}${fi}<div class="card"><h3>📝 Form Cuti</h3><div class="hint-box ${id?'danger':''}">💡 Sisa: <strong style="color:${id?'#dc2626':'#4f46e5'}">${emp.leaveBalance} hr</strong> ${id?'(HUTANG)':''}</div><div class="form-group"><label>📅 Mulai</label><input type="date" id="lvStart" onchange="calcProj()"></div><div class="form-group"><label>📅 Selesai</label><input type="date" id="lvEnd" onchange="calcProj()"></div><div class="form-group"><label>📋 Alasan</label><select id="lvReason" onchange="onReasonChange()">${ro}</select></div><div class="form-group" id="otherGrp" style="display:none"><label class="required-label">📝 Keterangan</label><textarea id="otherTxt" rows="3" placeholder="Detail..." oninput="onOtherInput()"></textarea><small style="color:#dc2626;font-size:11px;display:none" id="otherHint">⚠️ Wajib</small></div><div id="lvCalc" class="leave-calculator" data-bal="${emp.leaveBalance}"></div><button class="btn btn-primary" style="width:auto;margin-top:12px" onclick="submitLeave('${emp.id}','${emp.name}',${emp.leaveBalance})">Kirim</button></div><div class="card"><h3>📜 Riwayat</h3><div class="table-wrapper"><table><thead><tr><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="text-align:center;padding:20px;color:#94a3b8">Belum ada</td></tr>'}</tbody></table></div></div>`}

window.onReasonChange=()=>{const r=document.getElementById('lvReason').value,g=document.getElementById('otherGrp'),t=document.getElementById('otherTxt'),h=document.getElementById('otherHint');if(r==='Lainnya'){g.style.display='block';t.focus()}else{g.style.display='none';t.value='';t.classList.remove('required-field');h.style.display='none'}};
window.onOtherInput=()=>{const t=document.getElementById('otherTxt'),h=document.getElementById('otherHint');if(t.value.trim().length===0){t.classList.add('required-field');h.style.display='block'}else{t.classList.remove('required-field');h.style.display='none'}};

window.calcProj=()=>{const s=document.getElementById('lvStart').value,e=document.getElementById('lvEnd').value,c=document.getElementById('lvCalc');if(!s||!e||new Date(e)<new Date(s)){c.style.display='none';return}const d=dbt(s,e),cb=parseInt(c.dataset.bal||0),pb=cb-d,id=pb<0;c.className='leave-calculator'+(id?' debt':'');c.style.display='block';c.innerHTML=`<div class="calc-row"><span class="calc-label">📅 Periode</span><span class="calc-value">${fd(s)} - ${fd(e)}</span></div><div class="calc-row"><span class="calc-label">⏱️ Durasi</span><span class="calc-value">${d} hari</span></div><div class="calc-row"><span class="calc-label">💰 Saldo</span><span class="calc-value">${cb} hr</span></div><div class="calc-row"><span class="calc-label">📊 Proyeksi</span><span class="calc-value">${pb} hr</span></div>${id?`<div class="debt-alert">⚠️ HUTANG CUTI ${Math.abs(pb)} hari</div>`:`<div style="background:#10b981;color:#fff;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px;font-weight:600;text-align:center">✅ Saldo mencukupi</div>`}`}

window.submitLeave=async(eid,ename,cbal)=>{const s=document.getElementById('lvStart').value,e=document.getElementById('lvEnd').value,rt=document.getElementById('lvReason').value,ot=document.getElementById('otherTxt').value.trim();if(!s||!e){alert('⚠️ Pilih tanggal!');return}if(new Date(e)<new Date(s)){alert('⚠️ Tanggal tidak valid!');return}if(!rt){alert('️ Pilih alasan!');return}let fr=rt;if(rt==='Lainnya'){if(!ot||ot.length<5){alert('⚠️ Isi keterangan min 5 karakter!');document.getElementById('otherTxt').classList.add('required-field');document.getElementById('otherTxt').focus();return}fr=`Lainnya: ${ot}`}if(isLocked(s)||isLocked(e)){alert(`🔒 ${lockStatus().message}`);return}const d=dbt(s,e),pb=cbal-d;if(pb<0&&!confirm(`⚠️ HUTANG CUTI!\n\nSaldo: ${cbal} hr\nCuti: ${d} hr\nProyeksi: ${pb} hr (HUTANG ${Math.abs(pb)} hr)\n\nLanjutkan?`))return;let is='pending_staff';if(currentUser.role==='staff_hrd')is='pending_staff_hrd_peer';else if(currentUser.role==='kepala_hrd')is='pending_director';await addDoc(collection(db,'leaveRequests'),{employeeId:eid,employeeName:ename,employeeRole:currentUser.role,startDate:s,endDate:e,reason:fr,reasonType:rt,reasonDetail:rt==='Lainnya'?ot:'',status:is,createdAt:new Date().toISOString()});invCache();alert('✅ Dikirim!');showTab('apply_leave')};

// ============ ADJUST ============
async function renderLeaveMgmt(){const emps=(await fetchCol('employees')).sort((a,b)=>a.name.localeCompare(b.name,'id'));const rows=emps.map(e=>{const id=e.leaveBalance<0;return`<tr class="${id?'debt-row':''}"><td>${e.id}</td><td><strong>${e.name}</strong></td><td><strong style="color:${id?'#dc2626':'#1e293b'}">${e.leaveBalance}</strong> hr ${id?'<span class="badge badge-debt">HUTANG</span>':''}</td><td><button class="btn btn-warning btn-sm" onclick="openAdj('${e.id}','${e.name}',${e.leaveBalance})">Adjust</button></td></tr>`}).join('');return`<div class="card"><h3>️ Request Adjust</h3><div class="hint-box">💡 Adjust cuti harus disetujui Kepala HRD.</div><div class="table-wrapper"><table><thead><tr><th>ID</th><th>Nama</th><th>Sisa Cuti</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}

window.openAdj=(eid,name,cb)=>window.openModal(`<h3>Adjust - ${name}</h3><p>Saldo: <strong>${cb} hr</strong></p><div class="form-group"><label>Jumlah Hari (minus = kurangi)</label><input type="number" id="adjDays" placeholder="-2 atau 12"></div><div class="form-group"><label>Catatan</label><textarea id="adjNote" rows="2"></textarea></div><div class="modal-actions"><button class="btn btn-secondary" onclick="window.closeModal()">Batal</button><button class="btn btn-primary" style="width:auto" onclick="submitAdj('${eid}','${name}',${cb})">Kirim</button></div>`);

window.submitAdj=async(eid,ename,cb)=>{const d=parseInt(document.getElementById('adjDays').value),n=document.getElementById('adjNote').value.trim()||'Adjustment';if(isNaN(d)){alert('Tidak valid!');return}await addDoc(collection(db,'adjustmentRequests'),{employeeId:eid,employeeName:ename,currentBalance:cb,adjustmentDays:d,note:n,status:'pending_head',requestedBy:currentUser.name,requesterEmployeeId:currentUser.employeeId,requestedAt:new Date().toISOString()});invCache();window.closeModal();alert('✅ Dikirim!');showTab('leave_mgmt')};

// ============ REVIEW CUTI ============
async function renderLeaveRequests(){
try{const emps=await fetchCol('employees'),em={};emps.forEach(e=>em[e.id]=e);const all=await fetchCol('leaveRequests'),pend=all.filter(r=>(r.status==='pending_staff'||r.status==='pending_staff_hrd_peer')&&r.employeeId!==currentUser.employeeId).sort((a,b)=>new Date(b.createdAt||0).getTime()-new Date(a.createdAt||0).getTime()),proc=all.filter(r=>r.status!=='pending_staff'&&r.status!=='pending_staff_hrd_peer').sort((a,b)=>new Date(b.createdAt||0).getTime()-new Date(a.createdAt||0).getTime());
const rR=(list,sa)=>list.map(r=>{const d=dbt(r.startDate,r.endDate),bd=r.status==='approved'?'badge-approved':r.status==='rejected'?'badge-rejected':'badge-pending',e=em[r.employeeId],cb=e?e.leaveBalance:0,pb=cb-d,id=pb<0;let ri='';if(r.status==='pending_head'&&r.staffHrdName)ri=`<br><span class="reviewer-badge">✅ ${r.staffHrdName}</span>`;else if(r.status==='rejected'&&r.rejectedBy)ri=`<br><span class="reviewer-badge rejected">❌ ${r.rejectedBy}</span>`;else if(r.status==='approved'&&r.approvedBy)ri=`<br><span class="reviewer-badge">✅ ${r.approvedBy}</span>`;else if(r.status==='approved'&&r.directorApprovedBy)ri=`<br><span class="reviewer-badge director">✅ ${r.directorApprovedBy} (Direktur)</span>`;const il=r.employeeRole==='staff_hrd',rb=il?'<span class="badge badge-self">Staff HRD</span>':'';return`<tr><td><strong>${r.employeeName}</strong> ${rb}</td><td>${fd(r.startDate)} - ${fd(r.endDate)}</td><td><strong>${d} hr</strong><br><span style="font-size:11px;color:#64748b">Saldo: ${cb}</span><br><span class="${id?'balance-debt':'balance-safe'}" style="font-size:11px;font-weight:600">→ ${id?`Hutang ${Math.abs(pb)}`:`Sisa ${pb}`}</span></td><td>${r.reason}${ri}</td><td><span class="badge ${bd}">${sLabel(r.status)}</span></td>${sa?`<td><button class="btn btn-success btn-sm" onclick="staffApprove('${r.id}')">Terima</button><button class="btn btn-danger btn-sm" onclick="staffReject('${r.id}')">Tolak</button></td>`:''}</tr>`}).join('');
return`<div class="card"><h3>📬 Menunggu Review (${pend.length})</h3><div class="hint-box orange">👥 Yang pertama klik tercatat. Tidak bisa review sendiri.</div><div class="table-wrapper"><table><thead><tr><th>Nama</th><th>Periode</th><th>Durasi & Saldo</th><th>Alasan</th><th>Status</th>${pend.length?'<th>Aksi</th>':''}</tr></thead><tbody>${rR(pend,pend.length>0)||'<tr><td colspan="6" style="text-align:center;padding:20px;color:#94a3b8">Tidak ada</td></tr>'}</tbody></table></div></div><div class="card"><h3>📜 Riwayat</h3><div class="table-wrapper"><table><thead><tr><th>Nama</th><th>Periode</th><th>Durasi</th><th>Alasan & Reviewer</th><th>Status</th></tr></thead><tbody>${rR(proc,false)||'<tr><td colspan="5" style="text-align:center;padding:20px;color:#94a3b8">Belum ada</td></tr>'}</tbody></table></div></div>`}catch(e){return`<div class="card"><div class="hint-box danger">❌ ${e.message}</div></div>`}
}

window.staffApprove=async(rid)=>{try{const rr=doc(db,'leaveRequests',rid),rs=await getDoc(rr);if(!rs.exists()){alert('Tidak ditemukan!');return}const rd=rs.data();if(rd.employeeId===currentUser.employeeId){alert('⚠️ Tidak bisa review sendiri!');return}if(rd.status!=='pending_staff'&&rd.status!=='pending_staff_hrd_peer'){alert(`Sudah diproses!\nStatus: ${sLabel(rd.status)}\nOleh: ${rd.staffHrdName||rd.rejectedBy||'-'}`);return}await updateDoc(rr,{status:'pending_head',staffHrdApprovedAt:new Date().toISOString(),staffHrdName:currentUser.name,staffHrdUsername:currentUser.username});invCache();alert(`✅ Diteruskan ke Kepala HRD.\nReviewer: ${currentUser.name}`);showTab('leave_requests')}catch(e){alert('❌ '+e.message)}};

window.staffReject=async(rid)=>{try{const rr=doc(db,'leaveRequests',rid),rs=await getDoc(rr);if(!rs.exists()){alert('Tidak ditemukan!');return}const rd=rs.data();if(rd.employeeId===currentUser.employeeId){alert('⚠️ Tidak bisa tolak sendiri!');return}if(rd.status!=='pending_staff'&&rd.status!=='pending_staff_hrd_peer'){alert(`Sudah diproses!\nStatus: ${sLabel(rd.status)}`);return}await updateDoc(rr,{status:'rejected',rejectedBy:currentUser.name,rejectedByUsername:currentUser.username,rejectedAt:new Date().toISOString()});invCache();alert(`✅ Ditolak.\nPenolak: ${currentUser.name}`);showTab('leave_requests')}catch(e){alert('❌ '+e.message)}};

window.headApprove=async(rid)=>{if(!confirm('Setujui? Saldo dikurangi.'))return;try{const rr=doc(db,'leaveRequests',rid),rs=await getDoc(rr);if(!rs.exists()){alert('Tidak ditemukan!');return}const rd=rs.data(),es=await getDocs(query(collection(db,'employees'),where('id','==',rd.employeeId)));if(!es.empty){const er=es.docs[0].ref,ed=es.docs[0].data(),d=dbt(rd.startDate,rd.endDate),nb=ed.leaveBalance-d,id=nb<0,nh=[...(ed.leaveHistory||[]),{date:new Date().toISOString().split('T')[0],timestamp:new Date().toISOString(),type:'Cuti (Disetujui)',days:d,amount:-d,note:`${rd.reason} | Oleh: ${currentUser.name}${id?' | HUTANG':''}`}];await updateDoc(er,{leaveBalance:nb,leaveHistory:nh})}await updateDoc(rr,{status:'approved',headApprovedAt:new Date().toISOString(),approvedBy:currentUser.name});invCache();alert('✅ Disetujui!');showTab('dashboard')}catch(e){alert('❌ '+e.message)}};

window.headReject=async(rid)=>{if(!confirm('Tolak?'))return;try{await updateDoc(doc(db,'leaveRequests',rid),{status:'rejected',rejectedBy:currentUser.name});invCache();alert('✅ Ditolak.');showTab('dashboard')}catch(e){alert('❌ '+e.message)}};

window.dirApprove=async(rid)=>{if(!confirm('Setujui cuti Kepala HRD?'))return;try{const rr=doc(db,'leaveRequests',rid),rs=await getDoc(rr);if(!rs.exists()){alert('Tidak ditemukan!');return}const rd=rs.data(),es=await getDocs(query(collection(db,'employees'),where('id','==',rd.employeeId)));if(!es.empty){const er=es.docs[0].ref,ed=es.docs[0].data(),d=dbt(rd.startDate,rd.endDate),nb=ed.leaveBalance-d,id=nb<0,nh=[...(ed.leaveHistory||[]),{date:new Date().toISOString().split('T')[0],timestamp:new Date().toISOString(),type:'Cuti (Disetujui Direktur)',days:d,amount:-d,note:`${rd.reason} | Oleh Direktur: ${currentUser.name}${id?' | HUTANG':''}`}];await updateDoc(er,{leaveBalance:nb,leaveHistory:nh})}await updateDoc(rr,{status:'approved',directorApprovedAt:new Date().toISOString(),directorApprovedBy:currentUser.name});invCache();alert('✅ Disetujui!');showTab('director_approval')}catch(e){alert('❌ '+e.message)}};

window.dirReject=async(rid)=>{if(!confirm('Tolak?'))return;try{await updateDoc(doc(db,'leaveRequests',rid),{status:'rejected',directorRejectedBy:currentUser.name,directorRejectedAt:new Date().toISOString()});invCache();alert('✅ Ditolak.');showTab('director_approval')}catch(e){alert('❌ '+e.message)}};

window.approveAdj=async(rid)=>{if(!confirm('Setujui adjust?'))return;try{const rr=doc(db,'adjustmentRequests',rid),rs=await getDoc(rr);if(!rs.exists())return;const rd=rs.data(),es=await getDocs(query(collection(db,'employees'),where('id','==',rd.employeeId)));if(!es.empty){const er=es.docs[0].ref,ed=es.docs[0].data(),nb=ed.leaveBalance+rd.adjustmentDays,id=nb<0,nh=[...(ed.leaveHistory||[]),{date:new Date().toISOString().split('T')[0],timestamp:new Date().toISOString(),type:'Adjustment (Disetujui)',days:Math.abs(rd.adjustmentDays),amount:rd.adjustmentDays,note:`${rd.note} | Oleh: ${rd.requestedBy} → ${currentUser.name}${id?' | HUTANG':''}`}];await updateDoc(er,{leaveBalance:nb,leaveHistory:nh})}await updateDoc(rr,{status:'approved',approvedBy:currentUser.name,approvedAt:new Date().toISOString()});invCache();alert('✅ Disetujui!');showTab('dashboard')}catch(e){alert('❌ '+e.message)}};

window.rejectAdj=async(rid)=>{if(!confirm('Tolak adjust?'))return;try{await updateDoc(doc(db,'adjustmentRequests',rid),{status:'rejected',rejectedBy:currentUser.name,rejectedAt:new Date().toISOString()});invCache();alert('✅ Ditolak.');showTab('dashboard')}catch(e){alert('❌ '+e.message)}};

// ============ MUTASI CUTI ============
async function renderLeaveView(){
const emps=await fetchCol('employees'),ehm={};
emps.forEach(e=>{ehm[e.id]={emp:e,hist:(e.leaveHistory||[]).map(h=>({...h,empId:e.id,empName:e.name,isDebt:e.leaveBalance<0}))}});
Object.keys(ehm).forEach(eid=>{const{emp,hist}=ehm[eid],sorted=[...hist].sort((a,b)=>new Date(a.timestamp||a.date||0).getTime()-new Date(b.timestamp||b.date||0).getTime()),ta=sorted.reduce((s,h)=>s+(h.amount||0),0),ib=emp.leaveBalance-ta;let rb=ib;sorted.forEach(h=>{rb+=(h.amount||0);h.runningBalance=rb});ehm[eid].sh=sorted});
const ah=[];Object.values(ehm).forEach(({sh})=>{if(sh)ah.push(...sh)});ah.sort((a,b)=>new Date(b.timestamp||b.date||0).getTime()-new Date(a.timestamp||a.date||0).getTime());
const en=emps.map(e=>e.name).sort();
return`<div class="card"><h3>📅 Mutasi Cuti</h3><div class="hint-box">💡 Diurutkan terbaru. Saldo berjalan (running balance).</div><div class="filter-bar"><label>🔍 Filter:</label><select id="filterEmp" onchange="applyLVFilter()"><option value="">-- Semua --</option>${en.map(n=>`<option value="${n}">${n}</option>`).join('')}</select><button class="btn btn-secondary btn-sm" onclick="resetLVFilter()">Reset</button></div><div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Sisa</th><th>Catatan</th></tr></thead><tbody id="lvBody">${rLVRows(ah)}</tbody></table></div></div>`}

function rLVRows(hl){if(hl.length===0)return'<tr><td colspan="7" style="text-align:center;padding:20px;color:#94a3b8">Tidak ada</td></tr>';return hl.map(h=>{const dd=h.timestamp?fdt(h.timestamp):fd(h.date),id=h.runningBalance<0;return`<tr class="${id?'debt-row':''}" data-en="${h.empName}"><td><strong>${dd}</strong></td><td><strong>${h.empName}</strong> ${id?'<span class="badge badge-debt">HUTANG</span>':''}</td><td>${h.type}</td><td>${h.days} hr</td><td><span class="badge ${h.amount>0?'badge-plus':'badge-minus'}">${h.amount>0?'+':''}${h.amount} hr</span></td><td><strong style="color:${id?'#dc2626':'#4f46e5'}">${h.runningBalance}</strong> hr</td><td style="color:#64748b;font-size:11px">${h.note||'-'}</td></tr>`}).join('')}

window.applyLVFilter=()=>{const f=document.getElementById('filterEmp').value;document.querySelectorAll('#lvBody tr').forEach(r=>{if(r.dataset.en)r.style.display=(f===''||r.dataset.en===f)?'':'none'})};
window.resetLVFilter=()=>{document.getElementById('filterEmp').value='';applyLVFilter()};

// ============ LAPORAN ============
async function renderMonthlyReport(){
try{const rp=await monthlyReport();if(!rp)return`<div class="card"><h3>📊 Laporan Bulanan</h3><div class="hint-box warning"> Auto-generate tgl 11. Saat ini tgl ${new Date().getDate()}.</div><div class="empty-state"><div class="icon">📊</div><p>Belum tersedia.</p></div></div>`;
const mn=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],[y,m]=rp.mk.split('-'),ml=`${mn[parseInt(m)-1]} ${y}`;
return`<div class="card"><h3>📊 Laporan - ${ml}</h3><div class="hint-box success">✅ Generated: ${fdt(rp.ga)}</div><div class="stats-grid"><div class="stat-card indigo"><div class="label">Karyawan</div><div class="value">${rp.te}</div></div><div class="stat-card sky"><div class="label">Pengajuan</div><div class="value">${rp.tlr}</div></div><div class="stat-card emerald"><div class="label">Disetujui</div><div class="value">${rp.app}</div></div><div class="stat-card rose"><div class="label">Ditolak</div><div class="value">${rp.rej}</div></div><div class="stat-card amber"><div class="label">Pending</div><div class="value">${rp.pen}</div></div><div class="stat-card indigo"><div class="label">Total Hari</div><div class="value">${rp.tld}</div></div><div class="stat-card sky"><div class="label">Rata-rata</div><div class="value" style="font-size:18px">${rp.alp} hr</div></div><div class="stat-card emerald"><div class="label">Total Saldo</div><div class="value" style="font-size:18px">${rp.tbc} hr</div></div></div></div><div class="chart-grid"><div class="chart-card"><h4>📊 Status</h4><div class="chart-container"><canvas id="chartStatus"></canvas></div></div><div class="chart-card"><h4>🏆 Top 5</h4><div class="chart-container"><canvas id="chartTopUsers"></canvas></div></div><div class="chart-card"><h4>📋 Alasan</h4><div class="chart-container"><canvas id="chartReason"></canvas></div></div><div class="chart-card"><h4>💰 Saldo</h4><div class="chart-container"><canvas id="chartBalance"></canvas></div></div></div>${rp.ewd.length>0?`<div class="card"><h3>⚠️ Hutang (${rp.ewd.length})</h3><div class="table-wrapper"><table><thead><tr><th>Nama</th><th>Hutang</th><th>ID</th></tr></thead><tbody>${rp.ewd.map(e=>`<tr class="debt-row"><td><strong>${e.name}</strong></td><td><span class="badge badge-debt">${e.debt} hr</span></td><td>${e.id}</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="card"><h3>📋 Analisis</h3><div style="line-height:1.8;color:#475569"><p>📌 <strong>Persetujuan:</strong> ${rp.tlr>0?Math.round((rp.app/rp.tlr)*100):0}%</p><p>📌 <strong>Rata-rata cuti:</strong> ${rp.alp} hr/karyawan</p><p>📌 <strong>Rata-rata saldo:</strong> ${rp.ab} hr/karyawan</p><p>📌 <strong>Karyawan hutang:</strong> ${rp.ewd.length} dari ${rp.te} (${rp.te>0?Math.round((rp.ewd.length/rp.te)*100):0}%)</p><p> <strong>Adjust:</strong> ${rp.ta} (${rp.aa} disetujui)</p></div></div>`}catch(e){return`<div class="card"><div class="hint-box danger">❌ ${e.message}</div></div>`}}

async function loadChartJS(){if(chartLoaded)return window.Chart;try{await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});chartLoaded=true;return window.Chart}catch(e){console.error(e);return null}}

async function loadCharts(){const C=await loadChartJS();if(!C)return;const rid=`report_${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`,s=await getDoc(doc(db,'monthlyReports',rid));if(!s.exists())return;const rp=s.data();['chartStatus','chartTopUsers','chartReason','chartBalance'].forEach(id=>{const c=document.getElementById(id);if(c){const ex=C.getChart(c);if(ex)ex.destroy()}});
new C(document.getElementById('chartStatus'),{type:'doughnut',data:{labels:['Disetujui','Ditolak','Menunggu'],datasets:[{data:[rp.app,rp.rej,rp.pen],backgroundColor:['#10b981','#ef4444','#f59e0b'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});
new C(document.getElementById('chartTopUsers'),{type:'bar',data:{labels:(rp.tlu||[]).map(u=>u.name),datasets:[{label:'Hari',data:(rp.tlu||[]).map(u=>u.days),backgroundColor:'#4f46e5',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});
const re=Object.entries(rp.lbr||{}),cl=['#4f46e5','#10b981','#f59e0b','#ef4444','#0ea5e9','#8b5cf6','#ec4899','#14b8a6','#f97316'];
new C(document.getElementById('chartReason'),{type:'pie',data:{labels:re.map(e=>e[0]),datasets:[{data:re.map(e=>e[1]),backgroundColor:cl.slice(0,re.length)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10}}}}}});
new C(document.getElementById('chartBalance'),{type:'doughnut',data:{labels:['Positif','Nol','Hutang'],datasets:[{data:[rp.bd.positive,rp.bd.zero,rp.bd.negative],backgroundColor:['#10b981','#94a3b8','#ef4444'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}

// ============ PASSWORD ============
function renderChangePassword(){const cp=currentUser.photoUrl||'',init=currentUser.name.charAt(0).toUpperCase();return`<div class="card"><h3>🔒 Ganti Password</h3><div class="hint-box">Password tersinkron ke semua device.</div><div class="form-group"><label>Password Lama</label><input type="password" id="oldPass"></div><div class="form-group"><label>Password Baru</label><input type="password" id="newPass"></div><div class="form-group"><label>Konfirmasi</label><input type="password" id="confPass"></div><button class="btn btn-primary" style="width:auto" onclick="changePass()">Update</button></div><div class="card"><h3>📷 Foto Profil</h3><div class="hint-box purple">💡 Klik foto di topbar untuk ganti. Foto tampil di Manajemen Akun.</div><div style="text-align:center;padding:20px"><div class="photo-upload-preview" style="margin:0 auto 16px">${cp?`<img src="${cp}">`:init}</div><p style="color:#64748b;font-size:13px">${cp?'Foto aktif':'Belum ada foto'}</p><div class="photo-upload-actions"><button class="btn btn-primary" style="width:auto" onclick="openPhotoUpload()">📷 Ganti Foto</button>${cp?`<button class="btn btn-danger" style="width:auto" onclick="removePhoto()">️ Hapus</button>`:''}</div></div></div>`}

window.changePass=async()=>{const o=document.getElementById('oldPass').value,n=document.getElementById('newPass').value,c=document.getElementById('confPass').value;if(!o||!n||!c){alert('Lengkapi!');return}if(o!==currentUser.password){alert('Password lama salah!');return}if(n!==c){alert('Tidak cocok!');return}if(n.length<4){alert('Min 4 karakter!');return}try{await updateDoc(doc(db,'users',currentUserDocId),{password:n});currentUser.password=n;sessionStorage.setItem('hrd_user',JSON.stringify(currentUser));alert('✅ Password diubah! Login ulang.');doLogout()}catch(e){alert('❌ '+e.message)}};

// ============ UTILS ============
window.openModal=html=>{document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('active')};
window.closeModal=()=>{document.getElementById('modalOverlay').classList.remove('active')};
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')window.closeModal()});

function rHist(hist){if(!hist||hist.length===0)return`<div class="empty-state" style="padding:20px"><div class="icon"></div><p>Belum ada mutasi</p></div>`;const sorted=[...hist].sort((a,b)=>new Date(a.timestamp||a.date||0).getTime()-new Date(b.timestamp||b.date||0).getTime()),ta=sorted.reduce((s,h)=>s+(h.amount||0),0),cb=hist[hist.length-1]?.runningBalance||0,ib=cb-ta;let rb=ib;sorted.forEach(h=>{rb+=(h.amount||0);h.runningBalance=rb});const rows=sorted.slice().reverse().map(h=>{const dd=h.timestamp?fdt(h.timestamp):fd(h.date);return`<tr><td>${dd}</td><td>${h.type}</td><td>${h.days} hr</td><td><span class="badge ${h.amount>0?'badge-plus':'badge-minus'}">${h.amount>0?'+':''}${h.amount} hr</span></td><td><strong style="color:${h.runningBalance<0?'#dc2626':'#4f46e5'}">${h.runningBalance}</strong> hr</td><td style="color:#64748b;font-size:11px">${h.note||'-'}</td></tr>`}).join('');return`<div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Sisa</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>`}

const _origShowTab=showTab;
showTab=async(id)=>{await _origShowTab(id);if(id==='monthly_report')setTimeout(()=>loadCharts(),100);if(id==='apply_leave')setTimeout(()=>{const c=document.getElementById('lvCalc');if(c&&currentUser.employeeId){getDocs(query(collection(db,'employees'),where('id','==',currentUser.employeeId))).then(s=>{if(!s.empty)c.dataset.bal=s.docs[0].data().leaveBalance})}},100)};

seed().then(()=>{const t=setTimeout(()=>{if(!currentUser)console.warn('Timeout')},15000);checkSession();clearTimeout(t)}).catch(e=>{console.error(e);document.getElementById('mainContent').innerHTML=`<div class="error-box"><div class="icon">⚠️</div><div><strong>Gagal Memuat</strong></div><div style="font-size:13px;margin-top:8px">${e.message}</div><button class="btn btn-primary" style="width:auto;margin-top:12px" onclick="location.reload()">Reload</button></div>`});
</script>
