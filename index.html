<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HRD Portal - Manajemen Karyawan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #334155; }
  .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
  
  .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: rgba(255,255,255,0.98); backdrop-filter: blur(12px); padding: 32px 28px;
    border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.3);
  }
  .login-card h1 { color: #4f46e5; text-align: center; margin-bottom: 8px; font-size: 24px; }
  .login-card p.subtitle { text-align: center; color: #64748b; margin-bottom: 28px; font-size: 13px; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; color: #475569; font-weight: 500; font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; transition: all 0.2s; background: #f8fafc;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: #4f46e5; background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
  }
  .form-group select { cursor: pointer; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  
  .btn {
    padding: 11px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: #4f46e5; color: white; width: 100%; }
  .btn-primary:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
  .btn-success { background: #10b981; color: white; }
  .btn-success:hover { background: #059669; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-warning { background: #f59e0b; color: white; }
  .btn-warning:hover { background: #d97706; }
  .btn-secondary { background: #e2e8f0; color: #475569; }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-info { background: #0ea5e9; color: white; }
  .btn-info:hover { background: #0284c7; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .app-wrapper { display: none; }
  .app-wrapper.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .topbar {
    background: rgba(255,255,255,0.98); backdrop-filter: blur(12px); padding: 14px 18px;
    border-radius: 14px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.6);
  }
  .topbar h2 { color: #4f46e5; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .user-detail { text-align: right; }
  .user-detail .name { font-weight: 600; font-size: 13px; color: #1e293b; }
  .user-detail .role { font-size: 11px; color: #64748b; }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; overflow-x: auto; padding-bottom: 4px; }
  .nav-tab {
    padding: 9px 14px; background: rgba(255,255,255,0.9); border: 1px solid #e2e8f0;
    border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s;
    font-family: inherit; color: #64748b; font-size: 12px; white-space: nowrap;
  }
  .nav-tab:hover { background: white; color: #4f46e5; }
  .nav-tab.active { background: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79,70,229,0.25); }

  .card {
    background: rgba(255,255,255,0.98); border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.6);
  }
  .card h3 { color: #334155; margin-bottom: 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; }
  .stat-card .label { font-size: 11px; color: #64748b; font-weight: 500; }
  .stat-card .value { font-size: 24px; font-weight: 700; color: #1e293b; margin-top: 4px; }
  .stat-card.indigo { border-left: 4px solid #4f46e5; }
  .stat-card.emerald { border-left: 4px solid #10b981; }
  .stat-card.amber { border-left: 4px solid #f59e0b; }
  .stat-card.rose { border-left: 4px solid #f43f5e; }
  .stat-card.debt { border-left: 4px solid #dc2626; background: #fef2f2; }
  .stat-card.sky { border-left: 4px solid #0ea5e9; }
  .stat-card.purple { border-left: 4px solid #8b5cf6; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  th { background: #f8fafc; color: #64748b; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  tr:hover { background: #f8fafc; }
  tr.debt-row { background: #fef2f2; }
  tr.debt-row:hover { background: #fee2e2; }

  .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-approved { background: #d1fae5; color: #065f46; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-minus { background: #fee2e2; color: #991b1b; }
  .badge-plus { background: #d1fae5; color: #065f46; }
  .badge-debt { background: #dc2626; color: white; font-weight: 700; }
  .badge-self { background: #f3e8ff; color: #6b21a8; }

  .notification {
    background: #fffbeb; border-left: 4px solid #f59e0b; padding: 14px; border-radius: 10px;
    margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(245,158,11,0.1);
  }
  .notification .notif-text { font-size: 12px; color: #78350f; line-height: 1.5; }
  .notification .notif-text strong { color: #451a03; }
  .notification.self-leave { background: #f5f3ff; border-left-color: #8b5cf6; }
  .notification.self-leave .notif-text { color: #5b21b6; }
  .notification.self-leave .notif-text strong { color: #4c1d95; }
  
  .balance-info { 
    background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 8px; 
    font-size: 12px; margin-top: 6px; border: 1px solid #e2e8f0;
  }
  .balance-safe { color: #059669; font-weight: 600; }
  .balance-debt { color: #dc2626; font-weight: 700; }

  .debt-warning {
    background: #fef2f2; border: 2px solid #dc2626; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .debt-warning .icon { font-size: 32px; }
  .debt-warning .text { flex: 1; }
  .debt-warning .text strong { color: #dc2626; font-size: 16px; }
  .debt-warning .text p { color: #991b1b; font-size: 13px; margin-top: 4px; }

  .lock-warning {
    background: #fff7ed; border: 2px solid #f97316; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .lock-warning .icon { font-size: 32px; }
  .lock-warning .text strong { color: #c2410c; font-size: 15px; }
  .lock-warning .text p { color: #9a3412; font-size: 13px; margin-top: 4px; }

  .flow-info {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    border: 2px solid #0ea5e9; border-radius: 12px; padding: 14px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .flow-info .icon { font-size: 28px; }
  .flow-info .text strong { color: #0369a1; font-size: 14px; }
  .flow-info .text p { color: #075985; font-size: 12px; margin-top: 4px; }

  .leave-calculator {
    background: #f0fdf4; border: 2px solid #10b981; border-radius: 12px; padding: 14px;
    margin-top: 12px; display: none;
  }
  .leave-calculator.debt { background: #fef2f2; border-color: #dc2626; }
  .leave-calculator .calc-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #e2e8f0;
  }
  .leave-calculator .calc-row:last-child { border-bottom: none; font-weight: 700; font-size: 14px; }
  .leave-calculator .calc-label { color: #475569; }
  .leave-calculator .calc-value { color: #1e293b; font-weight: 600; }
  .leave-calculator.debt .calc-value { color: #dc2626; }
  .leave-calculator .debt-alert {
    background: #dc2626; color: white; padding: 10px 12px; border-radius: 8px;
    margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center;
  }

  .reviewer-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600; margin-top: 4px;
  }
  .reviewer-badge.rejected { background: #fee2e2; color: #991b1b; }
  .reviewer-badge.director { background: #f3e8ff; color: #6b21a8; }

  .filter-bar {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
    background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0;
  }
  .filter-bar label { font-size: 13px; font-weight: 500; color: #475569; }
  .filter-bar select { flex: 1; min-width: 180px; }

  .chart-container { position: relative; height: 280px; margin: 16px 0; }
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .chart-card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #f1f5f9; }
  .chart-card h4 { font-size: 13px; color: #475569; margin-bottom: 12px; font-weight: 600; }

  .empty-state { text-align: center; padding: 30px 15px; color: #94a3b8; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15,23,42,0.7); backdrop-filter: blur(4px);
    z-index: 1000; align-items: center; justify-content: center; padding: 15px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  }
  .modal h3 { color: #4f46e5; margin-bottom: 18px; font-size: 17px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }

  .hint-box {
    background: #eff6ff; border-left: 4px solid #3b82f6;
    padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #1e40af; margin-bottom: 14px;
  }
  .hint-box.warning { background: #fef3c7; border-left-color: #f59e0b; color: #92400e; }
  .hint-box.danger { background: #fee2e2; border-left-color: #ef4444; color: #991b1b; }
  .hint-box.success { background: #d1fae5; border-left-color: #10b981; color: #065f46; }
  .hint-box.orange { background: #fff7ed; border-left-color: #f97316; color: #9a3412; }
  .hint-box.purple { background: #f5f3ff; border-left-color: #8b5cf6; color: #6b21a8; }
  .table-wrapper { overflow-x: auto; }
  .loading { text-align: center; padding: 30px; color: #64748b; }
  
  .required-field { border-color: #f59e0b !important; background: #fffbeb !important; }
  .required-field:focus { border-color: #dc2626 !important; box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
  .required-label { color: #dc2626 !important; font-weight: 600 !important; }
  .required-label::after { content: ' *'; color: #dc2626; }
  
  @media (max-width: 640px) {
    .container { padding: 10px; }
    .login-card { padding: 24px 20px; }
    .topbar { flex-direction: column; gap: 12px; text-align: center; padding: 12px 14px; }
    .user-detail { text-align: center; }
    .user-info { flex-direction: row-reverse; }
    .stats-grid { grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .nav-tabs { gap: 4px; }
    .nav-tab { padding: 8px 12px; font-size: 11px; }
    table { font-size: 12px; }
    th, td { padding: 8px 6px; }
    .notification { flex-direction: column; align-items: stretch; }
    .modal { padding: 20px; }
    .chart-grid { grid-template-columns: 1fr; }
    .filter-bar { flex-direction: column; align-items: stretch; }
    .filter-bar select { width: 100%; }
  }
</style>
</head>
<body>

<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <h1>🌿 HRD Portal</h1>
    <p class="subtitle">Sistem Manajemen Karyawan & Cuti</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
    <div class="hint-box" style="margin-top: 16px; text-align: center;">
      💡 Huruf besar atau kecil tidak masalah (Case-insensitive)
    </div>
  </div>
</div>

<div class="app-wrapper" id="appScreen">
  <div class="container">
    <div class="topbar">
      <h2>🌿 HRD Portal</h2>
      <div class="user-info">
        <div class="user-detail">
          <div class="name" id="userName">-</div>
          <div class="role" id="userRole">-</div>
        </div>
        <div class="user-avatar" id="userAvatar">-</div>
        <button class="btn btn-secondary btn-sm" onclick="doLogout()">Keluar</button>
      </div>
    </div>

    <div class="nav-tabs" id="navTabs"></div>
    <div id="mainContent"><div class="loading">Memuat data...</div></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { 
    getFirestore, collection, getDocs, getDoc, addDoc, setDoc, updateDoc, deleteDoc, doc, 
    query, where, writeBatch 
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhGxzuzU-pQo6p8xJwdmC6bQIZV-po-A4",
    authDomain: "hrd-portal-9a5fd.firebaseapp.com",
    projectId: "hrd-portal-9a5fd",
    storageBucket: "hrd-portal-9a5fd.firebasestorage.app",
    messagingSenderId: "938883233737",
    appId: "1:938883233737:web:9368aac16b5b6a12685a18"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.db = db;

  let currentUser = null;
  let currentUserDocId = null;

  const ROLE_LABEL = {
    superuser: 'Superuser',
    direktur: 'Direktur',
    komisaris: 'Komisaris',
    kepala_hrd: 'Kepala HRD',
    staff_hrd: 'Staff HRD',
    staff: 'Staff Biasa'
  };

  const LEAVE_REASONS = [
    { value: '', label: '-- Pilih Alasan Cuti --' },
    { value: 'Cuti Tahunan', label: '🏖️ Cuti Tahunan' },
    { value: 'Cuti Sakit', label: '🤒 Cuti Sakit' },
    { value: 'Cuti Besar', label: '🏝️ Cuti Besar (setelah 6 tahun kerja)' },
    { value: 'Cuti Melahirkan', label: '🤰 Cuti Melahirkan' },
    { value: 'Cuti Keguguran', label: '😢 Cuti Keguguran' },
    { value: 'Cuti Ayah (Paternity Leave)', label: '👨‍🍼 Cuti Ayah (Paternity Leave)' },
    { value: 'Cuti Pernikahan', label: ' Cuti Pernikahan' },
    { value: 'Cuti Kematian Keluarga', label: '️ Cuti Kematian Keluarga' },
    { value: 'Cuti Ibadah Haji/Umroh', label: '🕋 Cuti Ibadah Haji/Umroh' },
    { value: 'Cuti Menjalankan Ibadah Agama', label: ' Cuti Menjalankan Ibadah Agama' },
    { value: 'Cuti Kecelakaan Kerja', label: '🚑 Cuti Kecelakaan Kerja' },
    { value: 'Cuti Sakit Anak/Istri/Suami', label: '👨👩‍👧 Cuti Sakit Anak/Istri/Suami' },
    { value: 'Cuti Mengurus Dokumen Negara', label: '📄 Cuti Mengurus Dokumen Negara (KTP/SIM/Paspor)' },
    { value: 'Cuti Pindah Rumah', label: ' Cuti Pindah Rumah' },
    { value: 'Cuti Menempuh Ujian', label: '📚 Cuti Menempuh Ujian' },
    { value: 'Cuti Kegiatan Serikat Pekerja', label: '✊ Cuti Kegiatan Serikat Pekerja' },
    { value: 'Cuti Bencana Alam', label: '🌊 Cuti Bencana Alam' },
    { value: 'Cuti Tugas Negara', label: '🏛️ Cuti Tugas Negara' },
    { value: 'Cuti Wajib (Aturan Perusahaan)', label: '📋 Cuti Wajib (Aturan Perusahaan)' },
    { value: 'Cuti Penting (Alasan Mendesak)', label: ' Cuti Penting (Alasan Mendesak)' },
    { value: 'Lainnya', label: '📝 Lainnya (wajib isi keterangan)' }
  ];

  const fmtDate = (d) => {
    if (!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  const fmtDateTime = (d) => {
    if (!d) return '-';
    const dt = new Date(d);
    return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + 
           dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  };

  const daysBetween = (a, b) => {
    const d1 = new Date(a), d2 = new Date(b);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
  };

  const getEligibleLeave = (joinDateStr) => {
    const join = new Date(joinDateStr);
    const now = new Date();
    const diffYears = (now - join) / (1000 * 60 * 60 * 24 * 365.25);
    return diffYears >= 1;
  };

  function getLeaveLockStatus() {
    const now = new Date();
    const currentDay = now.getDate();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();
    
    if (currentDay <= 10) return { locked: false, message: '' };
    
    const lastMonth = currentMonth === 0 ? 11 : currentMonth - 1;
    const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
    const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    
    return {
      locked: true,
      lockedMonth: lastMonth,
      lockedYear: lastMonthYear,
      message: ` Pengajuan cuti bulan ${monthNames[lastMonth]} ${lastMonthYear} sudah dikunci (lock otomatis tanggal 10 ${monthNames[currentMonth]} ${currentYear}).`
    };
  }

  function isDateLocked(dateStr) {
    const lock = getLeaveLockStatus();
    if (!lock.locked) return false;
    const d = new Date(dateStr);
    return d.getMonth() === lock.lockedMonth && d.getFullYear() === lock.lockedYear;
  }

  // ✅ STATUS LABEL UNTUK DISPLAY
  function getStatusLabel(status) {
    const labels = {
      'pending_staff': 'Menunggu Staff HRD',
      'pending_staff_hrd_peer': 'Menunggu Review Staff HRD',
      'pending_head': 'Menunggu Kepala HRD',
      'pending_director': 'Menunggu Direktur',
      'approved': 'Disetujui',
      'rejected': 'Ditolak'
    };
    return labels[status] || status;
  }

  async function ensureMonthlyReport() {
    const now = new Date();
    if (now.getDate() < 11) return null;
    
    const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const reportId = `report_${monthKey}`;
    
    const existingRef = doc(db, 'monthlyReports', reportId);
    const existingSnap = await getDoc(existingRef);
    if (existingSnap.exists()) return existingSnap.data();
    
    const [empSnap, leaveSnap, adjustSnap] = await Promise.all([
      getDocs(collection(db, 'employees')),
      getDocs(collection(db, 'leaveRequests')),
      getDocs(collection(db, 'adjustmentRequests'))
    ]);
    
    const employees = empSnap.docs.map(d => d.data());
    const allLeaves = leaveSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const allAdjusts = adjustSnap.docs.map(d => d.data());
    
    const monthLeaves = allLeaves.filter(l => {
      const d = new Date(l.createdAt || l.headApprovedAt || l.rejectedAt || 0);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
    
    const monthAdjusts = allAdjusts.filter(a => {
      const d = new Date(a.requestedAt || a.approvedAt || a.rejectedAt || 0);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
    
    const approved = monthLeaves.filter(l => l.status === 'approved');
    const rejected = monthLeaves.filter(l => l.status === 'rejected');
    const pending = monthLeaves.filter(l => l.status.startsWith('pending'));
    
    const totalLeaveDays = approved.reduce((sum, l) => sum + daysBetween(l.startDate, l.endDate), 0);
    const avgLeave = employees.length > 0 ? (totalLeaveDays / employees.length).toFixed(1) : 0;
    
    const employeesWithDebt = employees.filter(e => e.leaveBalance < 0)
      .map(e => ({ name: e.name, debt: Math.abs(e.leaveBalance), id: e.id }));
    
    const leaveByEmployee = {};
    approved.forEach(l => {
      const days = daysBetween(l.startDate, l.endDate);
      leaveByEmployee[l.employeeName] = (leaveByEmployee[l.employeeName] || 0) + days;
    });
    const topUsers = Object.entries(leaveByEmployee)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5)
      .map(([name, days]) => ({ name, days }));
    
    const reasonCount = {};
    approved.forEach(l => {
      const reason = (l.reason || 'Lainnya').toUpperCase().trim();
      reasonCount[reason] = (reasonCount[reason] || 0) + 1;
    });
    
    const balanceDist = {
      positive: employees.filter(e => e.leaveBalance > 0).length,
      zero: employees.filter(e => e.leaveBalance === 0).length,
      negative: employees.filter(e => e.leaveBalance < 0).length
    };
    
    const totalBalance = employees.reduce((sum, e) => sum + e.leaveBalance, 0);
    const avgBalance = employees.length > 0 ? (totalBalance / employees.length).toFixed(1) : 0;
    
    const report = {
      monthKey, generatedAt: now.toISOString(),
      totalEmployees: employees.length,
      totalLeaveRequests: monthLeaves.length,
      approved: approved.length, rejected: rejected.length, pending: pending.length,
      totalLeaveDaysUsed: totalLeaveDays,
      averageLeavePerEmployee: avgLeave,
      employeesWithDebt, topLeaveUsers: topUsers,
      leaveByReason: reasonCount,
      balanceDistribution: balanceDist,
      totalBalanceCompany: totalBalance, averageBalance: avgBalance,
      totalAdjustments: monthAdjusts.length,
      approvedAdjustments: monthAdjusts.filter(a => a.status === 'approved').length
    };
    
    await setDoc(existingRef, report);
    return report;
  }

          const emp = empMap[req.employeeId];

          const isDebt = projectedBalance < 0;

            ? `⚠️ Proyeksi: <strong class="${balanceClass}">Hutang ${Math.abs(projectedBalance)} hari</strong>`

                <div class="notif-text">
                  <strong>${req.employeeName}</strong> <span class="badge ${isPeerLeave ? 'badge-self' : 'badge-pending'}">${requesterRole}</span> mengajukan cuti <strong>${days} hari</strong><br>

            </div>
          `;
        });
      }
      
      return `
        ${currentUser.employeeId ? `<div class="card"><h3> Notifikasi Pengajuan Saya</h3>${myNotifHTML}</div>` : ''}
        <div class="stats-grid"><div class="stat-card amber"><div class="label">Menunggu Review Anda</div><div class="value">${allPending.length}</div></div></div>
        <div class="card">
          <h3>📬 Pengajuan Cuti Perlu Review</h3>
          <div class="hint-box orange">👥 Multi-Staff HRD: Yang pertama klik Terima/Tolak akan tercatat sebagai reviewer. Anda tidak bisa mereview pengajuan sendiri.</div>
          ${pendingHTML}
        </div>
      `;
    } catch (e) { return `<div class="card"><div class="hint-box danger">❌ Error: ${e.message}</div></div>`; }

  window.openAddStaff = () => {
    window.openModal(`
      <h3>Tambah Staff Baru</h3>

      <div class="form-group"><label>Username (huruf kecil)</label><input type="text" id="newStaffUsername"></div>

      </div>
    `);

  window.saveNewStaff = async () => {
    const name = document.getElementById('newStaffName').value.trim();
    const username = document.getElementById('newStaffUsername').value.trim().toLowerCase();
    const join = document.getElementById('newStaffJoin').value;
    if (!name || !username || !join) { alert('Lengkapi semua field!'); return; }
    if (!(await getDocs(query(collection(db, 'users'), where('username', '==', username)))).empty) { alert('⚠️ Username sudah digunakan!'); return; }
    
    const emps = (await getDocs(collection(db, 'employees'))).docs.map(d => d.data());
    let num = 1;
    if (emps.length > 0) {
      const validEmps = emps.filter(e => /^E\d{3,}$/.test(e.id));
      if (validEmps.length > 0) {
        validEmps.sort((a, b) => b.id.localeCompare(a.id));
        num = parseInt(validEmps[0].id.substring(1)) + 1;
      } else num = emps.length + 1;
    }
    const newEmpId = 'E' + String(num).padStart(3, '0');
    
    const batch = writeBatch(db);
    batch.set(doc(collection(db, 'users')), { username, password: '1234', name, role: 'staff', employeeId: newEmpId });
    batch.set(doc(collection(db, 'employees')), { id: newEmpId, name, joinDate: join, leaveBalance: 0, leaveHistory: [] });
    await batch.commit();
    
    window.closeModal();
    alert('✅ Staff berhasil ditambahkan!\nUsername: ' + username + '\nPassword: 1234');
    showTab('employees');
  };

      const label = getStatusLabel(r.status);
      return `<tr><td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td><td>${days} hari</td><td>${r.reason}</td><td><span class="badge ${badge}">${label}</span></td></tr>`;
    }).join('');

    const reasonOptions = LEAVE_REASONS.map(r => `<option value="${r.value}">${r.label}</option>`).join('');

    // ✅ Info alur approval berdasarkan role
    let flowInfoHTML = '';
    if (currentUser.role === 'staff_hrd') {
      flowInfoHTML = `
        <div class="flow-info">
          <div class="icon">📋</div>
          <div class="text">
            <strong>Alur Approval Staff HRD</strong>
            <p>Pengajuan Anda → Review oleh Staff HRD lain → Approval Kepala HRD</p>
          </div>
        </div>
      `;
    } else if (currentUser.role === 'kepala_hrd') {
      flowInfoHTML = `
        <div class="flow-info" style="background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); border-color: #8b5cf6;">
          <div class="icon">📋</div>
          <div class="text">
            <strong>Alur Approval Kepala HRD</strong>
            <p>Pengajuan Anda → Langsung approval oleh Direktur (1 langkah)</p>
          </div>
        </div>
      `;
    }

    return `
      ${isDebt ? `<div class="debt-warning"><div class="icon">⚠️</div><div class="text"><strong>HUTANG CUTI: ${Math.abs(emp.leaveBalance)} hari</strong><p>Anda telah menggunakan cuti melebihi saldo. Cuti tambahan akan menambah hutang.</p></div></div>` : ''}
      ${lockStatus.locked ? `<div class="lock-warning"><div class="icon">🔒</div><div class="text"><strong>${lockStatus.message}</strong><p>Pengajuan cuti untuk bulan yang sudah lewat tidak dapat dilakukan setelah tanggal 10.</p></div></div>` : ''}
      ${flowInfoHTML}
      <div class="card">
        <h3>📝 Form Pengajuan Cuti</h3>
        <div class="hint-box ${isDebt ? 'danger' : ''}">💡 Sisa cuti Anda saat ini: <strong style="color: ${isDebt ? '#dc2626' : '#4f46e5'}">${emp.leaveBalance} hari</strong> ${isDebt ? '(HUTANG)' : ''}</div>
        
        <div class="form-group">
          <label>📅 Tanggal Mulai</label>
          <input type="date" id="leaveStart" onchange="calculateLeaveProjection()">
        </div>
        <div class="form-group">
          <label>📅 Tanggal Selesai</label>
          <input type="date" id="leaveEnd" onchange="calculateLeaveProjection()">
        </div>
        
        <div class="form-group">
          <label>📋 Alasan Cuti</label>
          <select id="leaveReasonType" onchange="onLeaveReasonChange()">
            ${reasonOptions}
          </select>
        </div>
        
        <div class="form-group" id="otherReasonGroup" style="display: none;">
          <label id="otherReasonLabel" class="required-label">📝 Keterangan Alasan (Wajib diisi)</label>
          <textarea id="otherReasonText" rows="3" placeholder="Jelaskan alasan cuti Anda secara detail..." oninput="onOtherReasonInput()"></textarea>
          <small style="color: #dc2626; font-size: 11px; display: none;" id="otherReasonHint">⚠️ Kolom ini wajib diisi jika memilih "Lainnya"</small>
        </div>
        
        <div id="leaveCalculator" class="leave-calculator" data-balance="${emp.leaveBalance}"></div>
        
        <button class="btn btn-primary" style="width:auto; margin-top: 12px;" onclick="submitLeave('${emp.id}', '${emp.name}', ${emp.leaveBalance})">Kirim Pengajuan</button>
      </div>
      <div class="card">
        <h3>📜 Riwayat Pengajuan Saya</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Periode</th><th>Durasi</th><th>Alasan</th><th>Status</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px">Belum ada pengajuan</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.onLeaveReasonChange = function() {
    const reasonType = document.getElementById('leaveReasonType').value;
    const otherGroup = document.getElementById('otherReasonGroup');
    const otherText = document.getElementById('otherReasonText');
    const otherHint = document.getElementById('otherReasonHint');
    
    if (reasonType === 'Lainnya') {
      otherGroup.style.display = 'block';
      otherText.focus();
      otherText.setAttribute('required', 'true');
    } else {
      otherGroup.style.display = 'none';
      otherText.value = '';
      otherText.classList.remove('required-field');
      otherHint.style.display = 'none';
      otherText.removeAttribute('required');
    }
  };

  window.onOtherReasonInput = function() {
    const otherText = document.getElementById('otherReasonText');
    const otherHint = document.getElementById('otherReasonHint');
    
    if (otherText.value.trim().length === 0) {
      otherText.classList.add('required-field');
      otherHint.style.display = 'block';
    } else {
      otherText.classList.remove('required-field');
      otherHint.style.display = 'none';
    }
  };

  window.calculateLeaveProjection = function() {
    const start = document.getElementById('leaveStart').value;
    const end = document.getElementById('leaveEnd').value;
    const calcDiv = document.getElementById('leaveCalculator');
    
    if (!start || !end) { calcDiv.style.display = 'none'; return; }
    if (new Date(end) < new Date(start)) { calcDiv.style.display = 'none'; return; }
    
    const days = daysBetween(start, end);
    const currentBalance = parseInt(calcDiv.dataset.balance || 0);
    const projectedBalance = currentBalance - days;
    const isDebt = projectedBalance < 0;
    
    calcDiv.className = 'leave-calculator' + (isDebt ? ' debt' : '');
    calcDiv.style.display = 'block';
    
    calcDiv.innerHTML = `
      <div class="calc-row"><span class="calc-label">📅 Periode Cuti</span><span class="calc-value">${fmtDate(start)} - ${fmtDate(end)}</span></div>
      <div class="calc-row"><span class="calc-label">️ Jumlah Hari</span><span class="calc-value">${days} hari</span></div>
      <div class="calc-row"><span class="calc-label">💰 Sisa Cuti Saat Ini</span><span class="calc-value">${currentBalance} hari</span></div>
      <div class="calc-row"><span class="calc-label">📊 Proyeksi Setelah Cuti</span><span class="calc-value">${projectedBalance} hari</span></div>
      ${isDebt ? `<div class="debt-alert">⚠️ PERINGATAN: Anda akan memakai jatah cuti tahun depan (HUTANG CUTI ${Math.abs(projectedBalance)} hari)</div>` : `<div style="background: #10b981; color: white; padding: 10px 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center;">✅ Saldo cuti Anda mencukupi</div>`}
    `;
  };

  // ✅ PERBAIKAN: submitLeave set status berdasarkan role
  window.submitLeave = async (empId, empName, currentBalance) => {
    const s = document.getElementById('leaveStart').value;
    const e = document.getElementById('leaveEnd').value;
    const reasonType = document.getElementById('leaveReasonType').value;
    const otherReasonText = document.getElementById('otherReasonText').value.trim();
    
    if (!s || !e) { alert('⚠️ Pilih tanggal mulai dan selesai!'); return; }
    if (new Date(e) < new Date(s)) { alert('⚠️ Tanggal selesai harus setelah tanggal mulai!'); return; }
    if (!reasonType) { alert('⚠️ Pilih alasan cuti!'); return; }
    
    let finalReason = reasonType;
    if (reasonType === 'Lainnya') {
      if (!otherReasonText || otherReasonText.length < 5) {
        alert('⚠️ Karena Anda memilih "Lainnya", mohon isi keterangan alasan cuti dengan detail (minimal 5 karakter)!');
        document.getElementById('otherReasonText').classList.add('required-field');
        document.getElementById('otherReasonHint').style.display = 'block';
        document.getElementById('otherReasonText').focus();
        return;
      }
      finalReason = `Lainnya: ${otherReasonText}`;
    }
    
    if (isDateLocked(s) || isDateLocked(e)) {
      const lock = getLeaveLockStatus();
      alert(`🔒 ${lock.message}\n\nSilakan ajukan cuti untuk bulan ini atau bulan depan.`);
      return;
    }
    
    const days = daysBetween(s, e);
    const projectedBalance = currentBalance - days;
    
    if (projectedBalance < 0) {
      const confirmMsg = `⚠️ PERINGATAN HUTANG CUTI!\n\nSisa cuti Anda: ${currentBalance} hari\nPengajuan: ${days} hari\nProyeksi: ${projectedBalance} hari (HUTANG ${Math.abs(projectedBalance)} hari)\n\nAnda akan memakai jatah cuti tahun depan.\n\nLanjutkan pengajuan?`;
      if (!confirm(confirmMsg)) return;
    }
    
    // ✅ SET STATUS BERDASARKAN ROLE
    let initialStatus = 'pending_staff';
    if (currentUser.role === 'staff_hrd') {
      initialStatus = 'pending_staff_hrd_peer';
    } else if (currentUser.role === 'kepala_hrd') {
      initialStatus = 'pending_director';
    }
    
    await addDoc(collection(db, 'leaveRequests'), {
      employeeId: empId, 
      employeeName: empName,
      employeeRole: currentUser.role, // Simpan role untuk referensi
      startDate: s, 
      endDate: e, 
      reason: finalReason,
      reasonType: reasonType,
      reasonDetail: reasonType === 'Lainnya' ? otherReasonText : '',
      status: initialStatus,
      createdAt: new Date().toISOString()
    });
    
    alert('✅ Pengajuan cuti berhasil dikirim!');
    showTab('apply_leave');
  };

  const _origShowTab = showTab;
  showTab = async (id) => {
    await _origShowTab(id);
    if (id === 'apply_leave') {
      setTimeout(() => {
        const calcDiv = document.getElementById('leaveCalculator');
        if (calcDiv && currentUser.employeeId) {
          getDocs(query(collection(db, 'employees'), where('id', '==', currentUser.employeeId)))
            .then(snap => { if (!snap.empty) calcDiv.dataset.balance = snap.docs[0].data().leaveBalance; });
        }
      }, 100);
    }
  };

  async function renderLeaveMgmt() {
    const emps = (await getDocs(collection(db, 'employees')))
      .docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const rows = emps.map(e => {
      const isDebt = e.leaveBalance < 0;
      return `
        <tr class="${isDebt ? 'debt-row' : ''}">
          <td>${e.id}</td><td><strong>${e.name}</strong></td>
          <td><strong style="color: ${isDebt ? '#dc2626' : '#1e293b'}">${e.leaveBalance}</strong> hari ${isDebt ? '<span class="badge badge-debt">HUTANG</span>' : ''}</td>
          <td><button class="btn btn-warning btn-sm" onclick="openRequestAdjust('${e.id}', '${e.name}', ${e.leaveBalance})">Request Adjust</button></td>
        </tr>
      `;
    }).join('');
    
    return `
      <div class="card">
        <h3>Request Adjust Cuti Karyawan</h3>
        <div class="hint-box">💡 Pengajuan adjust cuti harus disetujui oleh Kepala HRD.</div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>ID</th><th>Nama</th><th>Sisa Cuti</th><th>Aksi</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  window.openRequestAdjust = (empId, name, currentBalance) => {
    window.openModal(`
      <h3>Request Adjust Cuti - ${name}</h3>
      <p>Sisa cuti saat ini: <strong>${currentBalance} hari</strong></p>
      <div class="form-group"><label>Jumlah Hari (gunakan minus untuk pengurangan)</label><input type="number" id="adjDays"></div>
      <div class="form-group"><label>Catatan / Alasan</label><textarea id="adjNote" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.closeModal()">Batal</button>
        <button class="btn btn-primary" style="width:auto" onclick="submitRequestAdjust('${empId}', '${name}', ${currentBalance})">Kirim Request</button>
      </div>
    `);
  };

  window.submitRequestAdjust = async (empId, empName, currentBalance) => {
    const days = parseInt(document.getElementById('adjDays').value);
    const note = document.getElementById('adjNote').value.trim() || 'Adjustment manual';
    if (isNaN(days)) { alert('Masukkan jumlah hari yang valid'); return; }
    
    await addDoc(collection(db, 'adjustmentRequests'), {
      employeeId: empId, employeeName: empName,
      currentBalance: currentBalance, adjustmentDays: days, note: note,
      status: 'pending_head', requestedBy: currentUser.name,
      requesterEmployeeId: currentUser.employeeId, requestedAt: new Date().toISOString()
    });
    window.closeModal();
    alert('✅ Request adjust cuti berhasil dikirim ke Kepala HRD.');
    showTab('leave_mgmt');
  };

  // ✅ PERBAIKAN: renderLeaveRequests tampilkan semua pending (termasuk dari Staff HRD lain)
  async function renderLeaveRequests() {
    try {
      const empMap = {};
      (await getDocs(collection(db, 'employees'))).docs.forEach(d => { empMap[d.data().id] = d.data(); });

      const all = (await getDocs(collection(db, 'leaveRequests'))).docs.map(d => ({ id: d.id, ...d.data() }));
      
      // ✅ Tampilkan pending_staff DAN pending_staff_hrd_peer (kecuali dari diri sendiri)
      const pending = all.filter(r => 
        (r.status === 'pending_staff' || r.status === 'pending_staff_hrd_peer') &&
        r.employeeId !== currentUser.employeeId
      ).sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      
      const processed = all.filter(r => r.status !== 'pending_staff' && r.status !== 'pending_staff_hrd_peer')
        .sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime());
      
      const renderRows = (list, showAction) => list.map(r => {
        const days = daysBetween(r.startDate, r.endDate);
        const badge = r.status === 'approved' ? 'badge-approved' : r.status === 'rejected' ? 'badge-rejected' : 'badge-pending';
        const emp = empMap[r.employeeId];
        const currentBalance = emp ? emp.leaveBalance : 0;
        const projectedBalance = currentBalance - days;
        const isDebt = projectedBalance < 0;
        const balanceClass = isDebt ? 'balance-debt' : 'balance-safe';
        const balanceText = isDebt ? `Hutang ${Math.abs(projectedBalance)} hr` : `Sisa ${projectedBalance} hr`;

        let reviewerInfo = '';
        if (r.status === 'pending_head' && r.staffHrdName) {
          reviewerInfo = `<br><span class="reviewer-badge">✅ ${r.staffHrdName} ${r.staffHrdApprovedAt ? `• ${fmtDate(r.staffHrdApprovedAt)}` : ''}</span>`;
        } else if (r.status === 'rejected' && r.rejectedBy) {
          reviewerInfo = `<br><span class="reviewer-badge rejected">❌ ${r.rejectedBy} ${r.rejectedAt ? `• ${fmtDate(r.rejectedAt)}` : ''}</span>`;
        } else if (r.status === 'approved' && r.approvedBy) {
          reviewerInfo = `<br><span class="reviewer-badge">✅ ${r.approvedBy} (Kepala HRD)</span>`;
        } else if (r.status === 'approved' && r.directorApprovedBy) {
          reviewerInfo = `<br><span class="reviewer-badge director">✅ ${r.directorApprovedBy} (Direktur)</span>`;
        }

        const isPeerLeave = r.employeeRole === 'staff_hrd';
        const requesterBadge = isPeerLeave ? '<span class="badge badge-self">Staff HRD</span>' : '';

        return `
          <tr>
            <td><strong>${r.employeeName}</strong> ${requesterBadge}</td>
            <td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td>
            <td>
              <strong>${days} hari</strong><br>
              <span style="font-size:11px; color:#64748b">Saldo: ${currentBalance} hr</span><br>
              <span class="${balanceClass}" style="font-size:11px; font-weight:600">→ ${balanceText}</span>
            </td>
            <td>${r.reason}${reviewerInfo}</td>
            <td><span class="badge ${badge}">${getStatusLabel(r.status)}</span></td>
            ${showAction ? `<td>
              <button class="btn btn-success btn-sm" onclick="staffApprove('${r.id}')">Terima</button>
              <button class="btn btn-danger btn-sm" onclick="staffReject('${r.id}')">Tolak</button>
            </td>` : ''}
          </tr>
        `;
      }).join('');

      return `
        <div class="card">
          <h3>Pengajuan Menunggu Review (${pending.length})</h3>
          <div class="hint-box orange"> Multi-Staff HRD: Yang pertama klik Terima/Tolak akan tercatat sebagai reviewer. Anda tidak bisa mereview pengajuan sendiri.</div>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi & Proyeksi Saldo</th><th>Alasan</th><th>Status</th>${pending.length?'<th>Aksi</th>':''}</tr></thead>
              <tbody>${renderRows(pending, pending.length>0) || '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">Tidak ada pengajuan</td></tr>'}</tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <h3>Riwayat Pengajuan</h3>
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Karyawan</th><th>Periode</th><th>Durasi</th><th>Alasan & Reviewer</th><th>Status</th></tr></thead>
              <tbody>${renderRows(processed, false) || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada riwayat</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;
    } catch (e) { return `<div class="card"><div class="hint-box danger">❌ Error: ${e.message}</div></div>`; }
  }

  // ✅ PERBAIKAN: staffApprove cek self-review
  window.staffApprove = async (reqId) => {
    try {
      const reqRef = doc(db, 'leaveRequests', reqId);
      const reqSnap = await getDoc(reqRef);
      if (!reqSnap.exists()) { alert('❌ Data tidak ditemukan!'); return; }
      const reqData = reqSnap.data();
      
      // ✅ CEK: Jangan bisa approve pengajuan sendiri
      if (reqData.employeeId === currentUser.employeeId) {
        alert('⚠️ Anda tidak bisa mereview pengajuan cuti sendiri!\n\nPengajuan ini akan otomatis diteruskan ke Staff HRD lain.');
        showTab('leave_requests');
        return;
      }
      
      if (reqData.status !== 'pending_staff' && reqData.status !== 'pending_staff_hrd_peer') {
        alert(`⚠️ Pengajuan ini sudah diproses!\n\nStatus: ${getStatusLabel(reqData.status)}\nOleh: ${reqData.staffHrdName || reqData.rejectedBy || '-'}\n\nSilakan refresh.`);
        showTab('leave_requests');
        return;
      }
      
      await updateDoc(reqRef, { 
        status: 'pending_head', 
        staffHrdApprovedAt: new Date().toISOString(), 
        staffHrdName: currentUser.name, 
        staffHrdUsername: currentUser.username
      });
      alert(`✅ Pengajuan diteruskan ke Kepala HRD.\n\nAnda (${currentUser.name}) tercatat sebagai reviewer.`);
      showTab('leave_requests');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  window.staffReject = async (reqId) => {
    try {
      const reqRef = doc(db, 'leaveRequests', reqId);
      const reqSnap = await getDoc(reqRef);
      if (!reqSnap.exists()) { alert('❌ Data tidak ditemukan!'); return; }
      const reqData = reqSnap.data();
      
      // ✅ CEK: Jangan bisa reject pengajuan sendiri
      if (reqData.employeeId === currentUser.employeeId) {
        alert('⚠️ Anda tidak bisa menolak pengajuan cuti sendiri!');
        showTab('leave_requests');
        return;
      }
      
      if (reqData.status !== 'pending_staff' && reqData.status !== 'pending_staff_hrd_peer') {
        alert(`⚠️ Pengajuan ini sudah diproses!\n\nStatus: ${getStatusLabel(reqData.status)}\nOleh: ${reqData.staffHrdName || reqData.rejectedBy || '-'}\n\nSilakan refresh.`);
        showTab('leave_requests');
        return;
      }
      
      await updateDoc(reqRef, { 
        status: 'rejected', 
        rejectedBy: currentUser.name,
        rejectedByUsername: currentUser.username, 
        rejectedAt: new Date().toISOString()
      });
      alert(`✅ Pengajuan ditolak.\n\nAnda (${currentUser.name}) tercatat sebagai penolak.`);
      showTab('leave_requests');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  window.headApprove = async (reqId) => {
    if (!confirm('Setujui pengajuan cuti ini? Saldo cuti karyawan akan otomatis dikurangi.')) return;
    try {
      const reqRef = doc(db, 'leaveRequests', reqId);
      const reqSnap = await getDoc(reqRef);
      if (!reqSnap.exists()) { alert('❌ Data tidak ditemukan!'); return; }
      const reqData = reqSnap.data();

      const eSnap = await getDocs(query(collection(db, 'employees'), where('id', '==', reqData.employeeId)));
      if (!eSnap.empty) {
        const empRef = eSnap.docs[0].ref;
        const empData = eSnap.docs[0].data();
        const days = daysBetween(reqData.startDate, reqData.endDate);
        const newBalance = empData.leaveBalance - days;
        const isDebt = newBalance < 0;
        
        const newHistory = [...(empData.leaveHistory || []), {
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toISOString(),
          type: 'Cuti (Disetujui)', days: days, amount: -days,
          note: `${reqData.reason} | Disetujui: ${currentUser.name}${isDebt ? ' | HUTANG CUTI' : ''}`
        }];
        await updateDoc(empRef, { leaveBalance: newBalance, leaveHistory: newHistory });
      }

      await updateDoc(reqRef, { status: 'approved', headApprovedAt: new Date().toISOString(), approvedBy: currentUser.name });
      alert('✅ Cuti disetujui dan saldo telah dikurangi!');
      showTab('dashboard');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  window.headReject = async (reqId) => {
    if (!confirm('Tolak pengajuan cuti ini?')) return;
    try {
      await updateDoc(doc(db, 'leaveRequests', reqId), { status: 'rejected', rejectedBy: currentUser.name });
      alert('✅ Cuti ditolak.');
      showTab('dashboard');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  // ✅ BARU: Fungsi approval untuk Direktur
  window.directorApprove = async (reqId) => {
    if (!confirm('Setujui pengajuan cuti Kepala HRD ini? Saldo cuti akan otomatis dikurangi.')) return;
    try {
      const reqRef = doc(db, 'leaveRequests', reqId);
      const reqSnap = await getDoc(reqRef);
      if (!reqSnap.exists()) { alert('❌ Data tidak ditemukan!'); return; }
      const reqData = reqSnap.data();

      const eSnap = await getDocs(query(collection(db, 'employees'), where('id', '==', reqData.employeeId)));
      if (!eSnap.empty) {
        const empRef = eSnap.docs[0].ref;
        const empData = eSnap.docs[0].data();
        const days = daysBetween(reqData.startDate, reqData.endDate);
        const newBalance = empData.leaveBalance - days;
        const isDebt = newBalance < 0;
        
        const newHistory = [...(empData.leaveHistory || []), {
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toISOString(),
          type: 'Cuti (Disetujui Direktur)', days: days, amount: -days,
          note: `${reqData.reason} | Disetujui Direktur: ${currentUser.name}${isDebt ? ' | HUTANG CUTI' : ''}`
        }];
        await updateDoc(empRef, { leaveBalance: newBalance, leaveHistory: newHistory });
      }

      await updateDoc(reqRef, { 
        status: 'approved', 
        directorApprovedAt: new Date().toISOString(), 
        directorApprovedBy: currentUser.name 
      });
      alert('✅ Cuti Kepala HRD disetujui dan saldo telah dikurangi!');
      showTab('director_approval');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  window.directorReject = async (reqId) => {
    if (!confirm('Tolak pengajuan cuti Kepala HRD ini?')) return;
    try {
      await updateDoc(doc(db, 'leaveRequests', reqId), { 
        status: 'rejected', 
        directorRejectedBy: currentUser.name,
        directorRejectedAt: new Date().toISOString()
      });
      alert('✅ Cuti ditolak.');
      showTab('director_approval');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  window.approveAdjustment = async (reqId) => {
    if (!confirm('Setujui adjust cuti ini? Saldo karyawan akan berubah.')) return;
    try {
      const reqRef = doc(db, 'adjustmentRequests', reqId);
      const reqSnap = await getDoc(reqRef);
      if (!reqSnap.exists()) return;
      const reqData = reqSnap.data();

      const eSnap = await getDocs(query(collection(db, 'employees'), where('id', '==', reqData.employeeId)));
      if (!eSnap.empty) {
        const empRef = eSnap.docs[0].ref;
        const empData = eSnap.docs[0].data();
        const newBalance = empData.leaveBalance + reqData.adjustmentDays;
        const isDebt = newBalance < 0;
        const newHistory = [...(empData.leaveHistory || []), {
          date: new Date().toISOString().split('T')[0],
          timestamp: new Date().toISOString(),
          type: 'Adjustment (Disetujui)', days: Math.abs(reqData.adjustmentDays),
          amount: reqData.adjustmentDays,
          note: `${reqData.note} | Diajukan: ${reqData.requestedBy}, Disetujui: ${currentUser.name}${isDebt ? ' | HUTANG CUTI' : ''}`
        }];
        await updateDoc(empRef, { leaveBalance: newBalance, leaveHistory: newHistory });
      }

      await updateDoc(reqRef, { status: 'approved', approvedBy: currentUser.name, approvedAt: new Date().toISOString() });
      alert('✅ Adjust cuti disetujui!');
      showTab('dashboard');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  window.rejectAdjustment = async (reqId) => {
    if (!confirm('Tolak request adjust ini?')) return;
    try {
      await updateDoc(doc(db, 'adjustmentRequests', reqId), { 
        status: 'rejected', rejectedBy: currentUser.name, rejectedAt: new Date().toISOString() 
      });
      alert('✅ Request adjust ditolak.');
      showTab('dashboard');
    } catch (e) { alert('❌ Gagal: ' + e.message); }
  };

  async function renderLeaveView() {
    const emps = (await getDocs(collection(db, 'employees'))).docs.map(d => d.data());
    
    const empHistoryMap = {};
    emps.forEach(e => {
      empHistoryMap[e.id] = {
        emp: e,
        history: (e.leaveHistory || []).map(h => ({
          ...h,
          empId: e.id,
          empName: e.name,
          finalBalance: e.leaveBalance,
          isDebt: e.leaveBalance < 0
        }))
      };
    });
    
    Object.keys(empHistoryMap).forEach(empId => {
      const { emp, history } = empHistoryMap[empId];
      
      const sorted = [...history].sort((a, b) => {
        const dateA = a.timestamp || a.date || 0;
        const dateB = b.timestamp || b.date || 0;
        return new Date(dateA).getTime() - new Date(dateB).getTime();
      });
      
      const totalAmount = sorted.reduce((sum, h) => sum + (h.amount || 0), 0);
      const initialBalance = emp.leaveBalance - totalAmount;
      
      let runningBalance = initialBalance;
      sorted.forEach(h => {
        runningBalance += (h.amount || 0);
        h.runningBalance = runningBalance;
      });
      
      empHistoryMap[empId].sortedHistory = sorted;
    });
    
    const allHistory = [];
    Object.values(empHistoryMap).forEach(({ sortedHistory }) => {
      if (sortedHistory) allHistory.push(...sortedHistory);
    });
    
    allHistory.sort((a, b) => {
      const dateA = a.timestamp || a.date || 0;
      const dateB = b.timestamp || b.date || 0;
      return new Date(dateB).getTime() - new Date(dateA).getTime();
    });
    
    const empNames = emps.map(e => e.name).sort();
    
    return `
      <div class="card">
        <h3>📅 Mutasi Cuti Semua Karyawan</h3>
        <div class="hint-box">💡 Data diurutkan dari yang terbaru dengan saldo berjalan (running balance). Gunakan filter untuk melihat mutasi karyawan tertentu.</div>
        
        <div class="filter-bar">
          <label for="filterEmployee">🔍 Filter Karyawan:</label>
          <select id="filterEmployee" onchange="applyLeaveViewFilter()">
            <option value="">-- Semua Karyawan --</option>
            ${empNames.map(n => `<option value="${n}">${n}</option>`).join('')}
          </select>
          <button class="btn btn-secondary btn-sm" onclick="resetLeaveViewFilter()">Reset Filter</button>
        </div>
        
        <div class="table-wrapper">
          <table id="leaveViewTable">
            <thead>
              <tr>
                <th>Tanggal & Waktu</th>
                <th>Karyawan</th>
                <th>Tipe</th>
                <th>Durasi</th>
                <th>Perubahan</th>
                <th>Sisa Cuti</th>
                <th>Catatan</th>
              </tr>
            </thead>
            <tbody id="leaveViewBody">
              ${renderLeaveViewRows(allHistory)}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderLeaveViewRows(historyList) {
    if (historyList.length === 0) {
      return '<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:20px">Tidak ada data mutasi</td></tr>';
    }
    return historyList.map(h => {
      const displayDate = h.timestamp ? fmtDateTime(h.timestamp) : fmtDate(h.date);
      const isDebt = h.runningBalance < 0;
      
      return `
        <tr class="${isDebt ? 'debt-row' : ''}" data-empname="${h.empName}">
          <td><strong>${displayDate}</strong></td>
          <td><strong>${h.empName}</strong> ${isDebt ? '<span class="badge badge-debt">HUTANG</span>' : ''}</td>
          <td>${h.type}</td>
          <td>${h.days} hari</td>
          <td><span class="badge ${h.amount > 0 ? 'badge-plus' : 'badge-minus'}">${h.amount > 0 ? '+' : ''}${h.amount} hari</span></td>
          <td><strong style="color: ${isDebt ? '#dc2626' : '#4f46e5'}">${h.runningBalance}</strong> hari</td>
          <td style="color:#64748b;font-size:11px">${h.note || '-'}</td>
        </tr>
      `;
    }).join('');
  }

  window.applyLeaveViewFilter = function() {
    const filterName = document.getElementById('filterEmployee').value;
    const rows = document.querySelectorAll('#leaveViewBody tr');
    
    rows.forEach(row => {
      if (row.dataset.empname) {
        if (filterName === '' || row.dataset.empname === filterName) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      }
    });
  };

  window.resetLeaveViewFilter = function() {
    document.getElementById('filterEmployee').value = '';
    applyLeaveViewFilter();
  };

  async function renderMonthlyReport() {
    try {
      const report = await ensureMonthlyReport();
      
      if (!report) {
        return `
          <div class="card">
            <h3>📊 Laporan Bulanan</h3>
            <div class="hint-box warning">⏳ Laporan akan otomatis digenerate pada <strong>tanggal 11</strong> setiap bulannya.<br>Saat ini masih tanggal ${new Date().getDate()}, silakan cek kembali nanti.</div>
            <div class="empty-state"><div class="icon">📊</div><p>Laporan belum tersedia untuk bulan ini.</p></div>
          </div>
        `;
      }
      
      const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const [year, month] = report.monthKey.split('-');
      const monthLabel = `${monthNames[parseInt(month) - 1]} ${year}`;
      
      return `
        <div class="card">
          <h3>📊 Laporan Bulanan - ${monthLabel}</h3>
          <div class="hint-box success">✅ Laporan otomatis digenerate pada ${fmtDateTime(report.generatedAt)}</div>
          <div class="stats-grid">
            <div class="stat-card indigo"><div class="label">Total Karyawan</div><div class="value">${report.totalEmployees}</div></div>
            <div class="stat-card sky"><div class="label">Total Pengajuan</div><div class="value">${report.totalLeaveRequests}</div></div>
            <div class="stat-card emerald"><div class="label">Disetujui</div><div class="value">${report.approved}</div></div>
            <div class="stat-card rose"><div class="label">Ditolak</div><div class="value">${report.rejected}</div></div>
            <div class="stat-card amber"><div class="label">Menunggu</div><div class="value">${report.pending}</div></div>
            <div class="stat-card indigo"><div class="label">Total Hari Cuti</div><div class="value">${report.totalLeaveDaysUsed}</div></div>
            <div class="stat-card sky"><div class="label">Rata-rata/Karyawan</div><div class="value" style="font-size:18px">${report.averageLeavePerEmployee} hr</div></div>
            <div class="stat-card emerald"><div class="label">Total Saldo Perusahaan</div><div class="value" style="font-size:18px">${report.totalBalanceCompany} hr</div></div>
          </div>
        </div>
        <div class="chart-grid">
          <div class="chart-card"><h4>📊 Distribusi Status Pengajuan</h4><div class="chart-container"><canvas id="chartStatus"></canvas></div></div>
          <div class="chart-card"><h4>🏆 Top 5 Pengguna Cuti Terbanyak</h4><div class="chart-container"><canvas id="chartTopUsers"></canvas></div></div>
          <div class="chart-card"><h4> Distribusi Alasan Cuti</h4><div class="chart-container"><canvas id="chartReason"></canvas></div></div>
          <div class="chart-card"><h4>💰 Distribusi Saldo Cuti Karyawan</h4><div class="chart-container"><canvas id="chartBalance"></canvas></div></div>
        </div>
        ${report.employeesWithDebt.length > 0 ? `
          <div class="card">
            <h3>⚠️ Karyawan dengan Hutang Cuti (${report.employeesWithDebt.length})</h3>
            <div class="table-wrapper">
              <table>
                <thead><tr><th>Nama</th><th>Jumlah Hutang</th><th>ID</th></tr></thead>
                <tbody>${report.employeesWithDebt.map(e => `<tr class="debt-row"><td><strong>${e.name}</strong></td><td><span class="badge badge-debt">${e.debt} hari</span></td><td>${e.id}</td></tr>`).join('')}</tbody>
              </table>
            </div>
          </div>
        ` : ''}
        <div class="card">
          <h3>📋 Ringkasan Analisis</h3>
          <div style="line-height: 1.8; color: #475569;">
            <p>📌 <strong>Tingkat Persetujuan:</strong> ${report.totalLeaveRequests > 0 ? Math.round((report.approved / report.totalLeaveRequests) * 100) : 0}% dari total pengajuan disetujui</p>
            <p>📌 <strong>Rata-rata cuti per karyawan:</strong> ${report.averageLeavePerEmployee} hari/bulan</p>
            <p>📌 <strong>Rata-rata saldo cuti:</strong> ${report.averageBalance} hari/karyawan</p>
            <p>📌 <strong>Karyawan dengan hutang:</strong> ${report.employeesWithDebt.length} dari ${report.totalEmployees} karyawan (${report.totalEmployees > 0 ? Math.round((report.employeesWithDebt.length / report.totalEmployees) * 100) : 0}%)</p>
            <p> <strong>Total adjustment cuti bulan ini:</strong> ${report.totalAdjustments} request (${report.approvedAdjustments} disetujui)</p>
          </div>
        </div>
      `;
    } catch (e) { return `<div class="card"><div class="hint-box danger">❌ Error: ${e.message}</div></div>`; }
  }

  function renderCharts(report) {
    ['chartStatus', 'chartTopUsers', 'chartReason', 'chartBalance'].forEach(id => {
      const canvas = document.getElementById(id);
      if (canvas) {
        const existingChart = Chart.getChart(canvas);
        if (existingChart) existingChart.destroy();
      }
    });
    if (!report) return;
    
    new Chart(document.getElementById('chartStatus'), {
      type: 'doughnut',
      data: { labels: ['Disetujui', 'Ditolak', 'Menunggu'], datasets: [{ data: [report.approved, report.rejected, report.pending], backgroundColor: ['#10b981', '#ef4444', '#f59e0b'], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
    
    new Chart(document.getElementById('chartTopUsers'), {
      type: 'bar',
      data: { labels: report.topLeaveUsers.map(u => u.name), datasets: [{ label: 'Hari Cuti', data: report.topLeaveUsers.map(u => u.days), backgroundColor: '#4f46e5', borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
    
    const reasonEntries = Object.entries(report.leaveByReason);
    const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#0ea5e9', '#8b5cf6', '#ec4899'];
    new Chart(document.getElementById('chartReason'), {
      type: 'pie',
      data: { labels: reasonEntries.map(e => e[0]), datasets: [{ data: reasonEntries.map(e => e[1]), backgroundColor: colors.slice(0, reasonEntries.length) }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } }
    });
    
    new Chart(document.getElementById('chartBalance'), {
      type: 'doughnut',
      data: { labels: ['Saldo Positif', 'Saldo 0', 'Hutang (Minus)'], datasets: [{ data: [report.balanceDistribution.positive, report.balanceDistribution.zero, report.balanceDistribution.negative], backgroundColor: ['#10b981', '#94a3b8', '#ef4444'], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
  }

  const __origShowTab = showTab;
  showTab = async (id) => {
    await __origShowTab(id);
    if (id === 'monthly_report') {
      setTimeout(() => {
        const reportId = `report_${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
        getDoc(doc(db, 'monthlyReports', reportId)).then(snap => {
          if (snap.exists()) renderCharts(snap.data());
        });
      }, 100);
    }
  };

  function renderChangePassword() {
    return `
      <div class="card">
        <h3>🔒 Ganti Password</h3>
        <div class="hint-box">Password akan disimpan di Firestore dan tersinkronisasi ke semua device.</div>
        <div class="form-group"><label>Password Lama</label><input type="password" id="oldPassword"></div>
        <div class="form-group"><label>Password Baru</label><input type="password" id="newPassword"></div>
        <div class="form-group"><label>Konfirmasi Password Baru</label><input type="password" id="confirmPassword"></div>
        <button class="btn btn-primary" style="width:auto" onclick="handleChangePassword()">Update Password</button>
      </div>
    `;
  }

  window.handleChangePassword = async () => {
    const oldPass = document.getElementById('oldPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    if (!oldPass || !newPass || !confirmPass) { alert('Lengkapi semua field!'); return; }
    if (oldPass !== currentUser.password) { alert('Password lama salah!'); return; }
    if (newPass !== confirmPass) { alert('Password baru tidak cocok!'); return; }
    if (newPass.length < 4) { alert('Password minimal 4 karakter!'); return; }
    try {
      await updateDoc(doc(db, 'users', currentUserDocId), { password: newPass });
      currentUser.password = newPass;
      sessionStorage.setItem('hrd_user', JSON.stringify(currentUser));
      alert('✅ Password berhasil diubah! Silakan login ulang.');
      doLogout();
    } catch (e) { alert('Gagal: ' + e.message); }
  };

  window.openModal = (html) => {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
  };
  window.closeModal = () => { document.getElementById('modalOverlay').classList.remove('active'); };
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') window.closeModal();
  });

  function renderLeaveHistory(history) {
    if (!history || history.length === 0) {
      return `<div class="empty-state" style="padding:20px"><div class="icon">📋</div><p>Belum ada mutasi cuti</p></div>`;
    }
    
    const sorted = [...history].sort((a, b) => {
      const dateA = a.timestamp || a.date || 0;
      const dateB = b.timestamp || b.date || 0;
      return new Date(dateA).getTime() - new Date(dateB).getTime();
    });
    
    const totalAmount = sorted.reduce((sum, h) => sum + (h.amount || 0), 0);
    const currentBalance = history.length > 0 ? history[history.length - 1].runningBalance || 0 : 0;
    const initialBalance = currentBalance - totalAmount;
    
    let runningBalance = initialBalance;
    sorted.forEach(h => {
      runningBalance += (h.amount || 0);
      h.runningBalance = runningBalance;
    });
    
    const rows = sorted.slice().reverse().map(h => {
      const displayDate = h.timestamp ? fmtDateTime(h.timestamp) : fmtDate(h.date);
      return `
        <tr>
          <td>${displayDate}</td>
          <td>${h.type}</td>
          <td>${h.days} hari</td>
          <td><span class="badge ${h.amount > 0 ? 'badge-plus' : 'badge-minus'}">${h.amount > 0 ? '+' : ''}${h.amount} hari</span></td>
          <td><strong style="color: ${h.runningBalance < 0 ? '#dc2626' : '#4f46e5'}">${h.runningBalance}</strong> hari</td>
          <td style="color:#64748b;font-size:11px">${h.note || '-'}</td>
        </tr>
      `;
    }).join('');
    
    return `<div class="table-wrapper"><table><thead><tr><th>Tanggal</th><th>Tipe</th><th>Durasi</th><th>Perubahan</th><th>Sisa Cuti</th><th>Catatan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  seedData().then(() => { checkSession(); });
</script>
</body>
